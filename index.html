<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>BLOCK CRAFT 3D</title>
  <meta name="description" content="3Dブロックで自由に作れるモバイル向けクラフトゲーム">
  <meta name="theme-color" content="#1a1a24">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="BlockCraft">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icons/favicon.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #1a1a24;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #canvas-container {
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    /* 🕹️ 左側 バーチャルパッド（ツールバーの上に配置） */
    #joystick-zone {
      position: absolute;
      bottom: calc(max(10px, env(safe-area-inset-bottom)) + 70px);
      left: 15px;
      width: 100px;
      height: 100px;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(8px);
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      touch-action: none;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #joystick-knob {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      border: 2px solid #fff;
      border-radius: 50%;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      position: absolute;
      pointer-events: none;
      transition: transform 0.05s ease-out;
    }
    #joystick-label {
      position: absolute;
      top: -22px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 11px;
      color: rgba(255,255,255,0.8);
      font-weight: bold;
      white-space: nowrap;
      pointer-events: none;
      text-shadow: 0 1px 3px rgba(0,0,0,0.8);
    }

    /* 上部ステータス */
    #top-bar {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
      z-index: 5;
    }
    .badge {
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(8px);
      color: #fff;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: bold;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    /* 🔘 アクションボタン（画面右下・ツールバーの上に配置） */
    #action-btn {
      position: absolute;
      bottom: calc(max(10px, env(safe-area-inset-bottom)) + 70px);
      right: 15px;
      width: 70px;
      height: 70px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: #fff;
      font-size: 12px;
      font-weight: bold;
      box-shadow: 0 8px 25px rgba(37, 99, 235, 0.5);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      z-index: 20;
      transition: transform 0.1s ease;
    }
    #action-btn:active { transform: scale(0.9); }
    #action-btn.delete-mode {
      background: linear-gradient(135deg, #dc2626, #991b1b);
      box-shadow: 0 8px 25px rgba(220, 38, 38, 0.5);
    }
    #action-btn span { font-size: 20px; line-height: 1; }

    /* 下部UIツールバー */
    #toolbar {
      position: absolute;
      bottom: max(10px, env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 4px;
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(14px);
      padding: 6px 10px;
      border-radius: 22px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      max-width: 96vw;
      z-index: 25;
    }
    .toolbar-sep {
      width: 1px;
      background: rgba(0,0,0,0.12);
      align-self: stretch;
      margin: 3px 2px;
      flex-shrink: 0;
    }

    .btn {
      border: none;
      background: #f0f0f5;
      color: #333;
      padding: 6px 8px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      min-width: 46px;
      flex-shrink: 0;
      transition: all 0.15s ease;
    }
    .btn:active { transform: scale(0.92); }
    .btn.active { background: #2563eb; color: #fff; }

    /* モードトグルボタン */
    #btn-mode {
      background: #2563eb;
      color: #fff;
      min-width: 58px;
    }
    #btn-mode.delete-mode {
      background: #dc2626;
    }

    /* カラードット */
    .color-dot {
      display: inline-block;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 2px solid rgba(0,0,0,0.18);
      vertical-align: middle;
      flex-shrink: 0;
    }

    /* ブロック種ラベル */
    #block-type-label {
      font-size: 9px;
      color: #2563eb;
      font-weight: bold;
      line-height: 1;
    }

    /* その他メニュー（縦型） */
    #more-menu {
      flex-direction: column !important;
      width: 200px;
      gap: 4px !important;
    }
    #more-menu .opt-btn {
      text-align: left;
      width: 100%;
    }
    #more-menu .opt-btn.danger {
      color: #ff7070;
      border-top: 1px solid rgba(255,255,255,0.15);
      padding-top: 10px;
      margin-top: 4px;
    }

    /* サブメニュー（ツールバーのすぐ上に表示） */
    .sub-menu {
      position: absolute;
      bottom: calc(max(10px, env(safe-area-inset-bottom)) + 64px);
      left: 50%;
      transform: translateX(-50%);
      display: none;
      gap: 8px;
      background: rgba(20, 20, 30, 0.92);
      backdrop-filter: blur(14px);
      padding: 10px 14px;
      border-radius: 18px;
      z-index: 30;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      border: 1px solid rgba(255,255,255,0.08);
    }
    .color-swatch {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 2px solid #fff;
      cursor: pointer;
    }
    .color-swatch.active { transform: scale(1.25); border-color: #ffd700; }
    .opt-btn {
      background: rgba(255,255,255,0.2);
      color: #fff;
      border: none;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
    }
    .opt-btn.active { background: #2563eb; }

    /* ブロックピッカー */
    #block-picker {
      flex-direction: column;
      width: 310px;
      max-height: 52vh;
      overflow-y: auto;
      gap: 5px;
    }
    .bp-section-title {
      font-size: 10px;
      font-weight: bold;
      color: rgba(255,255,255,0.5);
      letter-spacing: 0.5px;
      padding: 2px 0 1px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    .bp-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }
    .bp-grid .opt-btn {
      min-width: 42px;
      padding: 5px 6px;
      font-size: 10px;
      font-weight: bold;
    }

    /* 作品管理メニューのスタイル */
    #save-picker {
      flex-direction: column;
      width: 280px;
      max-height: 320px;
      overflow-y: auto;
    }
    .save-input-group {
      display: flex;
      gap: 6px;
      margin-bottom: 6px;
    }
    .save-input-group input {
      flex: 1;
      padding: 6px 10px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.3);
      background: rgba(255,255,255,0.1);
      color: #fff;
      font-size: 12px;
    }
    .save-input-group input::placeholder { color: #aaa; }
    .save-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 180px;
      overflow-y: auto;
    }
    .save-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255,255,255,0.1);
      padding: 6px 10px;
      border-radius: 8px;
      color: #fff;
      font-size: 12px;
    }
    .save-item-btns {
      display: flex;
      gap: 4px;
    }
    .save-item-btns button {
      padding: 4px 8px;
      border-radius: 6px;
      border: none;
      font-size: 10px;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-load { background: #2563eb; color: #fff; }
    .btn-del { background: #dc2626; color: #fff; }
    .file-io-group {
      display: flex;
      gap: 6px;
      margin-top: 6px;
      border-top: 1px solid rgba(255,255,255,0.2);
      padding-top: 6px;
    }
    /* ===== FPS モード ===== */
    #mode-switch-btn {
      position: absolute;
      top: 12px; left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(8px);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.2);
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 12px; font-weight: bold;
      cursor: pointer; z-index: 30;
      transition: background 0.2s, transform 0.1s;
      white-space: nowrap;
    }
    #mode-switch-btn:active { transform: translateX(-50%) scale(0.95); }
    #mode-switch-btn.fps-active { background: rgba(37,99,235,0.8); border-color: rgba(99,179,237,0.4); }

    #fps-overlay {
      display: none;
      position: absolute; inset: 0;
      pointer-events: none; z-index: 15;
    }
    #crosshair {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 20px; height: 20px;
    }
    #crosshair::before, #crosshair::after {
      content: ''; position: absolute;
      background: rgba(255,255,255,0.88);
      box-shadow: 0 0 2px rgba(0,0,0,0.8);
    }
    #crosshair::before { width: 2px; height: 100%; left: 50%; transform: translateX(-50%); }
    #crosshair::after  { height: 2px; width: 100%; top: 50%; transform: translateY(-50%); }
    #fly-indicator {
      display: none;
      position: absolute; top: 58px; left: 50%;
      transform: translateX(-50%);
      background: rgba(37,99,235,0.85); color: #fff;
      padding: 4px 14px; border-radius: 14px;
      font-size: 12px; font-weight: bold;
      border: 1px solid rgba(255,255,255,0.2);
    }
    #delete-ring {
      display: none;
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 56px; height: 56px;
    }
    #delete-ring svg { transform: rotate(-90deg); }
    #delete-ring circle {
      fill: none; stroke: #ef4444; stroke-width: 4;
      stroke-dasharray: 132; stroke-dashoffset: 132;
      stroke-linecap: round;
    }

    #fps-edit-btns {
      display: flex;
      position: absolute;
      bottom: calc(max(10px, env(safe-area-inset-bottom)) + 150px);
      right: 15px;
      flex-direction: row;
      gap: 6px;
      z-index: 20;
    }
    .fps-edit-btn {
      width: 48px; height: 48px; border-radius: 50%;
      border: 1.5px solid rgba(255,255,255,0.35);
      background: rgba(20,20,40,0.72);
      backdrop-filter: blur(8px);
      color: #fff; font-size: 20px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.45);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: transform 0.1s;
      touch-action: manipulation;
    }
    .fps-edit-btn:active { transform: scale(0.88); }

    #jump-btn {
      display: none;
      position: absolute;
      bottom: calc(max(10px, env(safe-area-inset-bottom)) + 212px);
      right: 15px;
      width: 56px; height: 56px; border-radius: 50%;
      border: none;
      background: linear-gradient(135deg, #16a34a, #15803d);
      color: #fff; font-size: 22px;
      box-shadow: 0 6px 18px rgba(22,163,74,0.5);
      cursor: pointer; flex-direction: column;
      align-items: center; justify-content: center;
      z-index: 20; transition: transform 0.1s;
    }
    #jump-btn:active { transform: scale(0.9); }

    #fly-down-btn {
      display: none;
      position: absolute;
      bottom: calc(max(10px, env(safe-area-inset-bottom)) + 282px);
      right: 15px;
      width: 56px; height: 56px; border-radius: 50%;
      border: none;
      background: linear-gradient(135deg, #ca8a04, #a16207);
      color: #fff; font-size: 22px;
      box-shadow: 0 6px 18px rgba(202,138,4,0.4);
      cursor: pointer; flex-direction: column;
      align-items: center; justify-content: center;
      z-index: 20; transition: transform 0.1s;
    }
    #fly-down-btn:active { transform: scale(0.9); }

    #fps-action-btn {
      display: none;
      position: absolute;
      bottom: calc(max(10px, env(safe-area-inset-bottom)) + 70px);
      right: 15px;
      width: 70px; height: 70px; border-radius: 50%;
      border: none;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: #fff; font-size: 12px; font-weight: bold;
      box-shadow: 0 8px 25px rgba(37,99,235,0.5);
      cursor: pointer; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 2px; z-index: 20; touch-action: none;
      transition: transform 0.1s, background 0.2s;
    }
    #fps-action-btn:active { transform: scale(0.9); }
    #fps-action-btn.deleting {
      background: linear-gradient(135deg, #dc2626, #991b1b);
      box-shadow: 0 8px 25px rgba(220,38,38,0.5);
    }
    #fps-action-btn span { font-size: 20px; line-height: 1; }

    #fps-toolbar {
      display: none;
      position: absolute;
      bottom: max(10px, env(safe-area-inset-bottom));
      left: 50%; transform: translateX(-50%);
      align-items: center; gap: 4px;
      background: rgba(255,255,255,0.88);
      backdrop-filter: blur(14px);
      padding: 6px 10px; border-radius: 22px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      max-width: 96vw; z-index: 25;
    }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="canvas-container"></div>

  <!-- 左側 バーチャルパッド (視点操作) -->
  <div id="joystick-zone">
    <div id="joystick-label">移動</div>
    <div id="joystick-knob"></div>
  </div>

  <div id="top-bar">
    <div class="badge">BLOCK CRAFT</div>
    <div class="badge" id="block-count">ブロック数: 0</div>
  </div>

  <!-- アクション執行ボタン -->
  <button id="action-btn" onclick="executeAction()">
    <span id="action-icon">🧱</span>
    <div id="action-text">配置</div>
  </button>

  <!-- ブロック種類選択（JS で動的生成） -->
  <div id="block-picker" class="sub-menu"></div>

  <!-- 色選択 -->
  <div id="color-picker" class="sub-menu"></div>

  <!-- カメラ固定切替 -->
  <div id="camera-picker" class="sub-menu">
    <button class="opt-btn" onclick="setCameraView('front')">正面</button>
    <button class="opt-btn" onclick="setCameraView('top')">真上</button>
    <button class="opt-btn" onclick="setCameraView('iso')">斜め</button>
  </div>

  <!-- 作品管理メニュー -->
  <div id="save-picker" class="sub-menu">
    <div class="save-input-group">
      <input type="text" id="save-name-input" placeholder="作品名を入力...">
      <button class="opt-btn" onclick="saveCurrentSlot()">保存</button>
    </div>
    <div class="save-list" id="save-list-container"></div>
    <div class="file-io-group">
      <button class="opt-btn" style="flex: 1;" onclick="exportAllSaves()">💾 出力</button>
      <button class="opt-btn" style="flex: 1;" onclick="document.getElementById('import-file-input').click()">📂 読込</button>
      <input type="file" id="import-file-input" accept=".json" style="display:none" onchange="importAllSaves(event)">
    </div>
  </div>

  <!-- モード切替（常時表示） -->
  <button id="mode-switch-btn" onclick="switchMode()">🎮 FPSモード</button>

  <!-- FPS オーバーレイ -->
  <div id="fps-overlay">
    <div id="crosshair"></div>
    <div id="fly-indicator">✈ 飛行中</div>
    <div id="delete-ring">
      <svg viewBox="0 0 56 56" width="56" height="56">
        <circle cx="28" cy="28" r="21"/>
      </svg>
    </div>
  </div>

  <!-- FPS 回転・位置ずらしボタン（配置ボタンの上） -->
  <div id="fps-edit-btns">
    <button class="fps-edit-btn" onclick="rotatePreview()" title="回転">🔄</button>
    <button class="fps-edit-btn" onclick="shiftSnapOffset()" title="位置ずらし">↔️</button>
  </div>

  <!-- 下降ボタン（飛行中のみ表示） -->
  <button id="fly-down-btn">⬇</button>

  <!-- ジャンプ / 上昇ボタン -->
  <button id="jump-btn">⬆</button>

  <!-- FPS アクション（タップ=配置 / 長押し=削除） -->
  <button id="fps-action-btn">
    <span>🧱</span>
    <div>配置/削除</div>
  </button>

  <!-- FPS ツールバー -->
  <div id="fps-toolbar">
    <button class="btn" onclick="toggleMenu('block-picker')">
      <span>🧱</span>
      <div id="fps-block-label">1×1</div>
    </button>
    <button class="btn" onclick="toggleMenu('color-picker')">
      <span id="fps-color-dot" class="color-dot"></span>
      <div>カラー</div>
    </button>
    <div class="toolbar-sep"></div>
    <button class="btn" id="btn-fly" onclick="toggleFlyMode()">
      <span>✈</span>
      <div>飛行</div>
    </button>
    <div class="toolbar-sep"></div>
    <button class="btn" onclick="enterBuildMode()">
      <span>🏗</span>
      <div>建築へ</div>
    </button>
  </div>

  <!-- その他メニュー -->
  <div id="more-menu" class="sub-menu">
    <button class="opt-btn" onclick="toggleMenu('save-picker')">💾 作品を管理</button>
    <button class="opt-btn danger" onclick="toggleMenu(''); clearAllBlocks()">💥 全消去</button>
  </div>

  <!-- ツールバー（スリム6ボタン構成） -->
  <div id="toolbar">
    <!-- グループ1: モードトグル -->
    <button class="btn" id="btn-mode" onclick="toggleMode()">
      <span id="mode-icon">➕</span>
      <div id="mode-label">配置</div>
    </button>

    <div class="toolbar-sep"></div>

    <!-- グループ2: ブロック設定 -->
    <button class="btn" id="btn-block-type" onclick="toggleMenu('block-picker')">
      <span>🧱</span>
      <div id="block-type-label">1×1</div>
    </button>
    <button class="btn" id="btn-color" onclick="toggleMenu('color-picker')">
      <span id="color-dot-btn" class="color-dot"></span>
      <div>カラー</div>
    </button>

    <div class="toolbar-sep"></div>

    <!-- グループ3: 操作 -->
    <button class="btn" onclick="undoLastAction()"><span>↩️</span>Undo</button>
    <button class="btn" onclick="toggleMenu('camera-picker')"><span>🎥</span>視点</button>

    <div class="toolbar-sep"></div>

    <!-- グループ4: その他 -->
    <button class="btn" onclick="toggleMenu('more-menu')"><span>⋯</span>その他</button>
  </div>

  <script>
    // --- 🔊 音声・バイブ ---
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(type) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      if (type === 'place') {
        osc.frequency.setValueAtTime(600, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 0.05);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.05);
      } else if (type === 'delete') {
        osc.frequency.setValueAtTime(180, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(60, audioCtx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.08);
      }
    }

    function triggerVibrate() {
      if (navigator.vibrate) navigator.vibrate(12);
    }

    // --- データ構造 ---
    const occupiedGrid = new Map();
    const blocksHistory = [];
    const blockMeshes = [];

    let mode = 'add';
    let currentBlockType = '1x1';
    let currentColor = 0xee2222;
    let currentRotation = 0;
    let snapOffsetX = 0;
    let snapOffsetZ = 0;

    // ===== FPS モード =====
    let gameMode = 'build';

    const PLAYER_H   = 1.8;
    const PLAYER_EYE = 1.62;
    const PLAYER_R   = 0.28;
    const GRAVITY    = -22;
    const JUMP_FORCE = 9;
    const WALK_SPEED = 5;
    const FLY_SPEED  = 8;

    const player = {
      pos: new THREE.Vector3(0, 0, 0),
      vel: new THREE.Vector3(0, 0, 0),
      yaw: Math.PI / 4,
      pitch: 0,
      onGround: false,
      isFlying: false,
    };

    let lastFPSTime = 0;

    // FPSスワイプ視点
    let fpsLookTouchId = null;
    let fpsLookLastX = 0, fpsLookLastY = 0;

    // FPSアクション長押し
    let fpsLongPressTimer = null;
    let fpsTick = null;
    let fpsActionStartTime = 0;
    const LONG_PRESS_MS = 600;
    const RING_CIRC = 132;

    const palette = [0xee2222, 0x2277ee, 0xffcc00, 0x22aa44, 0xffffff, 0x222222, 0x9933ee];

    // --- Three.js セットアップ ---
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1a1a24);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    
    // カメラアングル（極座標管理）
    let cameraRadius = 25;
    let cameraTheta = Math.PI / 4;  // 方位角
    let cameraPhi = Math.PI / 3;    // 仰角
    const cameraTarget = new THREE.Vector3(0, 0, 0); // 注視点

    function updateCameraPosition() {
      camera.position.x = cameraTarget.x + cameraRadius * Math.sin(cameraPhi) * Math.sin(cameraTheta);
      camera.position.y = cameraTarget.y + cameraRadius * Math.cos(cameraPhi);
      camera.position.z = cameraTarget.z + cameraRadius * Math.sin(cameraPhi) * Math.cos(cameraTheta);
      camera.lookAt(cameraTarget);
    }
    updateCameraPosition();

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    container.appendChild(renderer.domElement);

    // ライティング
    scene.add(new THREE.AmbientLight(0xffffff, 0.6));
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(25, 40, 25);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.set(2048, 2048);
    scene.add(dirLight);

    // 床 (50x50)
    const GRID_SIZE = 50;
    const planeGeo = new THREE.PlaneGeometry(GRID_SIZE, GRID_SIZE);
    const planeMat = new THREE.MeshStandardMaterial({ color: 0x2b2d35, roughness: 0.8 });
    const plane = new THREE.Mesh(planeGeo, planeMat);
    plane.rotation.x = -Math.PI / 2;
    plane.position.y = -0.001; // ブロック底面（y=0）との表示競合（めり込み・ちらつき）を防ぐため微修正
    plane.receiveShadow = true;
    scene.add(plane);

    const gridHelper = new THREE.GridHelper(GRID_SIZE, GRID_SIZE, 0x555566, 0x333344);
    gridHelper.position.y = 0;
    scene.add(gridHelper);

    // プレビュー変数
    let previewMesh = createPreviewMesh();
    scene.add(previewMesh);
    let isCanPlace = false;
    let targetOccupiedCells = [];
    let hoveredGroup = null;

    const raycaster = new THREE.Raycaster();
    const mouseVector = new THREE.Vector2(-999, -999); // スワイプ検知座標

    // --- ロジック関数 ---
    function getBlockDimensions(type, rot = currentRotation) {
      if (type === 'wheel') return { w: 1, d: 1, h: 1 };
      const isPlate = type.endsWith('p');
      const base = isPlate ? type.slice(0, -1) : type;
      const parts = base.split('x');
      let w = parseInt(parts[0]), d = parseInt(parts[1] || parts[0]);
      let h = isPlate ? 0.5 : 1;
      if ((rot / 90) % 2 !== 0) { const tmp = w; w = d; d = tmp; }
      return { w, d, h };
    }

    function blockLabel(type) {
      if (type === 'wheel') return 'タイヤ';
      const isPlate = type.endsWith('p');
      const base = isPlate ? type.slice(0, -1) : type;
      const [w, d] = base.split('x');
      return `${w}×${d}${isPlate ? '薄' : ''}`;
    }

    function getOccupiedCells(originX, originHY, originZ, type, rot) {
      if (type === 'wheel') return getWheelCells(originX, originHY, originZ, rot);
      const dim = getBlockDimensions(type, rot);
      const cells = [];
      const hCells = Math.round(dim.h * 2); // 半グリッド単位: 標準=2, 薄板=1
      for (let x = 0; x < dim.w; x++) {
        for (let z = 0; z < dim.d; z++) {
          for (let hy = 0; hy < hCells; hy++) {
            cells.push(`${originX + x},${originHY + hy},${originZ + z}`);
          }
        }
      }
      return cells;
    }

    function getWheelCells(originX, originHY, originZ, rot) {
      const cells = [];
      const rotSteps = (Math.round(rot / 90) % 4 + 4) % 4;
      let axleX = 0, axleZ = 0;
      if      (rotSteps === 0) { axleX =  1; }
      else if (rotSteps === 1) { axleZ =  1; }
      else if (rotSteps === 2) { axleX = -1; }
      else                     { axleZ = -1; }

      // 本体: 半グリッド2セル(= 1フルユニット)
      cells.push(`${originX},${originHY},${originZ}`);
      cells.push(`${originX},${originHY+1},${originZ}`);

      // 車輪: アクスル先端を中心に Y方向±1フルユニット × 垂直方向3列
      // 各フルユニットY = 半グリッド2セル
      const wx = originX + axleX;
      const wz = originZ + axleZ;
      for (let dy = -1; dy <= 1; dy++) {          // フルユニットYオフセット
        const hy = originHY + dy * 2;              // 半グリッドY基点
        for (let dp = -1; dp <= 1; dp++) {         // 垂直方向オフセット
          const cx = axleX !== 0 ? wx : originX + dp;
          const cz = axleZ !== 0 ? wz : originZ + dp;
          cells.push(`${cx},${hy},${cz}`);
          cells.push(`${cx},${hy+1},${cz}`);
        }
      }
      return cells;
    }

    function canPlaceBlock(cells) {
      for (let key of cells) {
        const [x, y, z] = key.split(',').map(Number);
        if (y < 0 || Math.abs(x) >= GRID_SIZE / 2 || Math.abs(z) >= GRID_SIZE / 2) return false;
        if (occupiedGrid.has(key)) return false;
      }
      return true;
    }

    function createBlockMesh(type, color, rot) {
      if (type === 'wheel') return createWheelMesh(color, rot);
      const dim = getBlockDimensions(type, rot);
      const group = new THREE.Group();
      const mat = new THREE.MeshStandardMaterial({ color, roughness: 0.3 });

      const body = new THREE.Mesh(new THREE.BoxGeometry(dim.w - 0.01, dim.h - 0.01, dim.d - 0.01), mat);
      body.castShadow = true;
      body.receiveShadow = true;
      body.position.set(dim.w / 2 - 0.5, dim.h / 2, dim.d / 2 - 0.5);
      group.add(body);

      const studGeo = new THREE.CylinderGeometry(0.2, 0.2, 0.12, 12);
      for (let x = 0; x < dim.w; x++) {
        for (let z = 0; z < dim.d; z++) {
          const stud = new THREE.Mesh(studGeo, mat);
          stud.position.set(x, dim.h + 0.02, z);
          stud.castShadow = true;
          group.add(stud);
        }
      }
      return group;
    }

    function createWheelMesh(color, rot) {
      const group = new THREE.Group();
      const mat = new THREE.MeshStandardMaterial({ color, roughness: 0.3 });
      const tireMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.95 });

      const rotSteps = (Math.round(rot / 90) % 4 + 4) % 4;
      let axleX = 0, axleZ = 0;
      if      (rotSteps === 0) { axleX =  1; }
      else if (rotSteps === 1) { axleZ =  1; }
      else if (rotSteps === 2) { axleX = -1; }
      else                     { axleZ = -1; }

      // 本体ブロック (1×1×1)
      const body = new THREE.Mesh(new THREE.BoxGeometry(0.99, 0.99, 0.99), mat);
      body.castShadow = true;
      body.receiveShadow = true;
      body.position.set(0, 0.5, 0);
      group.add(body);

      // 本体上スタッド
      const studGeo = new THREE.CylinderGeometry(0.2, 0.2, 0.12, 12);
      const stud = new THREE.Mesh(studGeo, mat);
      stud.castShadow = true;
      stud.position.set(0, 1.02, 0);
      group.add(stud);

      // アクスル (本体中心→車輪中心)
      const axleGeo = new THREE.CylinderGeometry(0.1, 0.1, 1.0, 8);
      const axleMesh = new THREE.Mesh(axleGeo, mat);
      axleMesh.castShadow = true;
      axleMesh.position.set(axleX * 0.5, 0.5, axleZ * 0.5);
      if (axleX !== 0) axleMesh.rotation.z = Math.PI / 2;
      else             axleMesh.rotation.x = Math.PI / 2;
      group.add(axleMesh);

      // タイヤ外周 (トーラス、黒)
      const tireGeo = new THREE.TorusGeometry(0.95, 0.38, 8, 20);
      const tire = new THREE.Mesh(tireGeo, tireMat);
      tire.castShadow = true;
      tire.position.set(axleX, 0.5, axleZ);
      // Three.js TorusGeometry はデフォルトで X-Y平面 (Z軸がホール方向)
      // アクスルがX方向の場合 → ホールをX軸方向にするため rotation.y = π/2
      if (axleX !== 0) tire.rotation.y = Math.PI / 2;
      group.add(tire);

      // ホイールハブ (内側円板、ブロックカラー)
      const rimGeo = new THREE.CylinderGeometry(0.5, 0.5, 0.42, 12);
      const rim = new THREE.Mesh(rimGeo, mat);
      rim.castShadow = true;
      rim.position.set(axleX, 0.5, axleZ);
      if (axleX !== 0) rim.rotation.z = Math.PI / 2;
      else             rim.rotation.x = Math.PI / 2;
      group.add(rim);

      return group;
    }

    function createPreviewMesh() {
      if (currentBlockType === 'wheel') return createWheelPreviewMesh(currentRotation);
      const dim = getBlockDimensions(currentBlockType, currentRotation);
      const geo = new THREE.BoxGeometry(dim.w - 0.02, dim.h - 0.02, dim.d - 0.02);
      const mat = new THREE.MeshBasicMaterial({ color: 0x00ff00, transparent: true, opacity: 0.5 });
      return new THREE.Mesh(geo, mat);
    }

    function createWheelPreviewMesh(rot) {
      const rotSteps = (Math.round(rot / 90) % 4 + 4) % 4;
      let axleX = 0, axleZ = 0;
      if      (rotSteps === 0) { axleX =  1; }
      else if (rotSteps === 1) { axleZ =  1; }
      else if (rotSteps === 2) { axleX = -1; }
      else                     { axleZ = -1; }

      const mkMat = () => new THREE.MeshBasicMaterial({ color: 0x00ff00, transparent: true, opacity: 0.45 });

      const group = new THREE.Group();

      // 本体ボックス
      const base = new THREE.Mesh(new THREE.BoxGeometry(0.97, 0.97, 0.97), mkMat());
      base.position.set(0, 0.5, 0);
      group.add(base);

      // タイヤ (トーラス)
      const tire = new THREE.Mesh(new THREE.TorusGeometry(0.95, 0.38, 8, 20), mkMat());
      tire.position.set(axleX, 0.5, axleZ);
      if (axleX !== 0) tire.rotation.y = Math.PI / 2;
      group.add(tire);

      // ハブ (円盤)
      const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.5, 0.42, 12), mkMat());
      hub.position.set(axleX, 0.5, axleZ);
      if (axleX !== 0) hub.rotation.z = Math.PI / 2;
      else             hub.rotation.x = Math.PI / 2;
      group.add(hub);

      // .material.color.setHex() の呼び出しを全子メッシュに委譲
      group.material = {
        color: {
          setHex: (hex) => group.traverse(c => { if (c.isMesh) c.material.color.setHex(hex); })
        }
      };

      return group;
    }

    function updatePreviewMesh() {
      scene.remove(previewMesh);
      previewMesh = createPreviewMesh();
      scene.add(previewMesh);
    }

    function shiftSnapOffset() {
      const dim = getBlockDimensions(currentBlockType, currentRotation);
      snapOffsetX = (snapOffsetX + 1) % dim.w;
      if (snapOffsetX === 0) {
        snapOffsetZ = (snapOffsetZ + 1) % dim.d;
      }
      triggerVibrate();
    }

    // --- 💾 セーブ・ロード・エクスポート/インポート機能 ---
    function serializeCurrentState() {
      return blocksHistory.map(item => {
        const dim = getBlockDimensions(item.type, item.rot);
        const originX = item.group.position.x;
        const originY = item.group.position.y;
        const originZ = item.group.position.z;
        return {
          type: item.type,
          color: item.color,
          rot: item.rot,
          pos: [originX, originY, originZ]
        };
      });
    }

    function loadStateData(dataArray) {
      clearAllBlocksSilent();
      if (!Array.isArray(dataArray)) return;

      dataArray.forEach(data => {
        const type = data.type;
        const color = data.color;
        const rot = data.rot;
        const [originX, worldY, originZ] = data.pos;
        const originHY = Math.round(worldY * 2); // world Y → 半グリッド整数

        const cells = getOccupiedCells(originX, originHY, originZ, type, rot);
        const group = createBlockMesh(type, color, rot);
        group.position.set(originX, originHY * 0.5, originZ);
        scene.add(group);

        cells.forEach(key => occupiedGrid.set(key, group));

        group.traverse(child => {
          if (child.isMesh) {
            child.userData.rootGroup = group;
            blockMeshes.push(child);
          }
        });

        blocksHistory.push({ group, cells, type, color, rot });
      });

      updateBlockCount();
    }

    function autoSave() {
      try {
        const state = serializeCurrentState();
        localStorage.setItem('block_craft_autosave', JSON.stringify(state));
      } catch (e) {
        console.warn('AutoSave failed:', e);
      }
    }

    function autoLoad() {
      try {
        const saved = localStorage.getItem('block_craft_autosave');
        if (saved) {
          loadStateData(JSON.parse(saved));
        }
      } catch (e) {
        console.warn('AutoLoad failed:', e);
      }
    }

    function getSavedSlots() {
      try {
        const saved = localStorage.getItem('block_craft_slots');
        return saved ? JSON.parse(saved) : {};
      } catch (e) {
        return {};
      }
    }

    function updateSaveListUI() {
      const container = document.getElementById('save-list-container');
      container.innerHTML = '';
      const slots = getSavedSlots();
      const keys = Object.keys(slots);

      if (keys.length === 0) {
        container.innerHTML = '<div style="color:#aaa; font-size:11px; text-align:center;">保存された作品はありません</div>';
        return;
      }

      keys.forEach(name => {
        const item = document.createElement('div');
        item.className = 'save-item';
        item.innerHTML = `
          <span>${name}</span>
          <div class="save-item-btns">
            <button class="btn-load" onclick="loadSlot('${name}')">開く</button>
            <button class="btn-del" onclick="deleteSlot('${name}')">削除</button>
          </div>
        `;
        container.appendChild(item);
      });
    }

    function saveCurrentSlot() {
      const input = document.getElementById('save-name-input');
      const name = input.value.trim();
      if (!name) {
        alert('作品名を入力してください');
        return;
      }
      const slots = getSavedSlots();
      slots[name] = serializeCurrentState();
      localStorage.setItem('block_craft_slots', JSON.stringify(slots));
      input.value = '';
      updateSaveListUI();
      triggerVibrate();
    }

    function loadSlot(name) {
      const slots = getSavedSlots();
      if (slots[name]) {
        loadStateData(slots[name]);
        autoSave();
        triggerVibrate();
      }
    }

    function deleteSlot(name) {
      if (confirm(`作品「${name}」を削除しますか？`)) {
        const slots = getSavedSlots();
        delete slots[name];
        localStorage.setItem('block_craft_slots', JSON.stringify(slots));
        updateSaveListUI();
        triggerVibrate();
      }
    }

    function exportAllSaves() {
      const data = {
        autosave: serializeCurrentState(),
        slots: getSavedSlots()
      };
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `block_craft_saves_${new Date().toISOString().slice(0,10)}.json`;
      a.click();
      URL.revokeObjectURL(url);
    }

    function importAllSaves(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const data = JSON.parse(e.target.result);
          if (data.slots) {
            localStorage.setItem('block_craft_slots', JSON.stringify(data.slots));
          }
          if (data.autosave) {
            loadStateData(data.autosave);
            autoSave();
          }
          updateSaveListUI();
          alert('インポートが完了しました');
        } catch (err) {
          alert('ファイルの読み込みに失敗しました');
        }
      };
      reader.readAsText(file);
    }

    // --- 🕹️ 左側バーチャルパッド（視点移動）制御 ---
    const joystickZone = document.getElementById('joystick-zone');
    const joystickKnob = document.getElementById('joystick-knob');
    let isJoystickActive = false;
    let joystickTouchId = null;
    let joyVec = { x: 0, y: 0 };

    joystickZone.addEventListener('pointerdown', (e) => {
      isJoystickActive = true;
      joystickTouchId = e.pointerId;
      updateJoystick(e);
    });

    window.addEventListener('pointermove', (e) => {
      if (isJoystickActive && e.pointerId === joystickTouchId) {
        updateJoystick(e);
      }
    });

    window.addEventListener('pointerup', (e) => {
      if (isJoystickActive && e.pointerId === joystickTouchId) {
        isJoystickActive = false;
        joystickTouchId = null;
        joyVec = { x: 0, y: 0 };
        joystickKnob.style.transform = `translate(0px, 0px)`;
      }
    });

    function updateJoystick(e) {
      const rect = joystickZone.getBoundingClientRect();
      const centerX = rect.left + rect.width / 2;
      const centerY = rect.top + rect.height / 2;

      let dx = e.clientX - centerX;
      let dy = e.clientY - centerY;
      const dist = Math.hypot(dx, dy);
      const maxDist = rect.width / 2 - 10;

      if (dist > maxDist) {
        dx = (dx / dist) * maxDist;
        dy = (dy / dist) * maxDist;
      }

      joystickKnob.style.transform = `translate(${dx}px, ${dy}px)`;
      joyVec.x = dx / maxDist; // -1.0 〜 1.0
      joyVec.y = dy / maxDist;
    }

    // --- FPSスワイプ視点（画面スワイプで yaw/pitch 操作）---
    window.addEventListener('pointerdown', (e) => {
      if (gameMode !== 'fps') return;
      if (e.pointerId === joystickTouchId) return;
      if (fpsLookTouchId !== null) return;
      // ボタン・ジョイスティックゾーン上のタッチは除外
      const t = e.target;
      if (t.tagName === 'BUTTON' || t.id === 'joystick-zone' || t.id === 'joystick-knob') return;
      fpsLookTouchId = e.pointerId;
      fpsLookLastX = e.clientX;
      fpsLookLastY = e.clientY;
    });
    window.addEventListener('pointermove', (e) => {
      if (gameMode !== 'fps' || e.pointerId !== fpsLookTouchId) return;
      const dx = e.clientX - fpsLookLastX;
      const dy = e.clientY - fpsLookLastY;
      fpsLookLastX = e.clientX;
      fpsLookLastY = e.clientY;
      player.yaw   -= dx * 0.003;
      player.pitch += dy * 0.003;
      player.pitch  = Math.max(-Math.PI / 2 + 0.05, Math.min(Math.PI / 2 - 0.05, player.pitch));
    });
    window.addEventListener('pointerup', (e) => {
      if (e.pointerId === fpsLookTouchId) fpsLookTouchId = null;
    });
    window.addEventListener('pointercancel', (e) => {
      if (e.pointerId === fpsLookTouchId) fpsLookTouchId = null;
    });

    // --- 🖐️ 画面タッチ（ズーム・パン・配置移動）制御 ---
    const dom = renderer.domElement;
    const activeTouches = new Map();
    let initialPinchDistance = null;
    let initialCameraRadius = null;
    let lastPanCenter = null;

    dom.addEventListener('pointerdown', (e) => {
      activeTouches.set(e.pointerId, { x: e.clientX, y: e.clientY });
      if (activeTouches.size === 2) {
        const points = Array.from(activeTouches.values());
        initialPinchDistance = Math.hypot(points[0].x - points[1].x, points[0].y - points[1].y);
        initialCameraRadius = cameraRadius;
        lastPanCenter = {
          x: (points[0].x + points[1].x) / 2,
          y: (points[0].y + points[1].y) / 2
        };
      }
    });

    dom.addEventListener('pointermove', (e) => {
      if (activeTouches.has(e.pointerId)) {
        activeTouches.set(e.pointerId, { x: e.clientX, y: e.clientY });
      }

      if (gameMode === 'fps') return;

      // 2本指操作：ピンチイン・アウト（拡大縮小） & 2本指パン（カメラ位置移動）
      if (activeTouches.size === 2) {
        const points = Array.from(activeTouches.values());
        
        // 1. ピンチ拡大縮小
        const currentDist = Math.hypot(points[0].x - points[1].x, points[0].y - points[1].y);
        if (initialPinchDistance && currentDist > 0) {
          const factor = initialPinchDistance / currentDist;
          cameraRadius = Math.max(5, Math.min(80, initialCameraRadius * factor));
        }

        // 2. 二本指パン（カメラ位置移動）
        const currentPanCenter = {
          x: (points[0].x + points[1].x) / 2,
          y: (points[0].y + points[1].y) / 2
        };
        if (lastPanCenter) {
          const dx = currentPanCenter.x - lastPanCenter.x;
          const dy = currentPanCenter.y - lastPanCenter.y;

          const panSpeed = cameraRadius * 0.0015;
          const forward = new THREE.Vector3().subVectors(cameraTarget, camera.position);
          forward.y = 0;
          forward.normalize();

          const right = new THREE.Vector3().crossVectors(forward, new THREE.Vector3(0, 1, 0)).normalize();

          cameraTarget.addScaledVector(right, -dx * panSpeed);
          cameraTarget.addScaledVector(forward, dy * panSpeed);
        }
        lastPanCenter = currentPanCenter;

        updateCameraPosition();
      }
      // 1本指操作（視点パッド操作中でない場合）：レイキャスト位置検知
      else if (activeTouches.size === 1 && !isJoystickActive) {
        mouseVector.x = (e.clientX / window.innerWidth) * 2 - 1;
        mouseVector.y = -(e.clientY / window.innerHeight) * 2 + 1;
      }
    });

    const handlePointerEnd = (e) => {
      activeTouches.delete(e.pointerId);
      if (activeTouches.size < 2) {
        initialPinchDistance = null;
        initialCameraRadius = null;
        lastPanCenter = null;
      }
    };

    dom.addEventListener('pointerup', handlePointerEnd);
    dom.addEventListener('pointercancel', handlePointerEnd);

    // マウスホイールでの拡大縮小サポート
    dom.addEventListener('wheel', (e) => {
      e.preventDefault();
      cameraRadius = Math.max(5, Math.min(80, cameraRadius + e.deltaY * 0.02));
      updateCameraPosition();
    }, { passive: false });

    function updateRaycast() {
      if (mouseVector.x === -999) return;

      raycaster.setFromCamera(mouseVector, camera);
      const intersects = raycaster.intersectObjects([plane, ...blockMeshes], true);

      if (intersects.length > 0) {
        const hit = intersects[0];
        const dim = getBlockDimensions(currentBlockType, currentRotation);

        if (mode === 'add') {
          hoveredGroup = null;
          let originX, originY, originZ;

          if (hit.object === plane) {
            originX = Math.floor(hit.point.x - dim.w / 2 + 0.5);
            originY = 0;
            originZ = Math.floor(hit.point.z - dim.d / 2 + 0.5);
          } else {
            const norm = hit.face.normal.clone().transformDirection(hit.object.matrixWorld);
            const p = hit.point.clone().add(norm.clone().multiplyScalar(0.5));

            originX = Math.floor(p.x) - snapOffsetX;
            originY = Math.max(0, Math.round(hit.point.y * 2)); // 半グリッド単位
            originZ = Math.floor(p.z) - snapOffsetZ;
          }

          targetOccupiedCells = getOccupiedCells(originX, originY, originZ, currentBlockType, currentRotation);
          isCanPlace = canPlaceBlock(targetOccupiedCells);

          previewMesh.position.set(originX + dim.w / 2 - 0.5, originY * 0.5 + dim.h / 2, originZ + dim.d / 2 - 0.5);
          previewMesh.material.color.setHex(isCanPlace ? 0x00ff00 : 0xff0000);
          previewMesh.visible = true;
        } 
        else if (mode === 'delete') {
          if (hit.object !== plane) {
            hoveredGroup = hit.object.userData.rootGroup;
            previewMesh.position.copy(hoveredGroup.position);
            previewMesh.material.color.setHex(0xff0000);
            previewMesh.visible = true;
          } else {
            hoveredGroup = null;
            previewMesh.visible = false;
          }
        }
      } else {
        previewMesh.visible = false;
        hoveredGroup = null;
      }
    }

    function setCameraView(view) {
      cameraTarget.set(0, 0, 0);
      if (view === 'front') { cameraTheta = 0; cameraPhi = Math.PI / 2.2; }
      if (view === 'top') { cameraTheta = 0; cameraPhi = 0.05; }

    function executeAction() {
      if (mode === 'add') {
        if (!isCanPlace || !previewMesh.visible) return;

        const dim = getBlockDimensions(currentBlockType, currentRotation);
        const group = createBlockMesh(currentBlockType, currentColor, currentRotation);
        
        const originX = previewMesh.position.x - dim.w / 2 + 0.5;
        const originY = previewMesh.position.y - dim.h / 2;
        const originZ = previewMesh.position.z - dim.d / 2 + 0.5;

        group.position.set(originX, originY, originZ);
        scene.add(group);

        targetOccupiedCells.forEach(key => occupiedGrid.set(key, group));

        group.traverse(child => {
          if (child.isMesh) {
            child.userData.rootGroup = group;
            blockMeshes.push(child);
          }
        });

        blocksHistory.push({ group, cells: [...targetOccupiedCells], type: currentBlockType, color: currentColor, rot: currentRotation });

        playSound('place');
        triggerVibrate();
        updateBlockCount();
        autoSave();
      } 
      else if (mode === 'delete') {
        if (!hoveredGroup) return;

        scene.remove(hoveredGroup);

        for (let [key, val] of occupiedGrid.entries()) {
          if (val === hoveredGroup) occupiedGrid.delete(key);
        }

        hoveredGroup.traverse(c => {
          const idx = blockMeshes.indexOf(c);
          if (idx > -1) blockMeshes.splice(idx, 1);
        });

        const hIdx = blocksHistory.findIndex(h => h.group === hoveredGroup);
        if (hIdx > -1) blocksHistory.splice(hIdx, 1);

        hoveredGroup = null;
        previewMesh.visible = false;

        playSound('delete');
        triggerVibrate();
        updateBlockCount();
        autoSave();
      }
    }

    function undoLastAction() {
      if (blocksHistory.length === 0) return;
      const last = blocksHistory.pop();
      scene.remove(last.group);

      last.cells.forEach(key => occupiedGrid.delete(key));
      last.group.traverse(c => {
        const idx = blockMeshes.indexOf(c);
        if (idx > -1) blockMeshes.splice(idx, 1);
      });

      playSound('delete');
      updateBlockCount();
      autoSave();
    }

    // ===== FPS: モード切替 =====

    // ===== FPS: ジャンプ / 飛行 =====
    let isFlyingUp = false, isFlyingDown = false;

    function toggleFlyMode() {
      player.isFlying = !player.isFlying;
      if (player.isFlying) { player.vel.y = 0; isFlyingUp = false; isFlyingDown = false; }
      document.getElementById('fly-indicator').style.display = player.isFlying ? 'block' : 'none';
      document.getElementById('fly-down-btn').style.display = player.isFlying ? 'flex' : 'none';
      document.getElementById('btn-fly').classList.toggle('active', player.isFlying);
      triggerVibrate();
    }

    // ===== FPS: 物理 =====
    function updateFPS(now) {
      const dt = Math.min((now - lastFPSTime) * 0.001, 0.05);
      lastFPSTime = now;
      if (dt <= 0) return;

      // 移動（左ジョイスティック → yaw基準）
      const speed = player.isFlying ? FLY_SPEED : WALK_SPEED;
      const fwd  = -joyVec.y;
      const right = -joyVec.x;
      const cos = Math.cos(player.yaw), sin = Math.sin(player.yaw);
      const dx = (right * cos + fwd * sin) * speed * dt;
      const dz = (-right * sin + fwd * cos) * speed * dt;

      player.pos.x += dx; resolveCollision('x');
      player.pos.z += dz; resolveCollision('z');

      // 重力 / 飛行
      if (player.isFlying) {
        if (isFlyingUp)        player.vel.y =  FLY_SPEED;
        else if (isFlyingDown) player.vel.y = -FLY_SPEED;
        else                   player.vel.y *= 0.75; // ボタン離したらホバーへ減衰
      } else {
        player.vel.y += GRAVITY * dt;
        player.vel.y = Math.max(player.vel.y, -30);
      }
      player.onGround = false;
      player.pos.y += player.vel.y * dt;
      resolveCollision('y');

      // 床
      if (player.pos.y < 0) {
        player.pos.y = 0; player.onGround = true; player.vel.y = 0;
      }
      // グリッド外制限
      const half = GRID_SIZE / 2 - PLAYER_R;
      player.pos.x = Math.max(-half, Math.min(half, player.pos.x));
      player.pos.z = Math.max(-half, Math.min(half, player.pos.z));

      // カメラ
      const eye = player.pos.clone().add(new THREE.Vector3(0, PLAYER_EYE, 0));
      camera.position.copy(eye);
      const lookDir = new THREE.Vector3(
        Math.sin(player.yaw)  * Math.cos(player.pitch),
        -Math.sin(player.pitch),
        Math.cos(player.yaw)  * Math.cos(player.pitch)
      );
      camera.lookAt(eye.clone().add(lookDir));

      updateFPSRaycast(lookDir);
    }

    function resolveCollision(axis) {
      const r = PLAYER_R, h = PLAYER_H;
      const x0 = Math.floor(player.pos.x - r) - 1, x1 = Math.floor(player.pos.x + r) + 1;
      const hy0 = Math.floor(player.pos.y * 2) - 1, hy1 = Math.floor((player.pos.y + h) * 2) + 1;
      const z0 = Math.floor(player.pos.z - r) - 1, z1 = Math.floor(player.pos.z + r) + 1;

      for (let bx = x0; bx <= x1; bx++) {
        for (let bhy = hy0; bhy <= hy1; bhy++) {
          for (let bz = z0; bz <= z1; bz++) {
            if (!occupiedGrid.has(`${bx},${bhy},${bz}`)) continue;
            // プレイヤーAABB
            const pxMin = player.pos.x - r, pxMax = player.pos.x + r;
            const pyMin = player.pos.y,     pyMax = player.pos.y + h;
            const pzMin = player.pos.z - r, pzMax = player.pos.z + r;
            // 重なり確認（全軸）— Y軸は半グリッド(0.5単位)
            if (pxMax <= bx || pxMin >= bx+1) continue;
            if (pyMax <= bhy*0.5 || pyMin >= (bhy+1)*0.5) continue;
            if (pzMax <= bz || pzMin >= bz+1) continue;
            // 軸別解決
            if (axis === 'x') {
              const pL = pxMax - bx, pR = (bx+1) - pxMin;
              if (pL < pR) player.pos.x -= pL; else player.pos.x += pR;
            } else if (axis === 'z') {
              const pF = pzMax - bz, pB = (bz+1) - pzMin;
              if (pF < pB) player.pos.z -= pF; else player.pos.z += pB;
            } else {
              const pUp = (bhy+1)*0.5 - pyMin, pDn = pyMax - bhy*0.5;
              if (pUp < pDn) {
                player.pos.y += pUp; player.onGround = true;
                if (player.vel.y < 0) player.vel.y = 0;
              } else {
                player.pos.y -= pDn;
                if (player.vel.y > 0) player.vel.y = 0;
              }
            }
          }
        }
      }
    }

    function updateFPSRaycast(lookDir) {
      const ray = new THREE.Raycaster(camera.position, lookDir.clone().normalize(), 0.1, 18);
      const hits = ray.intersectObjects([plane, ...blockMeshes], true);

      if (hits.length > 0) {
        const hit = hits[0];
        const dim = getBlockDimensions(currentBlockType, currentRotation);
        if (hit.object === plane) {
          const ox = Math.floor(hit.point.x - dim.w/2 + 0.5);
          const oz = Math.floor(hit.point.z - dim.d/2 + 0.5);
          targetOccupiedCells = getOccupiedCells(ox, 0, oz, currentBlockType, currentRotation);
          isCanPlace = canPlaceBlock(targetOccupiedCells);
          if (isCanPlace) {
            previewMesh.position.set(ox+dim.w/2-0.5, dim.h/2, oz+dim.d/2-0.5);
            previewMesh.material.color.setHex(0x00ff88);
            previewMesh.visible = true;
          } else {
            previewMesh.visible = false;
          }
          hoveredGroup = null;
        } else {
          hoveredGroup = hit.object.userData.rootGroup;
          if (hoveredGroup) {
            const norm = hit.face.normal.clone().transformDirection(hit.object.matrixWorld);
            // 法線を最近軸に丸めて整数グリッドシフト量を得る
            const nx = Math.round(norm.x);
            const ny = Math.round(norm.y);
            const nz = Math.round(norm.z);
            const p = hit.point.clone().add(norm.clone().multiplyScalar(0.5));
            let ox = Math.floor(p.x) - snapOffsetX;
            let oy = Math.max(0, Math.round(hit.point.y * 2)); // 半グリッド単位
            let oz = Math.floor(p.z) - snapOffsetZ;

            targetOccupiedCells = getOccupiedCells(ox, oy, oz, currentBlockType, currentRotation);
            isCanPlace = canPlaceBlock(targetOccupiedCells);

            // 重なる場合は法線方向に1半グリッドずらして再試行
            if (!isCanPlace) {
              const ox2 = ox + nx;
              const oy2 = Math.max(0, oy + ny);
              const oz2 = oz + nz;
              const cells2 = getOccupiedCells(ox2, oy2, oz2, currentBlockType, currentRotation);
              if (canPlaceBlock(cells2)) {
                ox = ox2; oy = oy2; oz = oz2;
                targetOccupiedCells = cells2;
                isCanPlace = true;
              }
            }

            if (isCanPlace) {
              previewMesh.position.set(ox+dim.w/2-0.5, oy*0.5+dim.h/2, oz+dim.d/2-0.5);
              previewMesh.material.color.setHex(0x00ff88);
              previewMesh.visible = true;
            } else {
              previewMesh.visible = false;
            }
          }
        }
      } else {
        previewMesh.visible = false;
        hoveredGroup = null;
        isCanPlace = false;
      }
    }

    // ===== FPS: 配置・削除アクション =====
    function executeFPSPlace() {
      if (!isCanPlace || !previewMesh.visible) return;
      const dim = getBlockDimensions(currentBlockType, currentRotation);
      const group = createBlockMesh(currentBlockType, currentColor, currentRotation);
      const ox = previewMesh.position.x - dim.w/2 + 0.5;
      const oy = previewMesh.position.y - dim.h/2;
      const oz = previewMesh.position.z - dim.d/2 + 0.5;
      group.position.set(ox, oy, oz);
      scene.add(group);
      targetOccupiedCells.forEach(k => occupiedGrid.set(k, group));
      group.traverse(c => { if (c.isMesh) { c.userData.rootGroup = group; blockMeshes.push(c); } });
      blocksHistory.push({ group, cells: [...targetOccupiedCells], type: currentBlockType, color: currentColor, rot: currentRotation });
      playSound('place'); triggerVibrate(); updateBlockCount(); autoSave();
    }

    function executeFPSDelete() {
      if (!hoveredGroup) return;
      scene.remove(hoveredGroup);
      for (const [k, v] of occupiedGrid.entries()) { if (v === hoveredGroup) occupiedGrid.delete(k); }
      hoveredGroup.traverse(c => { const i = blockMeshes.indexOf(c); if (i > -1) blockMeshes.splice(i,1); });
      const hi = blocksHistory.findIndex(h => h.group === hoveredGroup);
      if (hi > -1) blocksHistory.splice(hi, 1);
      hoveredGroup = null; previewMesh.visible = false;
      playSound('delete'); triggerVibrate(); updateBlockCount(); autoSave();
    }

    // ===== ジャンプ・上昇・下降ボタン =====
    const jumpBtn     = document.getElementById('jump-btn');
    const flyDownBtn  = document.getElementById('fly-down-btn');

    // ⬆ ボタン: 非飛行=ジャンプ1回 / 飛行=長押しで連続上昇
    jumpBtn.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      if (player.isFlying) {
        isFlyingUp = true;
      } else if (player.onGround) {
        player.vel.y = JUMP_FORCE;
        player.onGround = false;
        triggerVibrate();
      }
    });
    const stopFlyUp = () => { isFlyingUp = false; };
    jumpBtn.addEventListener('pointerup',     stopFlyUp);
    jumpBtn.addEventListener('pointercancel', stopFlyUp);
    jumpBtn.addEventListener('pointerleave',  stopFlyUp);

    // ⬇ ボタン: 長押しで連続下降
    flyDownBtn.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      isFlyingDown = true;
    });
    const stopFlyDown = () => { isFlyingDown = false; };
    flyDownBtn.addEventListener('pointerup',     stopFlyDown);
    flyDownBtn.addEventListener('pointercancel', stopFlyDown);
    flyDownBtn.addEventListener('pointerleave',  stopFlyDown);

    // FPSアクションボタン（タップ=配置・長押し=削除）
    const fpsActionBtn = document.getElementById('fps-action-btn');
    fpsActionBtn.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      fpsActionStartTime = Date.now();
      const circle = document.querySelector('#delete-ring circle');
      document.getElementById('delete-ring').style.display = 'block';
      fpsActionBtn.classList.add('deleting');
      let elapsed = 0;
      fpsTick = setInterval(() => {
        elapsed += 33;
        circle.style.strokeDashoffset = RING_CIRC * (1 - Math.min(elapsed / LONG_PRESS_MS, 1));
      }, 33);
      fpsLongPressTimer = setTimeout(() => {
        clearInterval(fpsTick); fpsTick = null;
        document.getElementById('delete-ring').style.display = 'none';
        document.querySelector('#delete-ring circle').style.strokeDashoffset = RING_CIRC;
        fpsActionBtn.classList.remove('deleting');
        executeFPSDelete();
        fpsLongPressTimer = null;
      }, LONG_PRESS_MS);
    });

    function cancelFPSAction(didLong) {
      clearTimeout(fpsLongPressTimer); fpsLongPressTimer = null;
      clearInterval(fpsTick); fpsTick = null;
      document.getElementById('delete-ring').style.display = 'none';
      document.querySelector('#delete-ring circle').style.strokeDashoffset = RING_CIRC;
      fpsActionBtn.classList.remove('deleting');
      if (!didLong && fpsActionStartTime && (Date.now() - fpsActionStartTime) < LONG_PRESS_MS) {
        executeFPSPlace();
      }
      fpsActionStartTime = 0;
    }
    fpsActionBtn.addEventListener('pointerup',     () => cancelFPSAction(false));
    fpsActionBtn.addEventListener('pointercancel', () => cancelFPSAction(true));

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // 起動時にオートセーブデータを読み込み
    autoLoad();

    // ループ処理
    function animate(now = 0) {
      requestAnimationFrame(animate);

      if (gameMode === 'build') {
        if (isJoystickActive) {
          cameraTheta += joyVec.x * 0.04;
          cameraPhi   += joyVec.y * 0.03;
          cameraPhi = Math.max(0.05, Math.min(Math.PI / 2 - 0.05, cameraPhi));
          updateCameraPosition();
        }
        updateRaycast();
      } else {
        updateFPS(now);
      }

      renderer.render(scene, camera);
    }
    animate();

    // PWA サービスワーカー登録 + 自動更新
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').then(reg => {
          // 新しい SW が見つかったら即適用を要求
          reg.addEventListener('updatefound', () => {
            const newSW = reg.installing;
            newSW.addEventListener('statechange', () => {
              if (newSW.state === 'installed' && navigator.serviceWorker.controller) {
                newSW.postMessage({ type: 'SKIP_WAITING' });
              }
            });
          });
          // 定期チェック（30秒ごとに sw.js が更新されていないか確認）
          setInterval(() => reg.update(), 30000);
        });
        // SW が切り替わったらページをリロードして最新版を適用
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          window.location.reload();
        });
      });
    }
  </script>
</body>
</html>
