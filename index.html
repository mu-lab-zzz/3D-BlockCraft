<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>BLOCK CRAFT 3D</title>
  <meta name="description" content="3Dブロックで自由に作れるモバイル向けクラフトゲーム">
  <meta name="theme-color" content="#1a1a24">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="BlockCraft">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icons/favicon.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #1a1a24;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #canvas-container {
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    /* 🕹️ 左側 バーチャルパッド（ツールバーの上に配置） */
    #joystick-zone {
      position: absolute;
      bottom: calc(max(10px, env(safe-area-inset-bottom)) + 70px);
      left: 15px;
      width: 100px;
      height: 100px;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(8px);
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      touch-action: none;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #joystick-knob {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      border: 2px solid #fff;
      border-radius: 50%;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      position: absolute;
      pointer-events: none;
      transition: transform 0.05s ease-out;
    }
    #joystick-label {
      position: absolute;
      top: -22px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 11px;
      color: rgba(255,255,255,0.8);
      font-weight: bold;
      white-space: nowrap;
      pointer-events: none;
      text-shadow: 0 1px 3px rgba(0,0,0,0.8);
    }

    /* 上部ステータス */
    #top-bar {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
      z-index: 5;
    }
    .badge {
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(8px);
      color: #fff;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: bold;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    /* 🔘 アクションボタン（画面右下・ツールバーの上に配置） */
    #action-btn {
      position: absolute;
      bottom: calc(max(10px, env(safe-area-inset-bottom)) + 70px);
      right: 15px;
      width: 70px;
      height: 70px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: #fff;
      font-size: 12px;
      font-weight: bold;
      box-shadow: 0 8px 25px rgba(37, 99, 235, 0.5);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      z-index: 20;
      transition: transform 0.1s ease;
    }
    #action-btn:active { transform: scale(0.9); }
    #action-btn.delete-mode {
      background: linear-gradient(135deg, #dc2626, #991b1b);
      box-shadow: 0 8px 25px rgba(220, 38, 38, 0.5);
    }
    #action-btn span { font-size: 20px; line-height: 1; }

    /* 下部UIツールバー */
    #toolbar {
      position: absolute;
      bottom: max(10px, env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 4px;
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(14px);
      padding: 6px 10px;
      border-radius: 22px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      max-width: 96vw;
      z-index: 25;
    }
    .toolbar-sep {
      width: 1px;
      background: rgba(0,0,0,0.12);
      align-self: stretch;
      margin: 3px 2px;
      flex-shrink: 0;
    }

    .btn {
      border: none;
      background: #f0f0f5;
      color: #333;
      padding: 6px 8px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      min-width: 46px;
      flex-shrink: 0;
      transition: all 0.15s ease;
    }
    .btn:active { transform: scale(0.92); }
    .btn.active { background: #2563eb; color: #fff; }

    /* モードトグルボタン */
    #btn-mode {
      background: #2563eb;
      color: #fff;
      min-width: 58px;
    }
    #btn-mode.delete-mode {
      background: #dc2626;
    }

    /* カラードット */
    .color-dot {
      display: inline-block;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 2px solid rgba(0,0,0,0.18);
      vertical-align: middle;
      flex-shrink: 0;
    }

    /* ブロック種ラベル */
    #block-type-label {
      font-size: 9px;
      color: #2563eb;
      font-weight: bold;
      line-height: 1;
    }

    /* その他メニュー（縦型） */
    #more-menu {
      flex-direction: column !important;
      width: 200px;
      gap: 4px !important;
    }
    #more-menu .opt-btn {
      text-align: left;
      width: 100%;
    }
    #more-menu .opt-btn.danger {
      color: #ff7070;
      border-top: 1px solid rgba(255,255,255,0.15);
      padding-top: 10px;
      margin-top: 4px;
    }

    /* サブメニュー（ツールバーのすぐ上に表示） */
    .sub-menu {
      position: absolute;
      bottom: calc(max(10px, env(safe-area-inset-bottom)) + 64px);
      left: 50%;
      transform: translateX(-50%);
      display: none;
      gap: 8px;
      background: rgba(20, 20, 30, 0.92);
      backdrop-filter: blur(14px);
      padding: 10px 14px;
      border-radius: 18px;
      z-index: 30;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      border: 1px solid rgba(255,255,255,0.08);
    }
    .color-swatch {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 2px solid #fff;
      cursor: pointer;
    }
    .color-swatch.active { transform: scale(1.25); border-color: #ffd700; }
    .opt-btn {
      background: rgba(255,255,255,0.2);
      color: #fff;
      border: none;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
    }
    .opt-btn.active { background: #2563eb; }

    /* ブロックピッカー */
    #block-picker {
      flex-direction: column;
      width: 310px;
      max-height: 52vh;
      overflow-y: auto;
      gap: 5px;
    }
    .bp-section-title {
      font-size: 10px;
      font-weight: bold;
      color: rgba(255,255,255,0.5);
      letter-spacing: 0.5px;
      padding: 2px 0 1px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    .bp-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }
    .bp-grid .opt-btn {
      min-width: 42px;
      padding: 5px 6px;
      font-size: 10px;
      font-weight: bold;
    }

    /* 作品管理メニューのスタイル */
    #save-picker {
      flex-direction: column;
      width: 280px;
      max-height: 320px;
      overflow-y: auto;
    }
    .save-input-group {
      display: flex;
      gap: 6px;
      margin-bottom: 6px;
    }
    .save-input-group input {
      flex: 1;
      padding: 6px 10px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.3);
      background: rgba(255,255,255,0.1);
      color: #fff;
      font-size: 12px;
    }
    .save-input-group input::placeholder { color: #aaa; }
    .save-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 180px;
      overflow-y: auto;
    }
    .save-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255,255,255,0.1);
      padding: 6px 10px;
      border-radius: 8px;
      color: #fff;
      font-size: 12px;
    }
    .save-item-btns {
      display: flex;
      gap: 4px;
    }
    .save-item-btns button {
      padding: 4px 8px;
      border-radius: 6px;
      border: none;
      font-size: 10px;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-load { background: #2563eb; color: #fff; }
    .btn-del { background: #dc2626; color: #fff; }
    .file-io-group {
      display: flex;
      gap: 6px;
      margin-top: 6px;
      border-top: 1px solid rgba(255,255,255,0.2);
      padding-top: 6px;
    }
    /* ===== FPS モード ===== */
    #mode-switch-btn {
      position: absolute;
      top: 12px; left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(8px);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.2);
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 12px; font-weight: bold;
      cursor: pointer; z-index: 30;
      transition: background 0.2s, transform 0.1s;
      white-space: nowrap;
    }
    #mode-switch-btn:active { transform: translateX(-50%) scale(0.95); }
    #mode-switch-btn.fps-active { background: rgba(37,99,235,0.8); border-color: rgba(99,179,237,0.4); }

    #camera-view-btn {
      position: absolute;
      top: 12px; left: 12px;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(8px);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.2);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12px; font-weight: bold;
      cursor: pointer; z-index: 30;
      transition: background 0.2s, transform 0.1s;
      white-space: nowrap;
    }
    #camera-view-btn:active { transform: scale(0.95); }

    #fps-overlay {
      display: none;
      position: absolute; inset: 0;
      pointer-events: none; z-index: 15;
    }
    #crosshair {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 20px; height: 20px;
    }
    #crosshair::before, #crosshair::after {
      content: ''; position: absolute;
      background: rgba(255,255,255,0.88);
      box-shadow: 0 0 2px rgba(0,0,0,0.8);
    }
    #crosshair::before { width: 2px; height: 100%; left: 50%; transform: translateX(-50%); }
    #crosshair::after  { height: 2px; width: 100%; top: 50%; transform: translateY(-50%); }
    #fly-indicator {
      display: none;
      position: absolute; top: 58px; left: 50%;
      transform: translateX(-50%);
      background: rgba(37,99,235,0.85); color: #fff;
      padding: 4px 14px; border-radius: 14px;
      font-size: 12px; font-weight: bold;
      border: 1px solid rgba(255,255,255,0.2);
    }
    #delete-ring {
      display: none;
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 56px; height: 56px;
    }
    #delete-ring svg { transform: rotate(-90deg); }
    #delete-ring circle {
      fill: none; stroke: #ef4444; stroke-width: 4;
      stroke-dasharray: 132; stroke-dashoffset: 132;
      stroke-linecap: round;
    }

    #fps-edit-btns {
      display: flex;
      position: absolute;
      bottom: calc(max(10px, env(safe-area-inset-bottom)) + 150px);
      right: 15px;
      flex-direction: row;
      gap: 6px;
      z-index: 20;
    }
    .fps-edit-btn {
      width: 48px; height: 48px; border-radius: 50%;
      border: 1.5px solid rgba(255,255,255,0.35);
      background: rgba(20,20,40,0.72);
      backdrop-filter: blur(8px);
      color: #fff; font-size: 20px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.45);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: transform 0.1s;
      touch-action: manipulation;
    }
    .fps-edit-btn:active { transform: scale(0.88); }

    #jump-btn {
      display: none;
      position: absolute;
      bottom: calc(max(10px, env(safe-area-inset-bottom)) + 212px);
      right: 15px;
      width: 56px; height: 56px; border-radius: 50%;
      border: none;
      background: linear-gradient(135deg, #16a34a, #15803d);
      color: #fff; font-size: 22px;
      box-shadow: 0 6px 18px rgba(22,163,74,0.5);
      cursor: pointer; flex-direction: column;
      align-items: center; justify-content: center;
      z-index: 20; transition: transform 0.1s;
    }
    #jump-btn:active { transform: scale(0.9); }

    #fly-down-btn {
      display: none;
      position: absolute;
      bottom: calc(max(10px, env(safe-area-inset-bottom)) + 282px);
      right: 15px;
      width: 56px; height: 56px; border-radius: 50%;
      border: none;
      background: linear-gradient(135deg, #ca8a04, #a16207);
      color: #fff; font-size: 22px;
      box-shadow: 0 6px 18px rgba(202,138,4,0.4);
      cursor: pointer; flex-direction: column;
      align-items: center; justify-content: center;
      z-index: 20; transition: transform 0.1s;
    }
    #fly-down-btn:active { transform: scale(0.9); }

    #fps-action-btn {
      display: none;
      position: absolute;
      bottom: calc(max(10px, env(safe-area-inset-bottom)) + 70px);
      right: 15px;
      width: 70px; height: 70px; border-radius: 50%;
      border: none;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: #fff; font-size: 12px; font-weight: bold;
      box-shadow: 0 8px 25px rgba(37,99,235,0.5);
      cursor: pointer; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 2px; z-index: 20; touch-action: none;
      transition: transform 0.1s, background 0.2s;
    }
    #fps-action-btn:active { transform: scale(0.9); }
    #fps-action-btn.deleting {
      background: linear-gradient(135deg, #dc2626, #991b1b);
      box-shadow: 0 8px 25px rgba(220,38,38,0.5);
    }
    #fps-action-btn span { font-size: 20px; line-height: 1; }

    #fps-toolbar {
      display: none;
      position: absolute;
      bottom: max(10px, env(safe-area-inset-bottom));
      left: 50%; transform: translateX(-50%);
      align-items: center; gap: 4px;
      background: rgba(255,255,255,0.88);
      backdrop-filter: blur(14px);
      padding: 6px 10px; border-radius: 22px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      max-width: 96vw; z-index: 25;
    }

    /* ===== サバイバルモード HUD ===== */
    #survival-hud {
      display: none;
      position: absolute;
      bottom: calc(max(10px, env(safe-area-inset-bottom)) + 10px);
      right: 15px;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
      z-index: 20;
      pointer-events: none;
    }
    #survival-exit-btn {
      pointer-events: auto;
      background: rgba(37,99,235,0.85);
      backdrop-filter: blur(8px);
      color: #fff;
      border: 1px solid rgba(99,179,237,0.4);
      padding: 10px 22px;
      border-radius: 22px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      touch-action: manipulation;
      transition: transform 0.1s;
      white-space: nowrap;
    }
    #survival-exit-btn:active { transform: scale(0.95); }
    .survival-badge {
      background: rgba(0,0,0,0.65);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 16px;
      padding: 8px 18px;
      text-align: center;
      min-width: 76px;
    }
    .survival-num {
      color: #fff;
      font-size: 22px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      line-height: 1;
    }
    .survival-badge-label {
      color: rgba(255,255,255,0.45);
      font-size: 9px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-top: 3px;
    }
    #survival-hint {
      display: none;
      position: absolute;
      top: 52px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(8px);
      color: rgba(255,255,255,0.8);
      border: 1px solid rgba(255,255,255,0.12);
      padding: 5px 16px;
      border-radius: 14px;
      font-size: 11px;
      font-weight: bold;
      pointer-events: none;
      z-index: 30;
      white-space: nowrap;
    }
    /* ===== オープニング画面 ===== */
    #opening-screen {
      position: fixed;
      inset: 0;
      z-index: 200;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0;
      padding: 24px 20px 32px;
      background: #07090f;
      overflow: hidden;
      transition: opacity 0.45s ease;
    }
    #opening-screen.fadeout {
      opacity: 0;
      pointer-events: none;
    }
    /* ブループリント風グリッド */
    #opening-screen::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(59,130,246,0.055) 1px, transparent 1px),
        linear-gradient(90deg, rgba(59,130,246,0.055) 1px, transparent 1px);
      background-size: 64px 64px;
      pointer-events: none;
    }
    /* 中央グロー */
    #opening-screen::after {
      content: '';
      position: absolute;
      top: 30%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 480px; height: 480px;
      background: radial-gradient(circle, rgba(37,99,235,0.14) 0%, transparent 70%);
      pointer-events: none;
    }
    #opening-inner {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 52px;
      width: 100%;
      max-width: 520px;
    }
    #opening-logo {
      text-align: center;
      line-height: 1;
    }
    #opening-eye {
      font-size: 11px;
      letter-spacing: 0.38em;
      text-transform: uppercase;
      color: #3b82f6;
      font-weight: 700;
      margin-bottom: 10px;
    }
    #opening-title {
      font-size: clamp(38px, 11vw, 78px);
      font-weight: 900;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #fff;
      text-shadow: 0 0 60px rgba(59,130,246,0.45), 0 0 18px rgba(59,130,246,0.25);
    }
    #opening-subtitle {
      font-size: clamp(13px, 3vw, 16px);
      color: rgba(255,255,255,0.4);
      margin-top: 10px;
      letter-spacing: 0.06em;
      font-weight: 500;
    }
    #opening-modes {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      justify-content: center;
      width: 100%;
    }
    .mode-btn {
      flex: 1;
      min-width: 130px;
      max-width: 200px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 20px;
      padding: 22px 20px 20px;
      color: #fff;
      cursor: pointer;
      text-align: center;
      transition: background 0.2s, border-color 0.2s, transform 0.15s;
      touch-action: manipulation;
    }
    #btn-creative:hover, #btn-creative:focus {
      background: rgba(37,99,235,0.2);
      border-color: rgba(59,130,246,0.55);
      transform: translateY(-3px);
    }
    #btn-survival:hover, #btn-survival:focus {
      background: rgba(239,68,68,0.18);
      border-color: rgba(239,68,68,0.5);
      transform: translateY(-3px);
    }
    .mode-btn:active { transform: scale(0.96) !important; }
    .mode-btn-icon { font-size: 34px; margin-bottom: 10px; display: block; }
    .mode-btn-title {
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0.02em;
      margin-bottom: 6px;
    }
    .mode-btn-desc {
      font-size: 10.5px;
      color: rgba(255,255,255,0.45);
      line-height: 1.5;
    }
    #opening-footer {
      position: relative;
      z-index: 1;
      font-size: 10px;
      color: rgba(255,255,255,0.22);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-top: auto;
    }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="canvas-container"></div>

  <!-- ========== オープニング画面 ========== -->
  <div id="opening-screen">
    <div id="opening-inner">
      <div id="opening-logo">
        <div id="opening-eye">3D</div>
        <div id="opening-title">BLOCK CRAFT</div>
        <div id="opening-subtitle">Build · Drive · Survive</div>
      </div>
      <div id="opening-modes">
        <button class="mode-btn" id="btn-creative" onclick="startCreativeMode()">
          <span class="mode-btn-icon">🏗</span>
          <div class="mode-btn-title">クリエイティブ</div>
          <div class="mode-btn-desc">ブロックを自由に<br>組み立てよう</div>
        </button>
        <button class="mode-btn" id="btn-survival" onclick="startSurvivalMode()">

  <script>
    // --- 🔊 音声・バイブ ---
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(type) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      if (type === 'place') {
        osc.frequency.setValueAtTime(600, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 0.05);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.05);
      } else if (type === 'delete') {
        osc.frequency.setValueAtTime(180, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(60, audioCtx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.08);
      }
    }

    function triggerVibrate() {
      if (navigator.vibrate) navigator.vibrate(12);
    }

    // --- データ構造 ---
    const occupiedGrid = new Map();
    const blocksHistory = [];
    const blockMeshes = [];

    let mode = 'add';
    let currentBlockType = '1x1';
    let currentColor = 0xee2222;
    let currentRotation = 0;
    let snapOffsetX = 0;
    let snapOffsetZ = 0;
    let activeTilt = null; // 'z'|'x'|null  接続面に置くとき設定される

    // ===== FPS モード =====
    let gameMode = 'build';

    const PLAYER_H   = 1.8;
    const PLAYER_EYE = 1.62;
    const PLAYER_R   = 0.28;
    const GRAVITY    = -22;
    const JUMP_FORCE = 9;
    const WALK_SPEED = 5;
    const FLY_SPEED  = 8;

    const player = {
      pos: new THREE.Vector3(0, 0, 0),
      vel: new THREE.Vector3(0, 0, 0),
      yaw: Math.PI / 4,
      pitch: 0,
      onGround: false,
      isFlying: false,
    };

    let lastFPSTime = 0;

    // FPSスワイプ視点
    let fpsLookTouchId = null;
    let fpsLookLastX = 0, fpsLookLastY = 0;

    // FPSアクション長押し
    let fpsLongPressTimer = null;
    let fpsTick = null;
    let fpsActionStartTime = 0;
    const LONG_PRESS_MS = 600;
    const RING_CIRC = 132;

    // ===== サバイバルモード =====
    let vehicleBlocksData = [];          // { group, origPos, origRotY }
    const vehicleCentroid = new THREE.Vector3();
    const vehicleState = { pos: new THREE.Vector3(), yaw: 0, speed: 0 };
    let lastSurvivalTime = 0;
    let survivalCamTheta = Math.PI;      // π = 車両真後ろ

    const VEHICLE_MAX_SPEED  = 14;
    const VEHICLE_ACCEL      = 9;
    const VEHICLE_DECEL      = 7;
    const VEHICLE_TURN_SPEED = 2.0;
    const SURVIVAL_CAM_DIST  = 20;
    const SURVIVAL_CAM_H     = 7;
    const WHEEL_GROUND_OFFSET = 0.83; // タイヤ半径 - ハブY中心 (1.33 - 0.5)

    let terrainObjects = [];
    let terrainBuilt   = false;

    // キーボード入力（PC テスト用）
    const survivalKeys = { w: false, s: false, a: false, d: false };
    window.addEventListener('keydown', (e) => {
      if (gameMode !== 'survival') return;
      if (e.key === 'w' || e.key === 'W' || e.key === 'ArrowUp')    survivalKeys.w = true;
      if (e.key === 's' || e.key === 'S' || e.key === 'ArrowDown')  survivalKeys.s = true;
      if (e.key === 'a' || e.key === 'A' || e.key === 'ArrowLeft')  survivalKeys.a = true;
      if (e.key === 'd' || e.key === 'D' || e.key === 'ArrowRight') survivalKeys.d = true;
    });
    window.addEventListener('keyup', (e) => {
      if (e.key === 'w' || e.key === 'W' || e.key === 'ArrowUp')    survivalKeys.w = false;
      if (e.key === 's' || e.key === 'S' || e.key === 'ArrowDown')  survivalKeys.s = false;
      if (e.key === 'a' || e.key === 'A' || e.key === 'ArrowLeft')  survivalKeys.a = false;
      if (e.key === 'd' || e.key === 'D' || e.key === 'ArrowRight') survivalKeys.d = false;
    });

    const palette = [0xee2222, 0x2277ee, 0xffcc00, 0x22aa44, 0xffffff, 0x222222, 0x9933ee];

    // --- Three.js セットアップ ---
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1a1a24);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    
    // カメラアングル（極座標管理）
    let cameraRadius = 25;
    let cameraTheta = Math.PI / 4;  // 方位角
    let cameraPhi = Math.PI / 3;    // 仰角
    const cameraTarget = new THREE.Vector3(0, 0, 0); // 注視点

    function updateCameraPosition() {
      camera.position.x = cameraTarget.x + cameraRadius * Math.sin(cameraPhi) * Math.sin(cameraTheta);
      camera.position.y = cameraTarget.y + cameraRadius * Math.cos(cameraPhi);
      camera.position.z = cameraTarget.z + cameraRadius * Math.sin(cameraPhi) * Math.cos(cameraTheta);
      camera.lookAt(cameraTarget);
    }
    updateCameraPosition();

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    container.appendChild(renderer.domElement);

    // ライティング
    scene.add(new THREE.AmbientLight(0xffffff, 0.6));
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(25, 40, 25);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.set(2048, 2048);
    scene.add(dirLight);

    // 床 (50x50)
    const GRID_SIZE = 50;
    const planeGeo = new THREE.PlaneGeometry(GRID_SIZE, GRID_SIZE);
    const planeMat = new THREE.MeshStandardMaterial({ color: 0x2b2d35, roughness: 0.8 });
    const plane = new THREE.Mesh(planeGeo, planeMat);
    plane.rotation.x = -Math.PI / 2;
    plane.position.y = -0.001; // ブロック底面（y=0）との表示競合（めり込み・ちらつき）を防ぐため微修正
    plane.receiveShadow = true;
    scene.add(plane);

    const gridHelper = new THREE.GridHelper(GRID_SIZE, GRID_SIZE, 0x555566, 0x333344);
    gridHelper.position.y = 0;
    scene.add(gridHelper);

    // 地形メッシュ（高さ変位 + 頂点カラー、建築モードでは非表示）
    const TERRAIN_SEGS = 120;
    const terrainGeo = new THREE.PlaneGeometry(600, 600, TERRAIN_SEGS, TERRAIN_SEGS);
    terrainGeo.rotateX(-Math.PI / 2);
    {
      const tPos = terrainGeo.attributes.position;
      const tCol = [];
      for (let i = 0; i < tPos.count; i++) {
        const tx = tPos.getX(i), tz = tPos.getZ(i);
        const ty = getTerrainHeight(tx, tz);
        tPos.setY(i, ty);
        let r, g, b;
        if      (ty < -1.5) { r=0.18; g=0.13; b=0.08; }
        else if (ty <  0.5) { r=0.09; g=0.19; b=0.06; }
        else if (ty <  2.5) { r=0.13; g=0.25; b=0.08; }
        else if (ty <  4.5) { r=0.26; g=0.24; b=0.15; }
        else                { r=0.35; g=0.30; b=0.22; }
        tCol.push(r, g, b);
      }
      terrainGeo.setAttribute('color', new THREE.BufferAttribute(new Float32Array(tCol), 3));
      tPos.needsUpdate = true;
      terrainGeo.computeVertexNormals();
    }
    const survivalField = new THREE.Mesh(
      terrainGeo,
      new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.9, metalness: 0.0 })
    );
    survivalField.receiveShadow = true;
    survivalField.visible = false;
    scene.add(survivalField);

    // プレビュー変数
    let previewMesh = createPreviewMesh();
    scene.add(previewMesh);
    let isCanPlace = false;
    let targetOccupiedCells = [];
    let hoveredGroup = null;

    const raycaster = new THREE.Raycaster();
    const mouseVector = new THREE.Vector2(-999, -999); // スワイプ検知座標

    // --- ロジック関数 ---
    function getBlockDimensions(type, rot = currentRotation) {
      if (type === 'wheel') return { w: 1, d: 1, h: 1 };
      if (isLargeWheelType(type)) {
        const spec = getLargeWheelSpec(type);
        const D = spec.diameter, T = spec.thickness;
        const rotSteps = (Math.round(rot / 90) % 4 + 4) % 4;
        const axleAlongX = (rotSteps === 0 || rotSteps === 2);
        return { w: axleAlongX ? T : D, d: axleAlongX ? D : T, h: D };
      }
      if (type === 'cyl' || type === 'cyl05') return { w: 1, d: 1, h: 1 };
      if (type === 'cylp' || type === 'cyl05p') return { w: 1, d: 1, h: 0.5 };
      if (type === 'connector') return { w: 1, d: 1, h: 1 };
      const cylSize = getLargeCylSize(type);
      if (cylSize !== null) return { w: cylSize, d: cylSize, h: type.endsWith('p') ? 0.5 : 1.0 };
      if (isCockpitType(type)) {
        const sz = type.replace('cockpit', '').split('x');
        let w = parseInt(sz[0]), d = parseInt(sz[1]);
        if ((rot / 90) % 2 !== 0) { const tmp = w; w = d; d = tmp; }
        return { w, d, h: 1 };
      }
      const isPlate = type.endsWith('p');
      const base = isPlate ? type.slice(0, -1) : type;
      const parts = base.split('x');
      let w = parseInt(parts[0]), d = parseInt(parts[1] || parts[0]);
      let h = isPlate ? 0.5 : 1;
      if ((rot / 90) % 2 !== 0) { const tmp = w; w = d; d = tmp; }
      return { w, d, h };
    }

    function blockLabel(type) {
      if (type === 'wheel')    return 'タイヤ';
      if (type === 'wheel3')   return 'タイヤ径3';
      if (type === 'wheel5')   return 'タイヤ径5';
      if (type === 'wheel5t2') return 'タイヤ径5厚';
      if (type === 'cyl')     return '円柱';
      if (type === 'cylp')    return '円柱薄';
      if (type === 'cyl05')   return '細柱';
      if (type === 'cyl05p')  return '細柱薄';
      if (type === 'connector') return '接続面';
      const cylSize = getLargeCylSize(type);
      if (cylSize !== null) return `円柱${cylSize}${type.endsWith('p') ? '薄' : ''}`;
      if (isCockpitType(type)) {
        const sz = type.replace('cockpit', '').split('x');
        return `CP${sz[0]}×${sz[1]}`;
      }
      const isPlate = type.endsWith('p');
      const base = isPlate ? type.slice(0, -1) : type;
      const [w, d] = base.split('x');
      return `${w}×${d}${isPlate ? '薄' : ''}`;
    }

    function getOccupiedCells(originX, originHY, originZ, type, rot, tilt) {
      if (type === 'wheel') return getWheelCells(originX, originHY, originZ, rot);
      // 横倒し円柱: 実効高さ = 直径（小型円柱のみ）
      if (tilt && isTiltableCylinder(type)) {
        const diameter = (type === 'cyl05' || type === 'cyl05p') ? 0.5 : 1.0;
        const hCells = Math.max(1, Math.round(diameter * 2));
        const cells = [];
        for (let hy = 0; hy < hCells; hy++) {
          cells.push(`${originX},${originHY + hy},${originZ}`);
        }
        return cells;
      }
      const dim = getBlockDimensions(type, rot);
      const cells = [];
      const hCells = Math.round(dim.h * 2); // 半グリッド単位: 標準=2, 薄板=1
      for (let x = 0; x < dim.w; x++) {
        for (let z = 0; z < dim.d; z++) {
          for (let hy = 0; hy < hCells; hy++) {
            cells.push(`${originX + x},${originHY + hy},${originZ + z}`);
          }
        }
      }
      return cells;
    }

    function getWheelCells(originX, originHY, originZ, rot) {
      const cells = [];
      const rotSteps = (Math.round(rot / 90) % 4 + 4) % 4;
      let axleX = 0, axleZ = 0;
      if      (rotSteps === 0) { axleX =  1; }
      else if (rotSteps === 1) { axleZ =  1; }
      else if (rotSteps === 2) { axleX = -1; }
      else                     { axleZ = -1; }

      // 本体: 半グリッド2セル(= 1フルユニット)
      cells.push(`${originX},${originHY},${originZ}`);
      cells.push(`${originX},${originHY+1},${originZ}`);

      // 車輪: アクスル先端を中心に Y方向±1フルユニット × 垂直方向3列
      // 各フルユニットY = 半グリッド2セル
      const wx = originX + axleX;
      const wz = originZ + axleZ;
      for (let dy = -1; dy <= 1; dy++) {          // フルユニットYオフセット
        const hy = originHY + dy * 2;              // 半グリッドY基点
        for (let dp = -1; dp <= 1; dp++) {         // 垂直方向オフセット
          const cx = axleX !== 0 ? wx : originX + dp;
          const cz = axleZ !== 0 ? wz : originZ + dp;
          cells.push(`${cx},${hy},${cz}`);
          cells.push(`${cx},${hy+1},${cz}`);
        }
      }
      return cells;
    }

    function canPlaceBlock(cells) {
      for (let key of cells) {
        const [x, y, z] = key.split(',').map(Number);
        if (y < 0 || Math.abs(x) >= GRID_SIZE / 2 || Math.abs(z) >= GRID_SIZE / 2) return false;
        if (occupiedGrid.has(key)) return false;
      }
      return true;
    }

    function createBlockMesh(type, color, rot, tilt) {
      if (type === 'wheel') return createWheelMesh(color, rot);
      if (isLargeWheelType(type)) return createLargeWheelMesh(type, color, rot);
      if (isCylinderType(type)) return createCylinderMesh(type, color, tilt);
      if (type === 'connector') return createConnectorMesh(color, rot);
      if (isCockpitType(type)) return createCockpitMesh(type, color, rot);
      const dim = getBlockDimensions(type, rot);
      const group = new THREE.Group();
      const mat = new THREE.MeshStandardMaterial({ color, roughness: 0.3 });

      const body = new THREE.Mesh(new THREE.BoxGeometry(dim.w - 0.01, dim.h - 0.01, dim.d - 0.01), mat);
      body.castShadow = true;
      body.receiveShadow = true;
      body.position.set(dim.w / 2 - 0.5, dim.h / 2, dim.d / 2 - 0.5);
      group.add(body);

      const studGeo = new THREE.CylinderGeometry(0.2, 0.2, 0.12, 12);
      for (let x = 0; x < dim.w; x++) {
        for (let z = 0; z < dim.d; z++) {
          const stud = new THREE.Mesh(studGeo, mat);
          stud.position.set(x, dim.h + 0.02, z);
          stud.castShadow = true;
          group.add(stud);
        }
      }
      return group;
    }

    function createWheelMesh(color, rot) {
      const group = new THREE.Group();
      const mat = new THREE.MeshStandardMaterial({ color, roughness: 0.3 });
      const tireMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.95 });

      const rotSteps = (Math.round(rot / 90) % 4 + 4) % 4;
      let axleX = 0, axleZ = 0;
      if      (rotSteps === 0) { axleX =  1; }
      else if (rotSteps === 1) { axleZ =  1; }
      else if (rotSteps === 2) { axleX = -1; }
      else                     { axleZ = -1; }

      // 本体ブロック (1×1×1)
      const body = new THREE.Mesh(new THREE.BoxGeometry(0.99, 0.99, 0.99), mat);
      body.castShadow = true;
      body.receiveShadow = true;
      body.position.set(0, 0.5, 0);
      group.add(body);

      // 本体上スタッド
      const studGeo = new THREE.CylinderGeometry(0.2, 0.2, 0.12, 12);
      const stud = new THREE.Mesh(studGeo, mat);
      stud.castShadow = true;
      stud.position.set(0, 1.02, 0);
      group.add(stud);

      // アクスル (本体中心→車輪中心)
      const axleGeo = new THREE.CylinderGeometry(0.1, 0.1, 1.0, 8);
      const axleMesh = new THREE.Mesh(axleGeo, mat);
      axleMesh.castShadow = true;
      axleMesh.position.set(axleX * 0.5, 0.5, axleZ * 0.5);
      if (axleX !== 0) axleMesh.rotation.z = Math.PI / 2;
      else             axleMesh.rotation.x = Math.PI / 2;
      group.add(axleMesh);

      // タイヤ外周 (トーラス、黒)
      const tireGeo = new THREE.TorusGeometry(0.95, 0.38, 8, 20);
      const tire = new THREE.Mesh(tireGeo, tireMat);
      tire.castShadow = true;
      tire.position.set(axleX, 0.5, axleZ);
      // Three.js TorusGeometry はデフォルトで X-Y平面 (Z軸がホール方向)
      // アクスルがX方向の場合 → ホールをX軸方向にするため rotation.y = π/2
      if (axleX !== 0) tire.rotation.y = Math.PI / 2;
      group.add(tire);

      // ホイールハブ (内側円板、ブロックカラー)
      const rimGeo = new THREE.CylinderGeometry(0.5, 0.5, 0.42, 12);
      const rim = new THREE.Mesh(rimGeo, mat);
      rim.castShadow = true;
      rim.position.set(axleX, 0.5, axleZ);
      if (axleX !== 0) rim.rotation.z = Math.PI / 2;
      else             rim.rotation.x = Math.PI / 2;
      group.add(rim);

      return group;
    }

    function createLargeWheelMesh(type, color, rot) {
      const group = new THREE.Group();
      const spec = getLargeWheelSpec(type);
      const D = spec.diameter, T = spec.thickness;
      const dim = getBlockDimensions(type, rot);
      const w = dim.w, d = dim.d, h = dim.h;

      const mat = new THREE.MeshStandardMaterial({ color, roughness: 0.3, metalness: 0.1 });
      const tireMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.95 });

      const rotSteps = (Math.round(rot / 90) % 4 + 4) % 4;
      const axleAlongX = (rotSteps === 0 || rotSteps === 2);

      // Wheel center in group local space
      const cx = w / 2 - 0.5, cy = h / 2, cz = d / 2 - 0.5;

      // Torus parameters: outer_radius = R + tubeR ≈ h/2
      let R, tubeR;
      if (D === 3) {
        R = 0.76; tubeR = 0.65;       // fat tire, 3-diameter
      } else if (T === 1) {
        R = 2.0;  tubeR = 0.47;       // thin tire, 5-diameter
      } else {
        R = 1.6;  tubeR = 0.87;       // fat tire, 5-diameter
      }

      // Tire torus
      const tire = new THREE.Mesh(
        new THREE.TorusGeometry(R, tubeR, 12, Math.max(24, D * 8)),
        tireMat
      );
      tire.castShadow = true;
      tire.position.set(cx, cy, cz);
      if (axleAlongX) tire.rotation.y = Math.PI / 2;
      group.add(tire);

      // Hub cylinder (along axle axis)
      const hubR = h * 0.10;
      const hubH = T - 0.2;
      const hub = new THREE.Mesh(new THREE.CylinderGeometry(hubR, hubR, hubH, 12), mat);
      hub.castShadow = true;
      hub.position.set(cx, cy, cz);
      if (axleAlongX) hub.rotation.z = Math.PI / 2;
      else            hub.rotation.x = Math.PI / 2;
      group.add(hub);

      // Hub end caps
      const capGeo = new THREE.CylinderGeometry(hubR * 1.5, hubR * 1.5, 0.05, 12);
      [-1, 1].forEach(side => {
        const cap = new THREE.Mesh(capGeo, mat);
        if (axleAlongX) {
          cap.position.set(cx + side * hubH / 2, cy, cz);
          cap.rotation.z = Math.PI / 2;
        } else {
          cap.position.set(cx, cy, cz + side * hubH / 2);
          cap.rotation.x = Math.PI / 2;
        }
        group.add(cap);
      });

      // Spokes (for 5×5 wheels)
      if (D >= 5) {
        const numSpokes = 5;
        const spokeLen = R - hubR - 0.1;
        const spokeGeo = new THREE.CylinderGeometry(0.06, 0.06, spokeLen, 6);
        for (let i = 0; i < numSpokes; i++) {
          const angle = (i / numSpokes) * Math.PI * 2;
          const halfL = hubR + spokeLen / 2;
          const spoke = new THREE.Mesh(spokeGeo, mat);
          spoke.castShadow = true;
          if (axleAlongX) {
            spoke.position.set(cx, cy + Math.sin(angle) * halfL, cz + Math.cos(angle) * halfL);
            spoke.rotation.x = Math.PI / 2 - angle;
          } else {
            spoke.position.set(cx + Math.cos(angle) * halfL, cy + Math.sin(angle) * halfL, cz);
            spoke.rotation.z = angle - Math.PI / 2;
          }
          group.add(spoke);
        }
      }

      return group;
    }

    function createCylinderMesh(type, color, tilt) {
      const group = new THREE.Group();
      const mat = new THREE.MeshStandardMaterial({ color, roughness: 0.3 });

      const cylSize = getLargeCylSize(type);
      if (cylSize !== null) {
        // 大型円柱 (2×2 〜 5×5)
        const isThin = type.endsWith('p');
        const h = isThin ? 0.5 : 1.0;
        const radius = cylSize / 2 - 0.01;
        const cx = cylSize / 2 - 0.5; // 標準ブロックと同じオフセット規則
        const body = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius, h - 0.01, Math.max(24, cylSize * 8)), mat);
        body.castShadow = true;
        body.receiveShadow = true;
        body.position.set(cx, h / 2, cx);
        group.add(body);
        return group;
      }

      // 小型円柱 (1×1 / 0.5径)
      const isHalf = type === 'cyl05' || type === 'cyl05p';
      const isThin = type === 'cylp'  || type === 'cyl05p';
      const radius = isHalf ? 0.245 : 0.49;
      const h = isThin ? 0.5 : 1.0;

      const body = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius, h - 0.01, 16), mat);
      body.castShadow = true;
      body.receiveShadow = true;
      body.position.set(0, h / 2, 0);
      if (tilt === 'z') body.rotation.z = Math.PI / 2;
      if (tilt === 'x') body.rotation.x = Math.PI / 2;
      group.add(body);

      if (!tilt) {
        const studR = isHalf ? 0.1 : 0.18;
        const stud = new THREE.Mesh(new THREE.CylinderGeometry(studR, studR, 0.1, 12), mat);
        stud.castShadow = true;
        stud.position.set(0, h + 0.01, 0);
        group.add(stud);
      }

      return group;
    }

    function createConnectorMesh(color, rot) {
      const group = new THREE.Group();
      const mat = new THREE.MeshStandardMaterial({ color, roughness: 0.3 });
      const rotSteps = (Math.round(rot / 90) % 4 + 4) % 4;
      let axleX = 0, axleZ = 0;
      if      (rotSteps === 0) { axleX =  1; }
      else if (rotSteps === 1) { axleZ =  1; }
      else if (rotSteps === 2) { axleX = -1; }
      else                     { axleZ = -1; }

      group.userData.blockType = 'connector';
      group.userData.axleX = axleX;
      group.userData.axleZ = axleZ;

      const body = new THREE.Mesh(new THREE.BoxGeometry(0.99, 0.99, 0.99), mat);
      body.castShadow = true;
      body.receiveShadow = true;
      body.position.set(0, 0.5, 0);
      group.add(body);

      const stud = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 0.12, 12), mat);
      stud.castShadow = true;
      stud.position.set(0, 1.02, 0);
      group.add(stud);

      // face disc (visual connection marker) — tagged as connector face
      const disc = new THREE.Mesh(new THREE.CylinderGeometry(0.38, 0.38, 0.06, 16), mat);
      disc.position.set(axleX * 0.53, 0.5, axleZ * 0.53);
      if (axleX !== 0) disc.rotation.z = Math.PI / 2;
      else             disc.rotation.x = Math.PI / 2;
      disc.userData.isConnectorFace = true;
      group.add(disc);

      // central peg — tagged as connector face
      const peg = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.18, 0.35, 12), mat);
      peg.castShadow = true;
      peg.position.set(axleX * (0.5 + 0.175), 0.5, axleZ * (0.5 + 0.175));
      if (axleX !== 0) peg.rotation.z = Math.PI / 2;
      else             peg.rotation.x = Math.PI / 2;
      peg.userData.isConnectorFace = true;
      group.add(peg);

      return group;
    }

    function createCockpitMesh(type, color, rot) {
      const group = new THREE.Group();
      const dim = getBlockDimensions(type, rot);
      const w = dim.w, d = dim.d;
      const cx = w / 2 - 0.5, cz = d / 2 - 0.5;

      const bodyMat = new THREE.MeshStandardMaterial({ color, roughness: 0.3 });
      const glassMat = new THREE.MeshStandardMaterial({
        color: 0x99ddff, roughness: 0.05, metalness: 0.1, transparent: true, opacity: 0.38
      });
      const darkMat = new THREE.MeshStandardMaterial({ color: 0x1a1a2e, roughness: 0.75 });

      // Solid lower body
      const bodyH = 0.50;
      const body = new THREE.Mesh(new THREE.BoxGeometry(w - 0.02, bodyH, d - 0.02), bodyMat);
      body.castShadow = true; body.receiveShadow = true;
      body.position.set(cx, bodyH / 2, cz);
      group.add(body);

      // Dark frame rim at canopy base
      const rimH = 0.06;
      const rim = new THREE.Mesh(new THREE.BoxGeometry(w - 0.02, rimH, d - 0.02), darkMat);
      rim.position.set(cx, bodyH + rimH / 2, cz);
      group.add(rim);

      // Transparent half-sphere dome
      const domeBaseY = bodyH + rimH;
      const domeH = 0.44;
      const dome = new THREE.Mesh(
        new THREE.SphereGeometry(1, 24, 12, 0, Math.PI * 2, 0, Math.PI / 2),
        glassMat
      );
      dome.scale.set((w - 0.1) / 2, domeH, (d - 0.1) / 2);
      dome.castShadow = true;
      dome.position.set(cx, domeBaseY, cz);
      group.add(dome);

      // Corner pillars (canopy frame struts)
      const pillarH = 0.28, pillarR = 0.035;
      const pxOff = (w - 0.18) / 2, pzOff = (d - 0.18) / 2;
      [[-1,-1],[-1,1],[1,-1],[1,1]].forEach(([sx,sz]) => {
        const pillar = new THREE.Mesh(new THREE.CylinderGeometry(pillarR, pillarR, pillarH, 8), darkMat);
        pillar.position.set(cx + sx * pxOff, domeBaseY + pillarH / 2, cz + sz * pzOff);
        group.add(pillar);
      });

      // Spine ridge(s) along top of dome
      const ridgeR = 0.03, ridgeTop = domeBaseY + domeH - 0.06;
      if (d > w) {
        const spine = new THREE.Mesh(new THREE.CylinderGeometry(ridgeR, ridgeR, d - 0.2, 8), darkMat);
        spine.rotation.x = Math.PI / 2;
        spine.position.set(cx, ridgeTop, cz);
        group.add(spine);
      } else if (w > d) {
        const spine = new THREE.Mesh(new THREE.CylinderGeometry(ridgeR, ridgeR, w - 0.2, 8), darkMat);
        spine.rotation.z = Math.PI / 2;
        spine.position.set(cx, ridgeTop, cz);
        group.add(spine);
      } else if (w >= 2) {
        [0, 1].forEach(axis => {
          const len = axis === 0 ? w : d;
          const sp = new THREE.Mesh(new THREE.CylinderGeometry(ridgeR, ridgeR, len - 0.2, 8), darkMat);
          if (axis === 0) sp.rotation.z = Math.PI / 2; else sp.rotation.x = Math.PI / 2;
          sp.position.set(cx, ridgeTop, cz);
          group.add(sp);
        });
      }

      // Interior seat/dashboard (dark platform, visible through glass)
      const seatW = Math.min(w - 0.4, w * 0.7);
      const seatD = Math.min(d - 0.4, d * 0.5);
      const seat = new THREE.Mesh(new THREE.BoxGeometry(seatW, 0.06, seatD), darkMat);
      seat.position.set(cx, bodyH + 0.04, cz);
      group.add(seat);

      return group;
    }

    function createCockpitPreviewMesh(type, rot) {
      const mkMat = () => new THREE.MeshBasicMaterial({ color: 0x00ff00, transparent: true, opacity: 0.38 });
      const dim = getBlockDimensions(type, rot);
      const w = dim.w, d = dim.d, h = dim.h;
      const bodyH = 0.50, rimH = 0.06;
      const yBase = -h / 2;

      const group = new THREE.Group();

      const body = new THREE.Mesh(new THREE.BoxGeometry(w - 0.04, bodyH, d - 0.04), mkMat());
      body.position.set(0, yBase + bodyH / 2, 0);
      group.add(body);

      const dome = new THREE.Mesh(
        new THREE.SphereGeometry(1, 16, 8, 0, Math.PI * 2, 0, Math.PI / 2),
        mkMat()
      );
      dome.scale.set((w - 0.1) / 2, 0.44, (d - 0.1) / 2);
      dome.position.set(0, yBase + bodyH + rimH, 0);
      group.add(dome);

      group.material = {
        color: { setHex: (hex) => group.traverse(c => { if (c.isMesh) c.material.color.setHex(hex); }) }
      };
      return group;
    }

    function createPreviewMesh() {
      if (currentBlockType === 'wheel') return createWheelPreviewMesh(currentRotation);
      if (isCylinderType(currentBlockType)) {
        return createCylinderPreviewMesh(currentBlockType, activeTilt);
      }
      if (currentBlockType === 'connector') return createConnectorPreviewMesh(currentRotation);
      if (isCockpitType(currentBlockType)) return createCockpitPreviewMesh(currentBlockType, currentRotation);
      const dim = getBlockDimensions(currentBlockType, currentRotation);
      const geo = new THREE.BoxGeometry(dim.w - 0.02, dim.h - 0.02, dim.d - 0.02);
      const mat = new THREE.MeshBasicMaterial({ color: 0x00ff00, transparent: true, opacity: 0.5 });
      return new THREE.Mesh(geo, mat);
    }

    function createCylinderPreviewMesh(type, tilt) {

      const cylSize = getLargeCylSize(type);
      if (cylSize !== null) {

      const isThin = type === 'cylp'  || type === 'cyl05p';

    function createConnectorPreviewMesh(rot) {

    function createWheelPreviewMesh(rot) {
      const rotSteps = (Math.round(rot / 90) % 4 + 4) % 4;
      let axleX = 0, axleZ = 0;
      if      (rotSteps === 0) { axleX =  1; }
      else if (rotSteps === 1) { axleZ =  1; }
      else if (rotSteps === 2) { axleX = -1; }
      else                     { axleZ = -1; }

      const mkMat = () => new THREE.MeshBasicMaterial({ color: 0x00ff00, transparent: true, opacity: 0.45 });

      const group = new THREE.Group();

      // 本体ボックス
      const base = new THREE.Mesh(new THREE.BoxGeometry(0.97, 0.97, 0.97), mkMat());
      base.position.set(0, 0.5, 0);
      group.add(base);

      // タイヤ (トーラス)
      const tire = new THREE.Mesh(new THREE.TorusGeometry(0.95, 0.38, 8, 20), mkMat());
      tire.position.set(axleX, 0.5, axleZ);
      if (axleX !== 0) tire.rotation.y = Math.PI / 2;
      group.add(tire);

      // ハブ (円盤)
      const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.5, 0.42, 12), mkMat());
      hub.position.set(axleX, 0.5, axleZ);
      if (axleX !== 0) hub.rotation.z = Math.PI / 2;
      else             hub.rotation.x = Math.PI / 2;
      group.add(hub);

      // .material.color.setHex() の呼び出しを全子メッシュに委譲
      group.material = {
        color: {
          setHex: (hex) => group.traverse(c => { if (c.isMesh) c.material.color.setHex(hex); })
        }
      };

      return group;
    }

    function updatePreviewMesh() {
      scene.remove(previewMesh);
      previewMesh = createPreviewMesh();
      scene.add(previewMesh);
    }

    function shiftSnapOffset() {
      const dim = getBlockDimensions(currentBlockType, currentRotation);
      snapOffsetX = (snapOffsetX + 1) % dim.w;
      if (snapOffsetX === 0) {
        snapOffsetZ = (snapOffsetZ + 1) % dim.d;
      }
      triggerVibrate();
    }

    // --- 💾 セーブ・ロード・エクスポート/インポート機能 ---
    function serializeCurrentState() {
      return blocksHistory.map(item => {
        return {
          type: item.type,
          color: item.color,
          rot: item.rot,
          tilt: item.tilt || null,
          pos: [item.group.position.x, item.group.position.y, item.group.position.z]
        };
      });
    }

    function loadStateData(dataArray) {
      clearAllBlocksSilent();
      if (!Array.isArray(dataArray)) return;

      dataArray.forEach(data => {
        const type = data.type;
        const color = data.color;
        const rot = data.rot;
        const [originX, worldY, originZ] = data.pos;
        const originHY = Math.round(worldY * 2); // world Y → 半グリッド整数

        const tilt = data.tilt || null;
        const cells = getOccupiedCells(originX, originHY, originZ, type, rot, tilt);
        const group = createBlockMesh(type, color, rot, tilt);
        group.position.set(originX, originHY * 0.5, originZ);
        scene.add(group);

        cells.forEach(key => occupiedGrid.set(key, group));

        group.traverse(child => {
          if (child.isMesh) {
            child.userData.rootGroup = group;
            blockMeshes.push(child);
          }
        });

        blocksHistory.push({ group, cells, type, color, rot, tilt });
      });

      updateBlockCount();
    }

    function autoSave() {
      try {
        const state = serializeCurrentState();
        localStorage.setItem('block_craft_autosave', JSON.stringify(state));
      } catch (e) {
        console.warn('AutoSave failed:', e);
      }
    }

    function autoLoad() {
      try {
        const saved = localStorage.getItem('block_craft_autosave');
        if (saved) {
          loadStateData(JSON.parse(saved));
        }
      } catch (e) {
        console.warn('AutoLoad failed:', e);
      }
    }

    function getSavedSlots() {
      try {
        const saved = localStorage.getItem('block_craft_slots');
        return saved ? JSON.parse(saved) : {};
      } catch (e) {
        return {};
      }
    }

    function updateSaveListUI() {
      const container = document.getElementById('save-list-container');
      container.innerHTML = '';
      const slots = getSavedSlots();
      const keys = Object.keys(slots);

      if (keys.length === 0) {
        container.innerHTML = '<div style="color:#aaa; font-size:11px; text-align:center;">保存された作品はありません</div>';
        return;
      }

      keys.forEach(name => {
        const item = document.createElement('div');
        item.className = 'save-item';
        item.innerHTML = `
          <span>${name}</span>
          <div class="save-item-btns">
            <button class="btn-load" onclick="loadSlot('${name}')">開く</button>
            <button class="btn-del" onclick="deleteSlot('${name}')">削除</button>
          </div>
        `;
        container.appendChild(item);
      });
    }

    function saveCurrentSlot() {
      const input = document.getElementById('save-name-input');
      const name = input.value.trim();
      if (!name) {
        alert('作品名を入力してください');
        return;
      }
      const slots = getSavedSlots();
      slots[name] = serializeCurrentState();
      localStorage.setItem('block_craft_slots', JSON.stringify(slots));
      input.value = '';
      updateSaveListUI();
      triggerVibrate();
    }

    function loadSlot(name) {
      const slots = getSavedSlots();
      if (slots[name]) {
        loadStateData(slots[name]);
        autoSave();
        triggerVibrate();
      }
    }

    function deleteSlot(name) {
      if (confirm(`作品「${name}」を削除しますか？`)) {
        const slots = getSavedSlots();
        delete slots[name];
        localStorage.setItem('block_craft_slots', JSON.stringify(slots));
        updateSaveListUI();
        triggerVibrate();
      }
    }

    function exportAllSaves() {
      const data = {
        autosave: serializeCurrentState(),
        slots: getSavedSlots()
      };
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `block_craft_saves_${new Date().toISOString().slice(0,10)}.json`;
      a.click();
      URL.revokeObjectURL(url);
    }

    function importAllSaves(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const data = JSON.parse(e.target.result);
          if (data.slots) {
            localStorage.setItem('block_craft_slots', JSON.stringify(data.slots));
          }
          if (data.autosave) {
            loadStateData(data.autosave);
            autoSave();
          }
          updateSaveListUI();
          alert('インポートが完了しました');
        } catch (err) {
          alert('ファイルの読み込みに失敗しました');
        }
      };
      reader.readAsText(file);
    }

    // --- 🕹️ 左側バーチャルパッド（視点移動）制御 ---
    const joystickZone = document.getElementById('joystick-zone');
    const joystickKnob = document.getElementById('joystick-knob');
    let isJoystickActive = false;
    let joystickTouchId = null;
    let joyVec = { x: 0, y: 0 };

    joystickZone.addEventListener('pointerdown', (e) => {
      isJoystickActive = true;
      joystickTouchId = e.pointerId;
      updateJoystick(e);
    });

    window.addEventListener('pointermove', (e) => {
      if (isJoystickActive && e.pointerId === joystickTouchId) {
        updateJoystick(e);
      }
    });

    window.addEventListener('pointerup', (e) => {
      if (isJoystickActive && e.pointerId === joystickTouchId) {
        isJoystickActive = false;
        joystickTouchId = null;
        joyVec = { x: 0, y: 0 };
        joystickKnob.style.transform = `translate(0px, 0px)`;
      }
    });

    function updateJoystick(e) {
      const rect = joystickZone.getBoundingClientRect();
      const centerX = rect.left + rect.width / 2;
      const centerY = rect.top + rect.height / 2;

      let dx = e.clientX - centerX;
      let dy = e.clientY - centerY;
      const dist = Math.hypot(dx, dy);
      const maxDist = rect.width / 2 - 10;

      if (dist > maxDist) {
        dx = (dx / dist) * maxDist;
        dy = (dy / dist) * maxDist;
      }

      joystickKnob.style.transform = `translate(${dx}px, ${dy}px)`;
      joyVec.x = dx / maxDist; // -1.0 〜 1.0
      joyVec.y = dy / maxDist;
    }

    // --- FPS / サバイバルスワイプ視点（画面スワイプで yaw/pitch / カメラ回転）---
    window.addEventListener('pointerdown', (e) => {
      if (gameMode !== 'fps' && gameMode !== 'survival') return;
      if (e.pointerId === joystickTouchId) return;
      if (fpsLookTouchId !== null) return;
      const t = e.target;
      if (t.tagName === 'BUTTON' || t.id === 'joystick-zone' || t.id === 'joystick-knob') return;
      fpsLookTouchId = e.pointerId;
      fpsLookLastX = e.clientX;
      fpsLookLastY = e.clientY;
    });
    window.addEventListener('pointermove', (e) => {
      if ((gameMode !== 'fps' && gameMode !== 'survival') || e.pointerId !== fpsLookTouchId) return;
      const dx = e.clientX - fpsLookLastX;
      const dy = e.clientY - fpsLookLastY;
      fpsLookLastX = e.clientX;
      fpsLookLastY = e.clientY;
      if (gameMode === 'fps') {
        player.yaw   -= dx * 0.003;
        player.pitch += dy * 0.003;
        player.pitch  = Math.max(-Math.PI / 2 + 0.05, Math.min(Math.PI / 2 - 0.05, player.pitch));
      } else {
        // サバイバル: カメラ水平回転のみ
        survivalCamTheta -= dx * 0.005;
      }
    });
    window.addEventListener('pointerup', (e) => {
      if (e.pointerId === fpsLookTouchId) fpsLookTouchId = null;
    });
    window.addEventListener('pointercancel', (e) => {
      if (e.pointerId === fpsLookTouchId) fpsLookTouchId = null;
    });

    // --- 🖐️ 画面タッチ（ズーム・パン・配置移動）制御 ---
    const dom = renderer.domElement;
    const activeTouches = new Map();
    let initialPinchDistance = null;
    let initialCameraRadius = null;
    let lastPanCenter = null;

    dom.addEventListener('pointerdown', (e) => {
      activeTouches.set(e.pointerId, { x: e.clientX, y: e.clientY });
      if (activeTouches.size === 2) {
        const points = Array.from(activeTouches.values());
        initialPinchDistance = Math.hypot(points[0].x - points[1].x, points[0].y - points[1].y);
        initialCameraRadius = cameraRadius;
        lastPanCenter = {
          x: (points[0].x + points[1].x) / 2,
          y: (points[0].y + points[1].y) / 2
        };
      }
    });

    dom.addEventListener('pointermove', (e) => {
      if (activeTouches.has(e.pointerId)) {
        activeTouches.set(e.pointerId, { x: e.clientX, y: e.clientY });
      }

      if (gameMode === 'fps' || gameMode === 'survival') return;

      // 2本指操作：ピンチイン・アウト（拡大縮小） & 2本指パン（カメラ位置移動）
      if (activeTouches.size === 2) {
        const points = Array.from(activeTouches.values());
        
        // 1. ピンチ拡大縮小
        const currentDist = Math.hypot(points[0].x - points[1].x, points[0].y - points[1].y);
        if (initialPinchDistance && currentDist > 0) {
          const factor = initialPinchDistance / currentDist;
          cameraRadius = Math.max(5, Math.min(80, initialCameraRadius * factor));
        }

        // 2. 二本指パン（カメラ位置移動）
        const currentPanCenter = {
          x: (points[0].x + points[1].x) / 2,
          y: (points[0].y + points[1].y) / 2
        };
        if (lastPanCenter) {
          const dx = currentPanCenter.x - lastPanCenter.x;
          const dy = currentPanCenter.y - lastPanCenter.y;

          const panSpeed = cameraRadius * 0.0015;
          const forward = new THREE.Vector3().subVectors(cameraTarget, camera.position);
          forward.y = 0;
          forward.normalize();

          const right = new THREE.Vector3().crossVectors(forward, new THREE.Vector3(0, 1, 0)).normalize();

          cameraTarget.addScaledVector(right, -dx * panSpeed);
          cameraTarget.addScaledVector(forward, dy * panSpeed);
        }
        lastPanCenter = currentPanCenter;

        updateCameraPosition();
      }
      // 1本指操作（視点パッド操作中でない場合）：レイキャスト位置検知
      else if (activeTouches.size === 1 && !isJoystickActive) {
        mouseVector.x = (e.clientX / window.innerWidth) * 2 - 1;
        mouseVector.y = -(e.clientY / window.innerHeight) * 2 + 1;
      }
    });

    const handlePointerEnd = (e) => {
      activeTouches.delete(e.pointerId);
      if (activeTouches.size < 2) {
        initialPinchDistance = null;
        initialCameraRadius = null;
        lastPanCenter = null;
      }
    };

    dom.addEventListener('pointerup', handlePointerEnd);
    dom.addEventListener('pointercancel', handlePointerEnd);

    // マウスホイールでの拡大縮小サポート
    dom.addEventListener('wheel', (e) => {
      e.preventDefault();
      cameraRadius = Math.max(5, Math.min(80, cameraRadius + e.deltaY * 0.02));
      updateCameraPosition();
    }, { passive: false });

    function getLargeCylSize(type) {
      // 'cyl2'/'cyl2p'...'cyl5'/'cyl5p' → 2..5  それ以外 → null
      const m = type.match(/^cyl([2-9]\d*)p?$/);
      return m ? parseInt(m[1]) : null;
    }

    function isCylinderType(type) {
      return type === 'cyl' || type === 'cylp' || type === 'cyl05' || type === 'cyl05p'
          || getLargeCylSize(type) !== null;
    }

    // tilt(横倒し)を適用できる円柱型（径 ≤ 1 のみ）
    function isTiltableCylinder(type) {
      return type === 'cyl' || type === 'cylp' || type === 'cyl05' || type === 'cyl05p';
    }

    function isCockpitType(type) {
      return type === 'cockpit1x1' || type === 'cockpit2x2' || type === 'cockpit2x3' || type === 'cockpit2x4';
    }

    function isLargeWheelType(type) {
      return type === 'wheel3' || type === 'wheel5' || type === 'wheel5t2';
    }

    function getLargeWheelSpec(type) {
      if (type === 'wheel3')   return { diameter: 3, thickness: 2 };
      if (type === 'wheel5')   return { diameter: 5, thickness: 1 };
      if (type === 'wheel5t2') return { diameter: 5, thickness: 2 };
      return null;
    }

    // 接続面ヒット検出: ヒットリストの先頭3件からコネクターブロックの接続面を探す
    function detectConnectorFace(intersects) {
      const limit = Math.min(intersects.length, 3);
      for (let i = 0; i < limit; i++) {
        const hit = intersects[i];
        if (hit.object === plane) continue;
        const grp = hit.object.parent;
        if (!grp || grp.userData.blockType !== 'connector') continue;

        // disc/pegメッシュ直接ヒット
        if (hit.object.userData.isConnectorFace) {
          return { axleX: grp.userData.axleX, axleZ: grp.userData.axleZ, group: grp };
        }
        // ボディ面法線チェック
        const norm = hit.face.normal.clone().transformDirection(hit.object.matrixWorld);
        const ax = grp.userData.axleX || 0, az = grp.userData.axleZ || 0;
        if (norm.x * ax + norm.z * az > 0.5) {
          return { axleX: ax, axleZ: az, group: grp };
        }
      }
      return null;
    }

    function updateRaycast() {
      if (mouseVector.x === -999) return;

      raycaster.setFromCamera(mouseVector, camera);
      const intersects = raycaster.intersectObjects([plane, ...blockMeshes], true);

      if (intersects.length > 0) {
        const hit = intersects[0];
        const dim = getBlockDimensions(currentBlockType, currentRotation);

        if (mode === 'add') {
          hoveredGroup = null;
          let originX, originY, originZ;

          // 接続面ヒット検出
          const connFace = detectConnectorFace(intersects);
          const newTilt = (connFace && isTiltableCylinder(currentBlockType))
            ? (connFace.axleX !== 0 ? 'z' : 'x')
            : null;
          if (newTilt !== activeTilt) {
            activeTilt = newTilt;
            updatePreviewMesh();
          }

          if (connFace) {
            // 接続面の隣に配置
            const cx = Math.round(connFace.group.position.x);
            const chy = Math.round(connFace.group.position.y * 2);
            const cz = Math.round(connFace.group.position.z);
            originX = cx + connFace.axleX;
            originY = chy;
            originZ = cz + connFace.axleZ;
          } else if (hit.object === plane) {
            originX = Math.floor(hit.point.x - dim.w / 2 + 0.5);
            originY = 0;
            originZ = Math.floor(hit.point.z - dim.d / 2 + 0.5);
          } else {
            const norm = hit.face.normal.clone().transformDirection(hit.object.matrixWorld);
            const p = hit.point.clone().add(norm.clone().multiplyScalar(0.5));
            originX = Math.floor(p.x) - snapOffsetX;
            originY = Math.max(0, Math.round(hit.point.y * 2)); // 半グリッド単位
            originZ = Math.floor(p.z) - snapOffsetZ;
          }

          targetOccupiedCells = getOccupiedCells(originX, originY, originZ, currentBlockType, currentRotation, activeTilt);
          isCanPlace = canPlaceBlock(targetOccupiedCells);

          previewMesh.position.set(originX + dim.w / 2 - 0.5, originY * 0.5 + dim.h / 2, originZ + dim.d / 2 - 0.5);
          previewMesh.material.color.setHex(isCanPlace ? 0x00ff00 : 0xff0000);
          previewMesh.visible = true;
        }
        else if (mode === 'delete') {
          if (activeTilt !== null) { activeTilt = null; }
          if (hit.object !== plane) {
            hoveredGroup = hit.object.userData.rootGroup;
            previewMesh.position.copy(hoveredGroup.position);
            previewMesh.material.color.setHex(0xff0000);
            previewMesh.visible = true;
          } else {
            hoveredGroup = null;
            previewMesh.visible = false;
          }
        }
      } else {
        if (activeTilt !== null) { activeTilt = null; updatePreviewMesh(); }
        previewMesh.visible = false;
        hoveredGroup = null;
      }
    }

    // UI初期化
    const colorPicker = document.getElementById('color-picker');
    palette.forEach((col, idx) => {
      const swatch = document.createElement('div');
      swatch.className = `color-swatch ${idx === 0 ? 'active' : ''}`;

      colorPicker.appendChild(swatch);

    document.getElementById('color-dot-btn').style.backgroundColor = initHex;
    document.getElementById('fps-color-dot').style.backgroundColor = initHex;

    function toggleMenu(id) {
      document.querySelectorAll('.sub-menu').forEach(m => {

    function toggleMode() {
      setMode(mode === 'add' ? 'delete' : 'add');
    }

    function setMode(m) {
      mode = m;
      const modeBtn = document.getElementById('btn-mode');
      const modeIcon = document.getElementById('mode-icon');
      const modeLabel = document.getElementById('mode-label');
      const actionBtn = document.getElementById('action-btn');

      const deleteBtn = document.getElementById('btn-delete');

        actionText.innerText = '配置';
      } else {

        modeIcon.innerText = '🗑️';
        modeLabel.innerText = '削除';
        actionIcon.innerText = '🗑️';

    }

    const BLOCK_SIZES = [
      [1,1],[1,2],[1,3],[1,4],[1,5],[1,8],
      [2,2],[2,3],[2,4],[2,5],[2,8],
      [3,3],[3,4],[3,5],[3,8],
      [4,4],[4,5],[4,8],
      [5,5],[5,8],
      [8,8]
    ];

    function buildBlockPicker() {
      const picker = document.getElementById('block-picker');
      picker.innerHTML = '';

      ['', 'p'].forEach(suffix => {
        const title = document.createElement('div');
        title.className = 'bp-section-title';
        title.textContent = suffix === '' ? '■ 標準ブロック' : '▬ 薄板 (高さ×0.5)';
        picker.appendChild(title);

        const grid = document.createElement('div');
        grid.className = 'bp-grid';
        BLOCK_SIZES.forEach(([w, d]) => {
          const type = `${w}x${d}${suffix}`;
          const btn = document.createElement('button');
          btn.className = 'opt-btn' + (type === currentBlockType ? ' active' : '');
          btn.textContent = blockLabel(type);
          btn.addEventListener('click', () => selectBlockType(type, btn));
          grid.appendChild(btn);
        });
        picker.appendChild(grid);
      });

      // 特殊ブロック
      const specialTitle = document.createElement('div');
      specialTitle.className = 'bp-section-title';
      specialTitle.textContent = '⚙ 特殊ブロック';
      picker.appendChild(specialTitle);

      const specialGrid = document.createElement('div');
      specialGrid.className = 'bp-grid';

      const specialTypes = [
        { type: 'wheel',    label: 'タイヤ',  title: '回転でアクスル方向を変更' },
        { type: 'connector', label: '接続面', title: '回転で接続面の向きを変更' },
        { type: 'cyl',      label: '円柱',   title: '直径1 高さ1' },
        { type: 'cylp',     label: '円柱薄', title: '直径1 高さ0.5' },
        { type: 'cyl05',    label: '細柱',   title: '直径0.5 高さ1' },
        { type: 'cyl05p',   label: '細柱薄', title: '直径0.5 高さ0.5' },
      ];
      specialTypes.forEach(({ type, label, title }) => {
        const btn = document.createElement('button');
        btn.className = 'opt-btn' + (currentBlockType === type ? ' active' : '');
        btn.textContent = label;
        btn.title = title;
        btn.addEventListener('click', () => selectBlockType(type, btn));
        specialGrid.appendChild(btn);
      });
      picker.appendChild(specialGrid);

      // 大型円柱セクション
      const largeCylTitle = document.createElement('div');
      largeCylTitle.className = 'bp-section-title';
      largeCylTitle.textContent = '◯ 大型円柱';
      picker.appendChild(largeCylTitle);

      const largeCylGrid = document.createElement('div');
      largeCylGrid.className = 'bp-grid';
      [2, 3, 4, 5].forEach(n => {
        ['', 'p'].forEach(suffix => {
          const type = `cyl${n}${suffix}`;
          const label = `円柱${n}${suffix === 'p' ? '薄' : ''}`;
          const title = `直径${n} 高さ${suffix === 'p' ? '0.5' : '1'}`;
          const btn = document.createElement('button');
          btn.className = 'opt-btn' + (currentBlockType === type ? ' active' : '');
          btn.textContent = label;
          btn.title = title;
          btn.addEventListener('click', () => selectBlockType(type, btn));
          largeCylGrid.appendChild(btn);
        });
      });
      picker.appendChild(largeCylGrid);

      // 大型タイヤセクション
      const largeWheelTitle = document.createElement('div');
      largeWheelTitle.className = 'bp-section-title';
      largeWheelTitle.textContent = '⊙ 大型タイヤ';
      picker.appendChild(largeWheelTitle);

      const largeWheelGrid = document.createElement('div');
      largeWheelGrid.className = 'bp-grid';
      [
        { type: 'wheel3',   label: 'タイヤ径3', title: '直径3 厚み2' },
        { type: 'wheel5',   label: 'タイヤ径5', title: '直径5 厚み1' },
        { type: 'wheel5t2', label: 'タイヤ径5厚', title: '直径5 厚み2' },
      ].forEach(({ type, label, title }) => {
        const btn = document.createElement('button');
        btn.className = 'opt-btn' + (currentBlockType === type ? ' active' : '');
        btn.textContent = label;
        btn.title = title;
        btn.addEventListener('click', () => selectBlockType(type, btn));
        largeWheelGrid.appendChild(btn);
      });
      picker.appendChild(largeWheelGrid);

      // コクピットセクション
      const cockpitTitle = document.createElement('div');
      cockpitTitle.className = 'bp-section-title';
      cockpitTitle.textContent = '🚀 コクピット';
      picker.appendChild(cockpitTitle);

      const cockpitGrid = document.createElement('div');
      cockpitGrid.className = 'bp-grid';
      [['cockpit1x1','1×1'],['cockpit2x2','2×2'],['cockpit2x3','2×3'],['cockpit2x4','2×4']].forEach(([type, sizeLabel]) => {
        const btn = document.createElement('button');
        btn.className = 'opt-btn' + (currentBlockType === type ? ' active' : '');
        btn.textContent = 'CP ' + sizeLabel;
        btn.title = `コクピット ${sizeLabel}`;
        btn.addEventListener('click', () => selectBlockType(type, btn));
        cockpitGrid.appendChild(btn);
      });
      picker.appendChild(cockpitGrid);
    }

    function selectBlockType(type, btn) {
      currentBlockType = type;
      snapOffsetX = 0;
      snapOffsetZ = 0;
      if (!isTiltableCylinder(type)) activeTilt = null;
      document.querySelectorAll('#block-picker .opt-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      updatePreviewMesh();
      const lbl = blockLabel(type);
      document.getElementById('block-type-label').innerText = lbl;
      document.getElementById('fps-block-label').innerText = lbl;
      toggleMenu('');
    }

    buildBlockPicker();
    document.getElementById('block-type-label').innerText = blockLabel(currentBlockType);
    document.getElementById('fps-block-label').innerText = blockLabel(currentBlockType);

    function rotatePreview() {
      currentRotation = (currentRotation + 90) % 360;
      snapOffsetX = 0;
      snapOffsetZ = 0;
      updatePreviewMesh();
      triggerVibrate();
    }

    const CAMERA_VIEWS = ['iso', 'front', 'top'];
    const CAMERA_VIEW_LABELS = { iso: '🎥 斜め', front: '🎥 正面', top: '🎥 真上' };
    let currentCameraViewIdx = 0;

    function setCameraView(view) {
      cameraTarget.set(0, 0, 0);
      if (view === 'front') { cameraTheta = 0; cameraPhi = Math.PI / 2.2; }
      if (view === 'top') { cameraTheta = 0; cameraPhi = 0.05; }
      if (view === 'iso') { cameraTheta = Math.PI / 4; cameraPhi = Math.PI / 3; }
      updateCameraPosition();
      toggleMenu('');
      currentCameraViewIdx = CAMERA_VIEWS.indexOf(view);
      if (currentCameraViewIdx < 0) currentCameraViewIdx = 0;
      const btn = document.getElementById('camera-view-btn');
      if (btn) btn.textContent = CAMERA_VIEW_LABELS[view];
    }

    function cycleCameraView() {
      currentCameraViewIdx = (currentCameraViewIdx + 1) % CAMERA_VIEWS.length;
      setCameraView(CAMERA_VIEWS[currentCameraViewIdx]);
    }

    function executeAction() {
      if (mode === 'add') {
        if (!isCanPlace || !previewMesh.visible) return;

        const dim = getBlockDimensions(currentBlockType, currentRotation);
        const group = createBlockMesh(currentBlockType, currentColor, currentRotation, activeTilt);

        const originX = previewMesh.position.x - dim.w / 2 + 0.5;
        const originY = previewMesh.position.y - dim.h / 2;
        const originZ = previewMesh.position.z - dim.d / 2 + 0.5;

        group.position.set(originX, originY, originZ);
        scene.add(group);

        targetOccupiedCells.forEach(key => occupiedGrid.set(key, group));

        group.traverse(child => {
          if (child.isMesh) {
            child.userData.rootGroup = group;
            blockMeshes.push(child);
          }
        });

        blocksHistory.push({ group, cells: [...targetOccupiedCells], type: currentBlockType, color: currentColor, rot: currentRotation, tilt: activeTilt });

        playSound('place');
        triggerVibrate();
        updateBlockCount();
        autoSave();
      } 
      else if (mode === 'delete') {
        if (!hoveredGroup) return;

        scene.remove(hoveredGroup);

        for (let [key, val] of occupiedGrid.entries()) {
          if (val === hoveredGroup) occupiedGrid.delete(key);
        }

        hoveredGroup.traverse(c => {
          const idx = blockMeshes.indexOf(c);
          if (idx > -1) blockMeshes.splice(idx, 1);
        });

        const hIdx = blocksHistory.findIndex(h => h.group === hoveredGroup);
        if (hIdx > -1) blocksHistory.splice(hIdx, 1);

        hoveredGroup = null;
        previewMesh.visible = false;

        playSound('delete');
        triggerVibrate();
        updateBlockCount();
        autoSave();
      }
    }

    function undoLastAction() {
      if (blocksHistory.length === 0) return;
      const last = blocksHistory.pop();
      scene.remove(last.group);

      last.cells.forEach(key => occupiedGrid.delete(key));
      last.group.traverse(c => {
        const idx = blockMeshes.indexOf(c);
        if (idx > -1) blockMeshes.splice(idx, 1);
      });

      playSound('delete');
      updateBlockCount();
      autoSave();
    }

    function updateBlockCount() {
      document.getElementById('block-count').innerText = `ブロック数: ${blocksHistory.length}`;
    }

    function clearAllBlocksSilent() {
      blocksHistory.forEach(h => scene.remove(h.group));
      blocksHistory.length = 0;
      blockMeshes.length = 0;
      occupiedGrid.clear();
      updateBlockCount();
    }

    function clearAllBlocks() {
      if (confirm('すべて消去しますか？')) {
        clearAllBlocksSilent();
        autoSave();
      }
    }

    // ===== FPS: モード切替 =====
    function switchMode() {
      if (gameMode === 'survival') return;
      if (gameMode === 'build') enterFPSMode(); else enterBuildMode();
    }

    function enterFPSMode() {
      gameMode = 'fps';
      player.pos.set(cameraTarget.x, Math.max(0, cameraTarget.y), cameraTarget.z);
      player.vel.set(0, 0, 0);
      player.yaw = cameraTheta;
      player.pitch = 0;
      player.onGround = false;
      player.isFlying = false;
      lastFPSTime = performance.now();

      document.getElementById('toolbar').style.display = 'none';

    function enterBuildMode() {
      gameMode = 'build';
      cameraTarget.set(player.pos.x, 0, player.pos.z);

      document.getElementById('mode-switch-btn').classList.remove('fps-active');
