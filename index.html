<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>BLOCK CRAFT 3D</title>
  <meta name="description" content="3Dブロックで自由に作れるモバイル向けクラフトゲーム">
  <meta name="theme-color" content="#1a1a24">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="BlockCraft">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icons/favicon.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #1a1a24;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #canvas-container {
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    /* 🕹️ 左側 バーチャルパッド（ツールバーの上に配置） */
    #joystick-zone {
      position: absolute;
      bottom: calc(max(10px, env(safe-area-inset-bottom)) + 70px);
      left: 15px;
      width: 100px;
      height: 100px;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(8px);
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      touch-action: none;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #joystick-knob {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      border: 2px solid #fff;
      border-radius: 50%;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      position: absolute;
      pointer-events: none;
      transition: transform 0.05s ease-out;
    }
    #joystick-label {
      position: absolute;
      top: -22px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 11px;
      color: rgba(255,255,255,0.8);
      font-weight: bold;
      white-space: nowrap;
      pointer-events: none;
      text-shadow: 0 1px 3px rgba(0,0,0,0.8);
    }

    /* 上部ステータス */
    #top-bar {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
      z-index: 5;
    }
    .badge {
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(8px);
      color: #fff;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: bold;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    /* 🔘 アクションボタン（画面右下・ツールバーの上に配置） */
    #action-btn {
      position: absolute;
      bottom: calc(max(10px, env(safe-area-inset-bottom)) + 70px);
      right: 15px;
      width: 70px;
      height: 70px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: #fff;
      font-size: 12px;
      font-weight: bold;
      box-shadow: 0 8px 25px rgba(37, 99, 235, 0.5);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      z-index: 20;
      transition: transform 0.1s ease;
    }
    #action-btn:active { transform: scale(0.9); }
    #action-btn.delete-mode {
      background: linear-gradient(135deg, #dc2626, #991b1b);
      box-shadow: 0 8px 25px rgba(220, 38, 38, 0.5);
    }
    #action-btn span { font-size: 20px; line-height: 1; }

    /* 下部UIツールバー */
    #toolbar {
      position: absolute;
      bottom: max(10px, env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 4px;
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(14px);
      padding: 6px 10px;
      border-radius: 22px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      max-width: 96vw;
      z-index: 25;
    }
    .toolbar-sep {
      width: 1px;
      background: rgba(0,0,0,0.12);
      align-self: stretch;
      margin: 3px 2px;
      flex-shrink: 0;
    }

    .btn {
      border: none;
      background: #f0f0f5;
      color: #333;
      padding: 6px 8px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      min-width: 46px;
      flex-shrink: 0;
      transition: all 0.15s ease;
    }
    .btn:active { transform: scale(0.92); }
    .btn.active { background: #2563eb; color: #fff; }

    /* モードトグルボタン */
    #btn-mode {
      background: #2563eb;
      color: #fff;
      min-width: 58px;
    }
    #btn-mode.delete-mode {
      background: #dc2626;
    }

    /* カラードット */
    .color-dot {
      display: inline-block;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 2px solid rgba(0,0,0,0.18);
      vertical-align: middle;
      flex-shrink: 0;
    }

    /* ブロック種ラベル */
    #block-type-label {
      font-size: 9px;
      color: #2563eb;
      font-weight: bold;
      line-height: 1;
    }

    /* その他メニュー（縦型） */
    #more-menu {
      flex-direction: column !important;
      width: 200px;
      gap: 4px !important;
    }
    #more-menu .opt-btn {
      text-align: left;
      width: 100%;
    }
    #more-menu .opt-btn.danger {
      color: #ff7070;
      border-top: 1px solid rgba(255,255,255,0.15);
      padding-top: 10px;
      margin-top: 4px;
    }

    /* サブメニュー（ツールバーのすぐ上に表示） */
    .sub-menu {
      position: absolute;
      bottom: calc(max(10px, env(safe-area-inset-bottom)) + 64px);
      left: 50%;
      transform: translateX(-50%);
      display: none;
      gap: 8px;
      background: rgba(20, 20, 30, 0.92);
      backdrop-filter: blur(14px);
      padding: 10px 14px;
      border-radius: 18px;
      z-index: 30;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      border: 1px solid rgba(255,255,255,0.08);
    }
    .color-swatch {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 2px solid #fff;
      cursor: pointer;
    }
    .color-swatch.active { transform: scale(1.25); border-color: #ffd700; }
    .opt-btn {
      background: rgba(255,255,255,0.2);
      color: #fff;
      border: none;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
    }
    .opt-btn.active { background: #2563eb; }

    /* ブロックピッカー */
    #block-picker {
      flex-direction: column;
      width: 310px;
      max-height: 52vh;
      overflow-y: auto;
      gap: 5px;
    }
    .bp-section-title {
      font-size: 10px;
      font-weight: bold;
      color: rgba(255,255,255,0.5);
      letter-spacing: 0.5px;
      padding: 2px 0 1px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    .bp-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }
    .bp-grid .opt-btn {
      min-width: 42px;
      padding: 5px 6px;
      font-size: 10px;
      font-weight: bold;
    }

    /* 作品管理メニューのスタイル */
    #save-picker {
      flex-direction: column;
      width: 280px;
      max-height: 320px;
      overflow-y: auto;
    }
    .save-input-group {
      display: flex;
      gap: 6px;
      margin-bottom: 6px;
    }
    .save-input-group input {
      flex: 1;
      padding: 6px 10px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.3);
      background: rgba(255,255,255,0.1);
      color: #fff;
      font-size: 12px;
    }
    .save-input-group input::placeholder { color: #aaa; }
    .save-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 180px;
      overflow-y: auto;
    }
    .save-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255,255,255,0.1);
      padding: 6px 10px;
      border-radius: 8px;
      color: #fff;
      font-size: 12px;
    }
    .save-item-btns {
      display: flex;
      gap: 4px;
    }
    .save-item-btns button {
      padding: 4px 8px;
      border-radius: 6px;
      border: none;
      font-size: 10px;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-load { background: #2563eb; color: #fff; }
    .btn-del { background: #dc2626; color: #fff; }
    .file-io-group {
      display: flex;
      gap: 6px;
      margin-top: 6px;
      border-top: 1px solid rgba(255,255,255,0.2);
      padding-top: 6px;
    }
    /* ===== FPS モード ===== */
    #mode-switch-btn {
      position: absolute;
      top: 12px; left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(8px);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.2);
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 12px; font-weight: bold;
      cursor: pointer; z-index: 30;
      transition: background 0.2s, transform 0.1s;
      white-space: nowrap;
    }
    #mode-switch-btn:active { transform: translateX(-50%) scale(0.95); }
    #mode-switch-btn.fps-active { background: rgba(37,99,235,0.8); border-color: rgba(99,179,237,0.4); }

    #camera-view-btn {
      position: absolute;
      top: 12px; left: 12px;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(8px);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.2);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12px; font-weight: bold;
      cursor: pointer; z-index: 30;
      transition: background 0.2s, transform 0.1s;
      white-space: nowrap;
    }
    #camera-view-btn:active { transform: scale(0.95); }

    #fps-overlay {
      display: none;
      position: absolute; inset: 0;
      pointer-events: none; z-index: 15;
    }
    #crosshair {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 20px; height: 20px;
    }
    #crosshair::before, #crosshair::after {
      content: ''; position: absolute;
      background: rgba(255,255,255,0.88);
      box-shadow: 0 0 2px rgba(0,0,0,0.8);
    }
    #crosshair::before { width: 2px; height: 100%; left: 50%; transform: translateX(-50%); }
    #crosshair::after  { height: 2px; width: 100%; top: 50%; transform: translateY(-50%); }
    #fly-indicator {
      display: none;
      position: absolute; top: 58px; left: 50%;
      transform: translateX(-50%);
      background: rgba(37,99,235,0.85); color: #fff;
      padding: 4px 14px; border-radius: 14px;
      font-size: 12px; font-weight: bold;
      border: 1px solid rgba(255,255,255,0.2);
    }
    #delete-ring {
      display: none;
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 56px; height: 56px;
    }
    #delete-ring svg { transform: rotate(-90deg); }
    #delete-ring circle {
      fill: none; stroke: #ef4444; stroke-width: 4;
      stroke-dasharray: 132; stroke-dashoffset: 132;
      stroke-linecap: round;
    }

    #fps-edit-btns {
      display: flex;
      position: absolute;
      bottom: calc(max(10px, env(safe-area-inset-bottom)) + 150px);
      right: 15px;
      flex-direction: row;
      gap: 6px;
      z-index: 20;
    }
    .fps-edit-btn {
      width: 48px; height: 48px; border-radius: 50%;
      border: 1.5px solid rgba(255,255,255,0.35);
      background: rgba(20,20,40,0.72);
      backdrop-filter: blur(8px);
      color: #fff; font-size: 20px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.45);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: transform 0.1s;
      touch-action: manipulation;
    }
    .fps-edit-btn:active { transform: scale(0.88); }

    #jump-btn {
      display: none;
      position: absolute;
      bottom: calc(max(10px, env(safe-area-inset-bottom)) + 212px);
      right: 15px;
      width: 56px; height: 56px; border-radius: 50%;
      border: none;
      background: linear-gradient(135deg, #16a34a, #15803d);
      color: #fff; font-size: 22px;
      box-shadow: 0 6px 18px rgba(22,163,74,0.5);
      cursor: pointer; flex-direction: column;
      align-items: center; justify-content: center;
      z-index: 20; transition: transform 0.1s;
    }
    #jump-btn:active { transform: scale(0.9); }

    #fly-down-btn {
      display: none;
      position: absolute;
      bottom: calc(max(10px, env(safe-area-inset-bottom)) + 282px);
      right: 15px;
      width: 56px; height: 56px; border-radius: 50%;
      border: none;
      background: linear-gradient(135deg, #ca8a04, #a16207);
      color: #fff; font-size: 22px;
      box-shadow: 0 6px 18px rgba(202,138,4,0.4);
      cursor: pointer; flex-direction: column;
      align-items: center; justify-content: center;
      z-index: 20; transition: transform 0.1s;
    }
    #fly-down-btn:active { transform: scale(0.9); }

    #fps-action-btn {
      display: none;
      position: absolute;
      bottom: calc(max(10px, env(safe-area-inset-bottom)) + 70px);
      right: 15px;
      width: 70px; height: 70px; border-radius: 50%;
      border: none;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: #fff; font-size: 12px; font-weight: bold;
      box-shadow: 0 8px 25px rgba(37,99,235,0.5);
      cursor: pointer; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 2px; z-index: 20; touch-action: none;
      transition: transform 0.1s, background 0.2s;
    }
    #fps-action-btn:active { transform: scale(0.9); }
    #fps-action-btn.deleting {
      background: linear-gradient(135deg, #dc2626, #991b1b);
      box-shadow: 0 8px 25px rgba(220,38,38,0.5);
    }
    #fps-action-btn span { font-size: 20px; line-height: 1; }

    #fps-toolbar {
      display: none;
      position: absolute;
      bottom: max(10px, env(safe-area-inset-bottom));
      left: 50%; transform: translateX(-50%);
      align-items: center; gap: 4px;
      background: rgba(255,255,255,0.88);
      backdrop-filter: blur(14px);
      padding: 6px 10px; border-radius: 22px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      max-width: 96vw; z-index: 25;
    }

    /* ===== サバイバルモード HUD ===== */
    #survival-hud {
      display: none;
      position: absolute;
      bottom: calc(max(10px, env(safe-area-inset-bottom)) + 10px);
      right: 15px;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
      z-index: 20;
      pointer-events: none;
    }
    #survival-exit-btn {
      pointer-events: auto;
      background: rgba(37,99,235,0.85);
      backdrop-filter: blur(8px);
      color: #fff;
      border: 1px solid rgba(99,179,237,0.4);
      padding: 10px 22px;
      border-radius: 22px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      touch-action: manipulation;
      transition: transform 0.1s;
      white-space: nowrap;
    }
    #survival-exit-btn:active { transform: scale(0.95); }
    #survival-recover-btn {
      pointer-events: auto;
      background: rgba(217,119,6,0.88);
      backdrop-filter: blur(8px);
      color: #fff;
      border: 1px solid rgba(251,191,36,0.35);
      padding: 10px 22px;
      border-radius: 22px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      touch-action: manipulation;
      transition: transform 0.1s;
      white-space: nowrap;
    }
    #survival-recover-btn:active { transform: scale(0.95); }
    #badge-flip {
      display: none;
      background: rgba(127,0,0,0.75);
      border-color: rgba(239,68,68,0.5);
      animation: flipPulse 0.7s ease-in-out infinite alternate;
    }
    #badge-flip .survival-num { color: #fca5a5; font-size: 20px; }
    @keyframes flipPulse {
      from { opacity: 0.75; }
      to   { opacity: 1.0; }
    }
    #survival-enter-btn {
      display: none;
      position: absolute;
      bottom: calc(max(10px, env(safe-area-inset-bottom)) + 215px);
      right: 15px;
      background: rgba(239,68,68,0.85);
      backdrop-filter: blur(8px);
      color: #fff;
      border: 1px solid rgba(252,165,165,0.4);
      padding: 10px 22px;
      border-radius: 22px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      touch-action: manipulation;
      transition: transform 0.1s;
      white-space: nowrap;
      z-index: 20;
    }
    #survival-enter-btn:active { transform: scale(0.95); }
    .survival-badge {
      background: rgba(0,0,0,0.65);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 16px;
      padding: 8px 18px;
      text-align: center;
      min-width: 76px;
    }
    .survival-num {
      color: #fff;
      font-size: 22px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      line-height: 1;
    }
    .survival-badge-label {
      color: rgba(255,255,255,0.45);
      font-size: 9px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-top: 3px;
    }
    #survival-hint {
      display: none;
      position: absolute;
      top: 52px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(8px);
      color: rgba(255,255,255,0.8);
      border: 1px solid rgba(255,255,255,0.12);
      padding: 5px 16px;
      border-radius: 14px;
      font-size: 11px;
      font-weight: bold;
      pointer-events: none;
      z-index: 30;
      white-space: nowrap;
    }
    /* ===== ワールドビルドモード ===== */
    #wb-crosshair {
      display: none;
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 24px; height: 24px;
      pointer-events: none;
      z-index: 31;
    }
    #wb-crosshair::before, #wb-crosshair::after {
      content: '';
      position: absolute;
      background: rgba(255,255,255,0.85);
      border-radius: 2px;
    }
    #wb-crosshair::before { width: 2px; height: 100%; left: 50%; transform: translateX(-50%); }
    #wb-crosshair::after  { width: 100%; height: 2px; top: 50%; transform: translateY(-50%); }
    #wb-panel {
      display: none;
      position: absolute;
      bottom: calc(max(10px, env(safe-area-inset-bottom)) + 10px);
      right: 15px;
      background: rgba(10,15,30,0.82);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 18px;
      padding: 12px 14px;
      z-index: 32;
      flex-direction: column;
      gap: 10px;
      min-width: 220px;
    }
    #wb-panel-title {
      color: rgba(255,255,255,0.5);
      font-size: 9px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      text-align: center;
    }
    #wb-swatches {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 5px;
    }
    .wb-swatch {
      width: 24px; height: 24px;
      border-radius: 6px;
      border: 2px solid transparent;
      cursor: pointer;
      transition: transform 0.1s, border-color 0.1s;
      touch-action: manipulation;
    }
    .wb-swatch.active { border-color: #fff; transform: scale(1.2); }
    .wb-swatch:active { transform: scale(0.9); }
    #wb-delete-btn {
      background: rgba(239,68,68,0.75);
      border: 1px solid rgba(252,165,165,0.35);
      color: #fff;
      border-radius: 10px;
      padding: 7px 0;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
      touch-action: manipulation;
      transition: background 0.15s, transform 0.1s;
    }
    #wb-delete-btn.active { background: rgba(239,68,68,1); border-color: #fff; }
    #wb-delete-btn:active { transform: scale(0.95); }
    #wb-drive-btn {
      background: rgba(34,197,94,0.75);
      border: 1px solid rgba(134,239,172,0.35);
      color: #fff;
      border-radius: 10px;
      padding: 7px 0;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
      touch-action: manipulation;
      transition: background 0.15s, transform 0.1s;
    }
    #wb-drive-btn:active { transform: scale(0.95); }
    #wb-build-toggle-btn {
      pointer-events: auto;
      background: rgba(234,179,8,0.85);
      backdrop-filter: blur(8px);
      color: #000;
      border: 1px solid rgba(253,224,71,0.4);
      padding: 10px 22px;
      border-radius: 22px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      touch-action: manipulation;
      transition: transform 0.1s;
      white-space: nowrap;
    }
    #wb-build-toggle-btn:active { transform: scale(0.95); }

<body>

  <div id="canvas-container"></div>

  <!-- ========== オープニング画面 ========== -->
  <div id="opening-screen">
    <div id="opening-inner">
      <div id="opening-logo">
        <div id="opening-eye">3D</div>
        <div id="opening-title">BLOCK CRAFT</div>
        <div id="opening-subtitle">Build · Drive · Survive</div>
      </div>
      <div id="opening-modes">
        <button class="mode-btn" id="btn-creative" onclick="startCreativeMode()">
          <span class="mode-btn-icon">🏗</span>
          <div class="mode-btn-title">クリエイティブ</div>
          <div class="mode-btn-desc">ブロックを自由に<br>組み立てよう</div>
        </button>
        <button class="mode-btn" id="btn-survival" onclick="showSurvivalOptions()">
          <span class="mode-btn-icon">⚔</span>
          <div class="mode-btn-title">サバイバル</div>
          <div class="mode-btn-desc">ビークルを操り<br>戦場へ飛び込め</div>
        </button>
      </div>

      <!-- サバイバル開始オプション（サバイバルボタン押下後に表示） -->
      <div id="survival-options">
        <div class="surv-opt-title">⚔ サバイバル</div>
        <button class="mode-btn surv-opt-btn" onclick="survivalNewGame()">
          <span class="mode-btn-icon">🆕</span>
          <div><div class="mode-btn-title">ニューゲーム</div><div class="mode-btn-desc">コクピット1個から始める</div></div>
        </button>
        <button class="mode-btn surv-opt-btn" id="btn-survival-continue" onclick="survivalContinue()">
          <span class="mode-btn-icon">▶</span>
          <div><div class="mode-btn-title">続きから</div><div class="mode-btn-desc">オートセーブを再開</div></div>
        </button>
        <div id="survival-load-slots"></div>
        <button id="btn-surv-back" onclick="hideSurvivalOptions()">← 戻る</button>
      </div>
    </div>
    <div id="opening-footer">
      <span class="footer-tap">Tap to start</span>
      <span class="footer-version">build 2026-08-09h · wheel-center-align</span>
    </div>
  </div>

  <!-- 左側 バーチャルパッド (視点操作) -->
  <div id="joystick-zone">
    <div id="joystick-label">移動</div>
    <div id="joystick-knob"></div>
  </div>

  <div id="top-bar">
    <div class="badge">BLOCK CRAFT</div>
    <div class="badge" id="block-count">ブロック数: 0</div>
  </div>

  <!-- アクション執行ボタン -->
  <button id="action-btn" onclick="executeAction()">
    <span id="action-icon">🧱</span>
    <div id="action-text">配置</div>
  </button>

  <!-- ブロック種類選択（JS で動的生成） -->
  <div id="block-picker" class="sub-menu"></div>

  <!-- 色選択 -->
  <div id="color-picker" class="sub-menu"></div>

  <!-- カメラ固定切替 -->
  <div id="camera-picker" class="sub-menu">
    <button class="opt-btn" onclick="setCameraView('front')">正面</button>
    <button class="opt-btn" onclick="setCameraView('top')">真上</button>
    <button class="opt-btn" onclick="setCameraView('iso')">斜め</button>
  </div>

  <!-- 作品管理メニュー -->
  <div id="save-picker" class="sub-menu">
    <div class="save-input-group">
      <input type="text" id="save-name-input" placeholder="作品名を入力...">
      <button class="opt-btn" onclick="saveCurrentSlot()">保存</button>
    </div>
    <div class="save-list" id="save-list-container"></div>
    <div class="file-io-group">
      <button class="opt-btn" style="flex: 1;" onclick="exportAllSaves()">💾 出力</button>
      <button class="opt-btn" style="flex: 1;" onclick="document.getElementById('import-file-input').click()">📂 読込</button>
      <input type="file" id="import-file-input" accept=".json" style="display:none" onchange="importAllSaves(event)">
    </div>
  </div>

  <!-- サバイバルセーブ/ロード モーダル -->
  <div id="survival-save-modal">
    <div class="surv-modal-inner">
      <div class="surv-modal-title">💾 ゲームをセーブ</div>
      <div class="surv-modal-save-row">
        <input type="text" id="surv-save-name-input" placeholder="セーブ名を入力...">
        <button class="opt-btn" onclick="executeSurvivalSave()">保存</button>
      </div>
      <div id="surv-save-slot-list"></div>
      <button id="btn-surv-modal-close" onclick="closeSurvivalSaveModal()">閉じる</button>
    </div>
  </div>

  <!-- 視点ボタン（左上固定・建築モードのみ） -->
  <button id="camera-view-btn" onclick="cycleCameraView()">🎥 斜め</button>

  <!-- モード切替（常時表示） -->
  <button id="mode-switch-btn" onclick="switchMode()">🎮 FPSモード</button>

  <!-- FPS オーバーレイ -->
  <div id="fps-overlay">
    <div id="crosshair"></div>
    <div id="fly-indicator">✈ 飛行中</div>
    <div id="delete-ring">
      <svg viewBox="0 0 56 56" width="56" height="56">
        <circle cx="28" cy="28" r="21"/>
      </svg>
    </div>
  </div>

  <!-- FPS 回転・位置ずらしボタン（配置ボタンの上） -->
  <div id="fps-edit-btns">
    <button class="fps-edit-btn" onclick="rotatePreview()" title="回転">🔄</button>
    <button class="fps-edit-btn" onclick="shiftSnapOffset()" title="横方向ずらし">↔️</button>
    <button class="fps-edit-btn" onclick="shiftSnapOffsetY()" title="上下方向ずらし">↕️</button>
  </div>

  <!-- 下降ボタン（飛行中のみ表示） -->
  <button id="fly-down-btn">⬇</button>

  <!-- ジャンプ / 上昇ボタン -->
  <button id="jump-btn">⬆</button>

  <!-- FPS アクション（タップ=配置 / 長押し=削除） -->
  <button id="fps-action-btn">
    <span>🧱</span>
    <div>配置/削除</div>
  </button>

  <!-- FPS ツールバー -->
  <div id="fps-toolbar">
    <button class="btn" onclick="toggleMenu('block-picker')">
      <span>🧱</span>
      <div id="fps-block-label">1×1</div>
    </button>
    <button class="btn" onclick="toggleMenu('color-picker')">
      <span id="fps-color-dot" class="color-dot"></span>
      <div>カラー</div>
    </button>
    <div class="toolbar-sep"></div>
    <button class="btn" id="btn-fly" onclick="toggleFlyMode()">
      <span>✈</span>
      <div>飛行</div>
    </button>
    <div class="toolbar-sep"></div>
    <button class="btn" onclick="enterBuildMode()">
      <span>🏗</span>
      <div>建築へ</div>
    </button>
  </div>

  <!-- サバイバル HUD -->
  <div id="survival-hud">
    <button id="survival-exit-btn" onclick="exitSurvivalMode()">🏗 組立へ</button>
    <button id="wb-build-toggle-btn" onclick="toggleWorldBuildMode()">🧱 建設</button>
    <button id="survival-recover-btn" onclick="recoverVehicle()">↩ 回復</button>
    <div class="survival-badge" id="badge-flip">
      <div class="survival-num" id="flip-countdown">3</div>
      <div class="survival-badge-label">転倒 自動回復</div>
    </div>
    <div class="survival-badge" id="badge-speed">
      <div class="survival-num" id="survival-speed">0</div>
      <div class="survival-badge-label">km/h</div>
    </div>
    <div class="survival-badge" id="badge-gear">
      <div class="survival-num" id="survival-gear" style="color:#22c55e">D</div>
      <div class="survival-badge-label">ギア</div>
    </div>
    <div class="survival-badge" id="badge-engine">
      <div class="survival-num" id="survival-engine" style="font-size:11px;color:#f87171">-</div>
      <div class="survival-badge-label">物理</div>
    </div>
  </div>

  <!-- サバイバルモード カメラ操作ヒント -->
  <div id="survival-hint">⚔ サバイバルモード ｜ 右スワイプ: カメラ回転</div>

  <!-- ワールドビルドモード クロスヘア -->
  <div id="wb-crosshair"></div>

  <!-- ワールドビルドモード パネル -->
  <div id="wb-panel">
    <div id="wb-panel-title">ワールドブロック</div>
    <div id="wb-swatches"></div>
    <button id="wb-delete-btn" onclick="toggleWBDelete()">🗑 削除モード</button>
    <button id="wb-drive-btn" onclick="exitWorldBuildMode()">🚗 走行へ戻る</button>
  </div>

  <!-- ワークショップ中のサバイバル移行ボタン（survival-exit-btn と同位置） -->
  <button id="survival-enter-btn" onclick="enterSurvivalMode()">⚔ サバイバルへ</button>

  <!-- その他メニュー -->
  <div id="more-menu" class="sub-menu">
    <button class="opt-btn" onclick="toggleMenu(''); enterSurvivalMode()">⚔ サバイバル</button>
    <button class="opt-btn" id="btn-surv-save-menu" style="display:none" onclick="toggleMenu(''); openSurvivalSaveModal()">💾 ゲームをセーブ</button>
    <button class="opt-btn" onclick="toggleMenu('save-picker')">💾 作品を管理</button>
    <button class="opt-btn danger" onclick="toggleMenu(''); clearAllBlocks()">💥 全消去</button>
  </div>

  <!-- ツールバー（スリム6ボタン構成） -->
  <div id="toolbar">
    <!-- グループ1: モードトグル -->
    <button class="btn" id="btn-mode" onclick="toggleMode()">
      <span id="mode-icon">➕</span>
      <div id="mode-label">配置</div>
    </button>

    <div class="toolbar-sep"></div>

    <!-- グループ2: ブロック設定 -->
    <button class="btn" id="btn-block-type" onclick="toggleMenu('block-picker')">
      <span>🧱</span>
      <div id="block-type-label">1×1</div>
    </button>
    <button class="btn" id="btn-color" onclick="toggleMenu('color-picker')">
      <span id="color-dot-btn" class="color-dot"></span>
      <div>カラー</div>
    </button>

    <div class="toolbar-sep"></div>

    <!-- グループ3: 操作 -->
    <button class="btn" onclick="undoLastAction()"><span>↩️</span>Undo</button>
    <button class="btn" id="btn-delete" onclick="setMode(mode==='delete'?'add':'delete')"><span>🗑️</span><div>削除</div></button>

    <div class="toolbar-sep"></div>

    <!-- グループ4: その他 -->
    <button class="btn" onclick="toggleMenu('more-menu')"><span>⋯</span>その他</button>
  </div>

  <script>
    // --- 🔊 音声・バイブ ---
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(type) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      if (type === 'place') {
        osc.frequency.setValueAtTime(600, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 0.05);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.05);
      } else if (type === 'delete') {
        osc.frequency.setValueAtTime(180, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(60, audioCtx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.08);
      }
    }

    function triggerVibrate() {
      if (navigator.vibrate) navigator.vibrate(12);
    }

    // --- データ構造 ---
    const occupiedGrid = new Map();

    function getBlockDimensions(type, rot = currentRotation) {
      if (type === 'wheel') return { w: 1, d: 1, h: 1 };
      if (isLargeWheelType(type)) {
        const spec = getLargeWheelSpec(type);
        const D = spec.diameter, T = spec.thickness;
        const rotSteps = (Math.round(rot / 90) % 4 + 4) % 4;
        const axleAlongX = (rotSteps === 0 || rotSteps === 2);
        return { w: axleAlongX ? T : D, d: axleAlongX ? D : T, h: D };
      }
      if (type === 'cyl' || type === 'cyl05') return { w: 1, d: 1, h: 1 };
      if (type === 'cylp' || type === 'cyl05p') return { w: 1, d: 1, h: 0.5 };
      if (type === 'connector') return { w: 1, d: 1, h: 1 };
      const cylSize = getLargeCylSize(type);
      if (cylSize !== null) return { w: cylSize, d: cylSize, h: type.endsWith('p') ? 0.5 : 1.0 };
      if (isCockpitType(type)) {
        const sz = type.replace('cockpit', '').split('x');
        let w = parseInt(sz[0]), d = parseInt(sz[1]);
        if ((rot / 90) % 2 !== 0) { const tmp = w; w = d; d = tmp; }
        return { w, d, h: 1 };
      }
      const isPlate = type.endsWith('p');
      const base = isPlate ? type.slice(0, -1) : type;
      const parts = base.split('x');
      let w = parseInt(parts[0]), d = parseInt(parts[1] || parts[0]);
      let h = isPlate ? 0.5 : 1;
      if ((rot / 90) % 2 !== 0) { const tmp = w; w = d; d = tmp; }
      return { w, d, h };
    }

      if (type === 'wheel5t2') return 'タイヤ径5厚';
      if (type === 'cyl')     return '円柱';
      if (type === 'cylp')    return '円柱薄';
      if (type === 'cyl05')   return '細柱';
      if (type === 'cyl05p')  return '細柱薄';

      const cylSize = getLargeCylSize(type);
      if (cylSize !== null) return `円柱${cylSize}${type.endsWith('p') ? '薄' : ''}`;
      if (isCockpitType(type)) {
        const sz = type.replace('cockpit', '').split('x');
        return `CP${sz[0]}×${sz[1]}`;
      }
      const isPlate = type.endsWith('p');
      const base = isPlate ? type.slice(0, -1) : type;
      const [w, d] = base.split('x');
      return `${w}×${d}${isPlate ? '薄' : ''}`;

    function getOccupiedCells(originX, originHY, originZ, type, rot, tilt) {
      if (type === 'wheel') return getWheelCells(originX, originHY, originZ, rot);
      // 横倒し円柱: 実効高さ = 直径（小型円柱のみ）
      if (tilt && isTiltableCylinder(type)) {
        const diameter = (type === 'cyl05' || type === 'cyl05p') ? 0.5 : 1.0;
        const hCells = Math.max(1, Math.round(diameter * 2));
        const cells = [];
        for (let hy = 0; hy < hCells; hy++) {
          cells.push(`${originX},${originHY + hy},${originZ}`);
        }
        return cells;
      }
      const dim = getBlockDimensions(type, rot);
      const cells = [];
      const hCells = Math.round(dim.h * 2); // 半グリッド単位: 標準=2, 薄板=1
      for (let x = 0; x < dim.w; x++) {
        for (let z = 0; z < dim.d; z++) {
          for (let hy = 0; hy < hCells; hy++) {
            cells.push(`${originX + x},${originHY + hy},${originZ + z}`);
          }
        }
      }
      return cells;
    }

    function getWheelCells(originX, originHY, originZ, rot) {
      const cells = [];
      const rotSteps = (Math.round(rot / 90) % 4 + 4) % 4;
      let axleX = 0, axleZ = 0;
      if      (rotSteps === 0) { axleX =  1; }
      else if (rotSteps === 1) { axleZ =  1; }
      else if (rotSteps === 2) { axleX = -1; }
      else                     { axleZ = -1; }

      // 本体: 半グリッド2セル(= 1フルユニット)
      cells.push(`${originX},${originHY},${originZ}`);
      cells.push(`${originX},${originHY+1},${originZ}`);

      // 車輪: アクスル先端を中心に Y方向±1フルユニット × 垂直方向3列
      // 各フルユニットY = 半グリッド2セル
      const wx = originX + axleX;
      const wz = originZ + axleZ;
      for (let dy = -1; dy <= 1; dy++) {          // フルユニットYオフセット
        const hy = originHY + dy * 2;              // 半グリッドY基点
        for (let dp = -1; dp <= 1; dp++) {         // 垂直方向オフセット
          const cx = axleX !== 0 ? wx : originX + dp;
          const cz = axleZ !== 0 ? wz : originZ + dp;
          cells.push(`${cx},${hy},${cz}`);
          cells.push(`${cx},${hy+1},${cz}`);
        }
      }
      return cells;
    }

    function canPlaceBlock(cells) {

    function createBlockMesh(type, color, rot, tilt) {
      let group;

      else if (isCylinderType(type)) group = createCylinderMesh(type, color, tilt);

        body.receiveShadow = true;

        for (let x = 0; x < dim.w; x++) {

    function createWheelMesh(color, rot) {
      const group = new THREE.Group();
      const mat = new THREE.MeshStandardMaterial({ color, roughness: 0.3 });
      const tireMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.95 });

      const rotSteps = (Math.round(rot / 90) % 4 + 4) % 4;
      let axleX = 0, axleZ = 0;
      if      (rotSteps === 0) { axleX =  1; }
      else if (rotSteps === 1) { axleZ =  1; }
      else if (rotSteps === 2) { axleX = -1; }
      else                     { axleZ = -1; }

      // 本体ブロック (1×1×1)
      const body = new THREE.Mesh(new THREE.BoxGeometry(0.99, 0.99, 0.99), mat);
      body.castShadow = true;
      body.receiveShadow = true;
      body.position.set(0, 0.5, 0);
      group.add(body);

      // 本体上スタッド
      const studGeo = new THREE.CylinderGeometry(0.2, 0.2, 0.12, 12);
      const stud = new THREE.Mesh(studGeo, mat);
      stud.castShadow = true;
      stud.position.set(0, 1.02, 0);
      group.add(stud);

      // アクスル (本体中心→車輪中心)
      const axleGeo = new THREE.CylinderGeometry(0.1, 0.1, 1.0, 8);
      const axleMesh = new THREE.Mesh(axleGeo, mat);
      axleMesh.castShadow = true;
      axleMesh.position.set(axleX * 0.5, 0.5, axleZ * 0.5);
      if (axleX !== 0) axleMesh.rotation.z = Math.PI / 2;
      else             axleMesh.rotation.x = Math.PI / 2;
      group.add(axleMesh);

      // タイヤ外周 (トーラス、黒)
      const tireGeo = new THREE.TorusGeometry(0.95, 0.38, 8, 20);
      const tire = new THREE.Mesh(tireGeo, tireMat);
      tire.castShadow = true;
      tire.position.set(axleX, 0.5, axleZ);
      // Three.js TorusGeometry はデフォルトで X-Y平面 (Z軸がホール方向)
      // アクスルがX方向の場合 → ホールをX軸方向にするため rotation.y = π/2
      if (axleX !== 0) tire.rotation.y = Math.PI / 2;
      group.add(tire);

      // ホイールハブ (内側円板、ブロックカラー)
      const rimGeo = new THREE.CylinderGeometry(0.5, 0.5, 0.42, 12);
      const rim = new THREE.Mesh(rimGeo, mat);
      rim.castShadow = true;
      rim.position.set(axleX, 0.5, axleZ);
      if (axleX !== 0) rim.rotation.z = Math.PI / 2;
      else             rim.rotation.x = Math.PI / 2;
      group.add(rim);

      return group;
    }

    function createLargeWheelMesh(type, color, rot) {
      const group = new THREE.Group();
      const spec = getLargeWheelSpec(type);
      const D = spec.diameter, T = spec.thickness;
      const dim = getBlockDimensions(type, rot);
      const w = dim.w, d = dim.d, h = dim.h;

      const mat = new THREE.MeshStandardMaterial({ color, roughness: 0.3, metalness: 0.1 });
      const tireMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.95 });

      const rotSteps = (Math.round(rot / 90) % 4 + 4) % 4;
      const axleAlongX = (rotSteps === 0 || rotSteps === 2);

      // Wheel center in group local space
      const cx = w / 2 - 0.5, cy = h / 2, cz = d / 2 - 0.5;

      // Torus parameters: outer_radius = R + tubeR ≈ h/2
      let R, tubeR;
      if (D === 3) {
        R = 0.76; tubeR = 0.65;       // fat tire, 3-diameter
      } else if (T === 1) {
        R = 2.0;  tubeR = 0.47;       // thin tire, 5-diameter
      } else {
        R = 1.6;  tubeR = 0.87;       // fat tire, 5-diameter
      }

      // Tire torus
      const tire = new THREE.Mesh(
        new THREE.TorusGeometry(R, tubeR, 12, Math.max(24, D * 8)),
        tireMat
      );
      tire.castShadow = true;
      tire.position.set(cx, cy, cz);
      if (axleAlongX) tire.rotation.y = Math.PI / 2;
      group.add(tire);

      // Hub cylinder (along axle axis)
      const hubR = h * 0.10;
      const hubH = T - 0.2;
      const hub = new THREE.Mesh(new THREE.CylinderGeometry(hubR, hubR, hubH, 12), mat);
      hub.castShadow = true;
      hub.position.set(cx, cy, cz);
      if (axleAlongX) hub.rotation.z = Math.PI / 2;
      else            hub.rotation.x = Math.PI / 2;
      group.add(hub);

      // Hub end caps
      const capGeo = new THREE.CylinderGeometry(hubR * 1.5, hubR * 1.5, 0.05, 12);
      [-1, 1].forEach(side => {
        const cap = new THREE.Mesh(capGeo, mat);
        if (axleAlongX) {
          cap.position.set(cx + side * hubH / 2, cy, cz);
          cap.rotation.z = Math.PI / 2;
        } else {
          cap.position.set(cx, cy, cz + side * hubH / 2);
          cap.rotation.x = Math.PI / 2;
        }
        group.add(cap);
      });

      // Spokes (for 5×5 wheels)
      if (D >= 5) {
        const numSpokes = 5;
        const spokeLen = R - hubR - 0.1;
        const spokeGeo = new THREE.CylinderGeometry(0.06, 0.06, spokeLen, 6);
        for (let i = 0; i < numSpokes; i++) {
          const angle = (i / numSpokes) * Math.PI * 2;
          const halfL = hubR + spokeLen / 2;
          const spoke = new THREE.Mesh(spokeGeo, mat);
          spoke.castShadow = true;
          if (axleAlongX) {
            spoke.position.set(cx, cy + Math.sin(angle) * halfL, cz + Math.cos(angle) * halfL);
            spoke.rotation.x = Math.PI / 2 - angle;
          } else {
            spoke.position.set(cx + Math.cos(angle) * halfL, cy + Math.sin(angle) * halfL, cz);
            spoke.rotation.z = angle - Math.PI / 2;
          }
          group.add(spoke);
        }
      }

      return group;
    }

    function createCylinderMesh(type, color, tilt) {
      const group = new THREE.Group();
      const mat = new THREE.MeshStandardMaterial({ color, roughness: 0.3 });

      const cylSize = getLargeCylSize(type);
      if (cylSize !== null) {
        // 大型円柱 (2×2 〜 5×5)
        const isThin = type.endsWith('p');
        const h = isThin ? 0.5 : 1.0;
        const radius = cylSize / 2 - 0.01;
        const cx = cylSize / 2 - 0.5; // 標準ブロックと同じオフセット規則
        const body = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius, h - 0.01, Math.max(24, cylSize * 8)), mat);
        body.castShadow = true;
        body.receiveShadow = true;
        body.position.set(cx, h / 2, cx);
        group.add(body);
        return group;
      }

      // 小型円柱 (1×1 / 0.5径)
      const isHalf = type === 'cyl05' || type === 'cyl05p';
      const isThin = type === 'cylp'  || type === 'cyl05p';
      const radius = isHalf ? 0.245 : 0.49;
      const h = isThin ? 0.5 : 1.0;

      const body = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius, h - 0.01, 16), mat);
      body.castShadow = true;
      body.receiveShadow = true;
      body.position.set(0, h / 2, 0);
      if (tilt === 'z') body.rotation.z = Math.PI / 2;
      if (tilt === 'x') body.rotation.x = Math.PI / 2;
      group.add(body);

      if (!tilt) {
        const studR = isHalf ? 0.1 : 0.18;
        const stud = new THREE.Mesh(new THREE.CylinderGeometry(studR, studR, 0.1, 12), mat);
        stud.castShadow = true;
        stud.position.set(0, h + 0.01, 0);
        group.add(stud);
      }

      return group;
    }

    function createConnectorMesh(color, rot) {
      const group = new THREE.Group();
      const mat = new THREE.MeshStandardMaterial({ color, roughness: 0.3 });
      const rotSteps = (Math.round(rot / 90) % 4 + 4) % 4;
      let axleX = 0, axleZ = 0;
      if      (rotSteps === 0) { axleX =  1; }
      else if (rotSteps === 1) { axleZ =  1; }
      else if (rotSteps === 2) { axleX = -1; }
      else                     { axleZ = -1; }

      group.userData.blockType = 'connector';
      group.userData.axleX = axleX;
      group.userData.axleZ = axleZ;

      const body = new THREE.Mesh(new THREE.BoxGeometry(0.99, 0.99, 0.99), mat);
      body.castShadow = true;
      body.receiveShadow = true;
      body.position.set(0, 0.5, 0);
      group.add(body);

      const stud = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 0.12, 12), mat);
      stud.castShadow = true;
      stud.position.set(0, 1.02, 0);
      group.add(stud);

      // face disc (visual connection marker) — tagged as connector face
      const disc = new THREE.Mesh(new THREE.CylinderGeometry(0.38, 0.38, 0.06, 16), mat);
      disc.position.set(axleX * 0.53, 0.5, axleZ * 0.53);
      if (axleX !== 0) disc.rotation.z = Math.PI / 2;
      else             disc.rotation.x = Math.PI / 2;
      disc.userData.isConnectorFace = true;
      group.add(disc);

      // central peg — tagged as connector face
      const peg = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.18, 0.35, 12), mat);
      peg.castShadow = true;
      peg.position.set(axleX * (0.5 + 0.175), 0.5, axleZ * (0.5 + 0.175));
      if (axleX !== 0) peg.rotation.z = Math.PI / 2;
      else             peg.rotation.x = Math.PI / 2;
      peg.userData.isConnectorFace = true;
      group.add(peg);

      return group;
    }

    function createCockpitMesh(type, color, rot) {
      const group = new THREE.Group();
      const dim = getBlockDimensions(type, rot);
      const w = dim.w, d = dim.d;
      const cx = w / 2 - 0.5, cz = d / 2 - 0.5;

      const bodyMat = new THREE.MeshStandardMaterial({ color, roughness: 0.3 });
      const glassMat = new THREE.MeshStandardMaterial({
        color: 0x99ddff, roughness: 0.05, metalness: 0.1, transparent: true, opacity: 0.38
      });
      const darkMat = new THREE.MeshStandardMaterial({ color: 0x1a1a2e, roughness: 0.75 });

      // Solid lower body
      const bodyH = 0.50;
      const body = new THREE.Mesh(new THREE.BoxGeometry(w - 0.02, bodyH, d - 0.02), bodyMat);
      body.castShadow = true; body.receiveShadow = true;
      body.position.set(cx, bodyH / 2, cz);
      group.add(body);

      // Dark frame rim at canopy base
      const rimH = 0.06;
      const rim = new THREE.Mesh(new THREE.BoxGeometry(w - 0.02, rimH, d - 0.02), darkMat);
      rim.position.set(cx, bodyH + rimH / 2, cz);
      group.add(rim);

      // Transparent half-sphere dome
      const domeBaseY = bodyH + rimH;
      const domeH = 0.44;
      const dome = new THREE.Mesh(
        new THREE.SphereGeometry(1, 24, 12, 0, Math.PI * 2, 0, Math.PI / 2),
        glassMat
      );
      dome.scale.set((w - 0.1) / 2, domeH, (d - 0.1) / 2);
      dome.castShadow = true;
      dome.position.set(cx, domeBaseY, cz);
      group.add(dome);

      // Corner pillars (canopy frame struts)
      const pillarH = 0.28, pillarR = 0.035;
      const pxOff = (w - 0.18) / 2, pzOff = (d - 0.18) / 2;
      [[-1,-1],[-1,1],[1,-1],[1,1]].forEach(([sx,sz]) => {
        const pillar = new THREE.Mesh(new THREE.CylinderGeometry(pillarR, pillarR, pillarH, 8), darkMat);
        pillar.position.set(cx + sx * pxOff, domeBaseY + pillarH / 2, cz + sz * pzOff);
        group.add(pillar);
      });

      // Spine ridge(s) along top of dome
      const ridgeR = 0.03, ridgeTop = domeBaseY + domeH - 0.06;
      if (d > w) {
        const spine = new THREE.Mesh(new THREE.CylinderGeometry(ridgeR, ridgeR, d - 0.2, 8), darkMat);
        spine.rotation.x = Math.PI / 2;
        spine.position.set(cx, ridgeTop, cz);
        group.add(spine);
      } else if (w > d) {
        const spine = new THREE.Mesh(new THREE.CylinderGeometry(ridgeR, ridgeR, w - 0.2, 8), darkMat);
        spine.rotation.z = Math.PI / 2;
        spine.position.set(cx, ridgeTop, cz);
        group.add(spine);
      } else if (w >= 2) {
        [0, 1].forEach(axis => {
          const len = axis === 0 ? w : d;
          const sp = new THREE.Mesh(new THREE.CylinderGeometry(ridgeR, ridgeR, len - 0.2, 8), darkMat);
          if (axis === 0) sp.rotation.z = Math.PI / 2; else sp.rotation.x = Math.PI / 2;
          sp.position.set(cx, ridgeTop, cz);
          group.add(sp);
        });
      }

      // Interior seat/dashboard (dark platform, visible through glass)
      const seatW = Math.min(w - 0.4, w * 0.7);
      const seatD = Math.min(d - 0.4, d * 0.5);
      const seat = new THREE.Mesh(new THREE.BoxGeometry(seatW, 0.06, seatD), darkMat);
      seat.position.set(cx, bodyH + 0.04, cz);
      group.add(seat);

      return group;
    }

    function createCockpitPreviewMesh(type, rot) {
      const mkMat = () => new THREE.MeshBasicMaterial({ color: 0x00ff00, transparent: true, opacity: 0.38 });
      const dim = getBlockDimensions(type, rot);
      const w = dim.w, d = dim.d, h = dim.h;
      const bodyH = 0.50, rimH = 0.06;
      const yBase = -h / 2;

      const group = new THREE.Group();

      const body = new THREE.Mesh(new THREE.BoxGeometry(w - 0.04, bodyH, d - 0.04), mkMat());
      body.position.set(0, yBase + bodyH / 2, 0);
      group.add(body);

      const dome = new THREE.Mesh(
        new THREE.SphereGeometry(1, 16, 8, 0, Math.PI * 2, 0, Math.PI / 2),
        mkMat()
      );
      dome.scale.set((w - 0.1) / 2, 0.44, (d - 0.1) / 2);
      dome.position.set(0, yBase + bodyH + rimH, 0);
      group.add(dome);

      group.material = {
        color: { setHex: (hex) => group.traverse(c => { if (c.isMesh) c.material.color.setHex(hex); }) }
      };
      return group;
    }

    function createPreviewMesh() {
      if (currentBlockType === 'wheel') return createWheelPreviewMesh(currentRotation);
      if (isCylinderType(currentBlockType)) {
        return createCylinderPreviewMesh(currentBlockType, activeTilt);
      }
      if (currentBlockType === 'connector') return createConnectorPreviewMesh(currentRotation);
      if (isCockpitType(currentBlockType)) return createCockpitPreviewMesh(currentBlockType, currentRotation);
      const dim = getBlockDimensions(currentBlockType, currentRotation);
      const geo = new THREE.BoxGeometry(dim.w - 0.02, dim.h - 0.02, dim.d - 0.02);
      const mat = new THREE.MeshBasicMaterial({ color: 0x00ff00, transparent: true, opacity: 0.5 });
      return new THREE.Mesh(geo, mat);
    }

    function createCylinderPreviewMesh(type, tilt) {
      const mat = new THREE.MeshBasicMaterial({ color: 0x00ff00, transparent: true, opacity: 0.5 });

      const cylSize = getLargeCylSize(type);
      if (cylSize !== null) {
        // 大型円柱プレビュー — previewMesh.positionがブロック中心に置かれるのでそのまま使える
        const isThin = type.endsWith('p');
        const h = isThin ? 0.5 : 1.0;
        const radius = cylSize / 2 - 0.01;
        return new THREE.Mesh(new THREE.CylinderGeometry(radius, radius, h - 0.02, Math.max(24, cylSize * 8)), mat);
      }

      const isHalf = type === 'cyl05' || type === 'cyl05p';
      const isThin = type === 'cylp'  || type === 'cyl05p';
      const radius = isHalf ? 0.245 : 0.49;
      const h = isThin ? 0.5 : 1.0;
      const mesh = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius, h - 0.02, 16), mat);
      if (tilt === 'z') mesh.rotation.z = Math.PI / 2;
      if (tilt === 'x') mesh.rotation.x = Math.PI / 2;
      return mesh;
    }

    function createConnectorPreviewMesh(rot) {
      const rotSteps = (Math.round(rot / 90) % 4 + 4) % 4;
      let axleX = 0, axleZ = 0;
      if      (rotSteps === 0) { axleX =  1; }
      else if (rotSteps === 1) { axleZ =  1; }
      else if (rotSteps === 2) { axleX = -1; }
      else                     { axleZ = -1; }

      const mkMat = () => new THREE.MeshBasicMaterial({ color: 0x00ff00, transparent: true, opacity: 0.45 });
      const group = new THREE.Group();

      const base = new THREE.Mesh(new THREE.BoxGeometry(0.97, 0.97, 0.97), mkMat());
      group.add(base);

      const disc = new THREE.Mesh(new THREE.CylinderGeometry(0.38, 0.38, 0.06, 16), mkMat());
      disc.position.set(axleX * 0.53, 0, axleZ * 0.53);
      if (axleX !== 0) disc.rotation.z = Math.PI / 2;
      else             disc.rotation.x = Math.PI / 2;
      group.add(disc);

      const peg = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.18, 0.35, 12), mkMat());
      peg.position.set(axleX * 0.675, 0, axleZ * 0.675);
      if (axleX !== 0) peg.rotation.z = Math.PI / 2;
      else             peg.rotation.x = Math.PI / 2;
      group.add(peg);

      group.material = {
        color: {
          setHex: (hex) => group.traverse(c => { if (c.isMesh) c.material.color.setHex(hex); })
