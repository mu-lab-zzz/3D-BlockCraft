    // ===== サバイバルモード =====
    function enterSurvivalMode() {
      if (gameMode === 'survival') return;
      if (blocksHistory.length === 0) {
        alert('ビークルを組み立ててからサバイバルへ進んでください');
        return;
      }

      gameMode = 'survival';

      // 全ブロックの重心を計算
      vehicleCentroid.set(0, 0, 0);
      blocksHistory.forEach(h => vehicleCentroid.add(h.group.position));
      vehicleCentroid.divideScalar(blocksHistory.length);

      // 元の位置/回転を保存
      vehicleBlocksData = blocksHistory.map(h => ({
        group:    h.group,
        origPos:  h.group.position.clone(),
        origRotY: h.group.rotation.y,
      }));

      vehicleState.pos.set(vehicleCentroid.x, 0, vehicleCentroid.z);
      vehicleState.yaw   = 0;
      vehicleState.speed = 0;
      survivalCamTheta   = Math.PI;
      lastSurvivalTime   = performance.now();
      survivalKeys.w = survivalKeys.s = survivalKeys.a = survivalKeys.d = false;

      // 建築 UI を非表示
      document.getElementById('toolbar').style.display         = 'none';
      document.getElementById('action-btn').style.display      = 'none';
      document.getElementById('camera-view-btn').style.display = 'none';
      document.getElementById('mode-switch-btn').style.display = 'none';
      document.getElementById('fps-edit-btns').style.display   = 'none';
      previewMesh.visible = false;
      gridHelper.visible  = false;
      plane.visible       = false;

      // ワールド切替
      survivalField.visible = true;
      scene.background      = new THREE.Color(0x0a1628);
      dirLight.intensity    = 1.0;

      if (!terrainBuilt) { buildTerrainObjects(); terrainBuilt = true; }
      terrainObjects.forEach(o => { o.visible = true; });

      // サバイバル UI を表示
      document.getElementById('survival-hud').style.display  = 'flex';
      document.getElementById('survival-hint').style.display = 'block';
      document.getElementById('joystick-label').textContent  = '操舵';
      document.getElementById('block-count').textContent     = '⚔ サバイバル';
      fpsLookTouchId = null;

      setTimeout(() => {
        if (gameMode === 'survival')
          document.getElementById('survival-hint').style.display = 'none';
      }, 3500);

      updateVehicleTransform();
      updateSurvivalCamera();
    }

    function exitSurvivalMode() {
      if (gameMode !== 'survival') return;

      // ブロックを元の位置・回転に戻す
      vehicleBlocksData.forEach(({ group, origPos, origRotY }) => {
        group.position.copy(origPos);
        group.rotation.y = origRotY;
      });
      vehicleBlocksData = [];
      gameMode = 'build';

      // ワールド復元
      survivalField.visible = false;
      terrainObjects.forEach(o => { o.visible = false; });
      gridHelper.visible    = true;
      plane.visible         = true;
      scene.background      = new THREE.Color(0x1a1a24);
      dirLight.intensity    = 0.8;

      // 建築 UI を復元
      document.getElementById('toolbar').style.display         = 'flex';
      document.getElementById('action-btn').style.display      = 'flex';
      document.getElementById('camera-view-btn').style.display = '';
      document.getElementById('mode-switch-btn').style.display = '';
      document.getElementById('fps-edit-btns').style.display   = 'flex';
      document.getElementById('survival-hud').style.display    = 'none';
      document.getElementById('survival-hint').style.display   = 'none';
      document.getElementById('joystick-label').textContent    = '移動';
      updateBlockCount();
      fpsLookTouchId = null;

      // カメラをビークル中心に戻す
      cameraTarget.set(vehicleCentroid.x, 0, vehicleCentroid.z);
      updateCameraPosition();
      updatePreviewMesh();
    }

    // ブロックに車両変換を適用（毎フレーム）
    function updateVehicleTransform() {
      const cosY    = Math.cos(vehicleState.yaw);
      const sinY    = Math.sin(vehicleState.yaw);
      const vx      = vehicleState.pos.x;
      const vz      = vehicleState.pos.z;
      const groundY = getTerrainHeight(vx, vz);
      vehicleBlocksData.forEach(({ group, origPos, origRotY }) => {
        const lx = origPos.x - vehicleCentroid.x;
        const lz = origPos.z - vehicleCentroid.z;
        group.position.x = vx + lx * cosY + lz * sinY;
        group.position.y = origPos.y + groundY + WHEEL_GROUND_OFFSET;
        group.position.z = vz - lx * sinY + lz * cosY;
        group.rotation.y = origRotY + vehicleState.yaw;
      });
    }

    // 追従カメラ（車両の yaw + survivalCamTheta の方向から見下ろす）
    function updateSurvivalCamera() {
      const vp       = vehicleState.pos;
      const ang      = vehicleState.yaw + survivalCamTheta;
      const groundY  = getTerrainHeight(vp.x, vp.z);
      const baseY    = groundY + WHEEL_GROUND_OFFSET;
      const camX     = vp.x + Math.sin(ang) * SURVIVAL_CAM_DIST;
      const camZ     = vp.z + Math.cos(ang) * SURVIVAL_CAM_DIST;
      const camFloor = getTerrainHeight(camX, camZ) + 2.5;
      camera.position.set(
        camX,
        Math.max(baseY + SURVIVAL_CAM_H, camFloor),
        camZ
      );
      camera.lookAt(vp.x, baseY + 1.8, vp.z);
    }

    // 地形高さ関数（sin波の重ね合わせ、中心20単位は平坦）
    function getTerrainHeight(x, z) {
      const dist  = Math.sqrt(x * x + z * z);
      const blend = Math.max(0, Math.min(1, (dist - 20) / 15));
      const h =
        Math.sin(x * 0.08)        * Math.cos(z * 0.07)        * 4.5 +
        Math.sin(x * 0.04 + 1.3)  * Math.sin(z * 0.05 + 0.8)  * 3.0 +
        Math.cos(x * 0.13 + 2.5)  * Math.cos(z * 0.11 + 1.7)  * 1.8 +
        Math.sin(x * 0.22 + 0.4)  * Math.cos(z * 0.19 + 2.1)  * 0.9;
      return h * blend;
    }

    // 岩・木などの地形オブジェクトを生成（初回サバイバル突入時に一度だけ実行）
    function buildTerrainObjects() {
      const matRock1  = new THREE.MeshStandardMaterial({ color: 0x7a6f60, roughness: 0.92, metalness: 0.05 });
      const matRock2  = new THREE.MeshStandardMaterial({ color: 0x4e4840, roughness: 0.97 });
      const matTrunk  = new THREE.MeshStandardMaterial({ color: 0x5a3a18, roughness: 1.0 });
      const matLeaves = new THREE.MeshStandardMaterial({ color: 0x1c4010, roughness: 0.95 });

      // 岩
      for (let i = 0; i < 130; i++) {
        const angle = Math.random() * Math.PI * 2;
        const dist  = 25 + Math.random() * 210;
        const x = Math.cos(angle) * dist, z = Math.sin(angle) * dist;
        const y = getTerrainHeight(x, z);
        const s = 0.4 + Math.random() * 2.8;
        const rock = new THREE.Mesh(
          new THREE.DodecahedronGeometry(s, 0),
          Math.random() > 0.4 ? matRock1 : matRock2
        );
        rock.position.set(x, y + s * 0.55, z);
        rock.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, Math.random() * Math.PI);
        rock.scale.set(1 + Math.random() * 0.6, 0.5 + Math.random() * 0.7, 1 + Math.random() * 0.6);
        rock.castShadow = true;
        rock.receiveShadow = true;
        rock.visible = false;
        scene.add(rock);
        terrainObjects.push(rock);
      }

      // 木
      for (let i = 0; i < 90; i++) {
        const angle = Math.random() * Math.PI * 2;
        const dist  = 30 + Math.random() * 190;
        const x = Math.cos(angle) * dist, z = Math.sin(angle) * dist;
        const y = getTerrainHeight(x, z);
        const trunkH = 1.6 + Math.random() * 2.2;
        const g = new THREE.Group();
        const trunk = new THREE.Mesh(
          new THREE.CylinderGeometry(0.14, 0.26, trunkH, 5),
          matTrunk
        );
        trunk.position.y = trunkH * 0.5;
        trunk.castShadow = true;
        g.add(trunk);
        const crH = 2.0 + Math.random() * 2.5;
        const crown = new THREE.Mesh(
          new THREE.ConeGeometry(0.9 + Math.random() * 0.7, crH, 6),
          matLeaves
        );
        crown.position.y = trunkH + crH * 0.38;
        crown.castShadow = true;
        g.add(crown);
        if (Math.random() > 0.45) {
          const crown2 = new THREE.Mesh(
            new THREE.ConeGeometry(0.6 + Math.random() * 0.4, crH * 0.65, 6),
            matLeaves
          );
          crown2.position.y = trunkH + crH * 0.80;
          g.add(crown2);
        }
        g.position.set(x, y, z);
        g.visible = false;
        scene.add(g);
        terrainObjects.push(g);
      }
    }

    // サバイバル物理ループ
    function updateSurvival(now) {
      const dt = Math.min((now - lastSurvivalTime) * 0.001, 0.05);
      lastSurvivalTime = now;
      if (dt <= 0) return;

      // 入力：ジョイスティック＋キーボード
      const gasInput   = -joyVec.y + (survivalKeys.w ? 1 : 0) - (survivalKeys.s ? 1 : 0);
      const steerInput =  joyVec.x + (survivalKeys.d ? 1 : 0) - (survivalKeys.a ? 1 : 0);

      // 速度
      if (Math.abs(gasInput) > 0.05) {
        vehicleState.speed += gasInput * VEHICLE_ACCEL * dt;
      } else {
        const dec = VEHICLE_DECEL * dt;
        if (Math.abs(vehicleState.speed) < dec) vehicleState.speed = 0;
        else vehicleState.speed -= Math.sign(vehicleState.speed) * dec;
      }
      const rev = VEHICLE_MAX_SPEED * 0.45;
      vehicleState.speed = Math.max(-rev, Math.min(VEHICLE_MAX_SPEED, vehicleState.speed));

      // 旋回（速度があるときだけ）
      if (Math.abs(vehicleState.speed) > 0.2) {
        vehicleState.yaw -= steerInput * VEHICLE_TURN_SPEED * dt * Math.sign(vehicleState.speed);
      }

      // 位置更新
      vehicleState.pos.x += Math.sin(vehicleState.yaw) * vehicleState.speed * dt;
      vehicleState.pos.z += Math.cos(vehicleState.yaw) * vehicleState.speed * dt;

      // フィールド境界
      const B = 295;
      vehicleState.pos.x = Math.max(-B, Math.min(B, vehicleState.pos.x));
      vehicleState.pos.z = Math.max(-B, Math.min(B, vehicleState.pos.z));

      // HUD 更新
      const kmh = Math.round(Math.abs(vehicleState.speed) * 3.6);
      document.getElementById('survival-speed').textContent = kmh;
      const gearEl = document.getElementById('survival-gear');
      gearEl.textContent  = vehicleState.speed >= 0 ? 'D' : 'R';
      gearEl.style.color  = vehicleState.speed >= 0 ? '#22c55e' : '#ef4444';

      updateVehicleTransform();
      updateSurvivalCamera();
    }

    // ===== FPS: ジャンプ / 飛行 =====
    let isFlyingUp = false, isFlyingDown = false;

    function toggleFlyMode() {
      player.isFlying = !player.isFlying;
      if (player.isFlying) { player.vel.y = 0; isFlyingUp = false; isFlyingDown = false; }
      document.getElementById('fly-indicator').style.display = player.isFlying ? 'block' : 'none';
      document.getElementById('fly-down-btn').style.display = player.isFlying ? 'flex' : 'none';
      document.getElementById('btn-fly').classList.toggle('active', player.isFlying);
      triggerVibrate();
    }

    // ===== FPS: 物理 =====
    function updateFPS(now) {
      const dt = Math.min((now - lastFPSTime) * 0.001, 0.05);
      lastFPSTime = now;
      if (dt <= 0) return;

      // 移動（左ジョイスティック → yaw基準）
      const speed = player.isFlying ? FLY_SPEED : WALK_SPEED;
      const fwd  = -joyVec.y;
      const right = -joyVec.x;
      const cos = Math.cos(player.yaw), sin = Math.sin(player.yaw);
      const dx = (right * cos + fwd * sin) * speed * dt;
      const dz = (-right * sin + fwd * cos) * speed * dt;

      player.pos.x += dx; resolveCollision('x');
      player.pos.z += dz; resolveCollision('z');

      // 重力 / 飛行
      if (player.isFlying) {
        if (isFlyingUp)        player.vel.y =  FLY_SPEED;
        else if (isFlyingDown) player.vel.y = -FLY_SPEED;
        else                   player.vel.y *= 0.75; // ボタン離したらホバーへ減衰
      } else {
        player.vel.y += GRAVITY * dt;
        player.vel.y = Math.max(player.vel.y, -30);
      }
      player.onGround = false;
      player.pos.y += player.vel.y * dt;
      resolveCollision('y');

      // 床
      if (player.pos.y < 0) {
        player.pos.y = 0; player.onGround = true; player.vel.y = 0;
      }
      // グリッド外制限
      const half = GRID_SIZE / 2 - PLAYER_R;
      player.pos.x = Math.max(-half, Math.min(half, player.pos.x));
      player.pos.z = Math.max(-half, Math.min(half, player.pos.z));

      // カメラ
      const eye = player.pos.clone().add(new THREE.Vector3(0, PLAYER_EYE, 0));
      camera.position.copy(eye);
      const lookDir = new THREE.Vector3(
        Math.sin(player.yaw)  * Math.cos(player.pitch),
        -Math.sin(player.pitch),
        Math.cos(player.yaw)  * Math.cos(player.pitch)
      );
      camera.lookAt(eye.clone().add(lookDir));

      updateFPSRaycast(lookDir);
    }

    function resolveCollision(axis) {
      const r = PLAYER_R, h = PLAYER_H;
      const x0 = Math.floor(player.pos.x - r) - 1, x1 = Math.floor(player.pos.x + r) + 1;
      const hy0 = Math.floor(player.pos.y * 2) - 1, hy1 = Math.floor((player.pos.y + h) * 2) + 1;
      const z0 = Math.floor(player.pos.z - r) - 1, z1 = Math.floor(player.pos.z + r) + 1;

      for (let bx = x0; bx <= x1; bx++) {
        for (let bhy = hy0; bhy <= hy1; bhy++) {
          for (let bz = z0; bz <= z1; bz++) {
            if (!occupiedGrid.has(`${bx},${bhy},${bz}`)) continue;
            // プレイヤーAABB
            const pxMin = player.pos.x - r, pxMax = player.pos.x + r;
            const pyMin = player.pos.y,     pyMax = player.pos.y + h;
            const pzMin = player.pos.z - r, pzMax = player.pos.z + r;
            // 重なり確認（全軸）— Y軸は半グリッド(0.5単位)
            if (pxMax <= bx || pxMin >= bx+1) continue;
            if (pyMax <= bhy*0.5 || pyMin >= (bhy+1)*0.5) continue;
            if (pzMax <= bz || pzMin >= bz+1) continue;
            // 軸別解決
            if (axis === 'x') {
              const pL = pxMax - bx, pR = (bx+1) - pxMin;
              if (pL < pR) player.pos.x -= pL; else player.pos.x += pR;
            } else if (axis === 'z') {
              const pF = pzMax - bz, pB = (bz+1) - pzMin;
              if (pF < pB) player.pos.z -= pF; else player.pos.z += pB;
            } else {
              const pUp = (bhy+1)*0.5 - pyMin, pDn = pyMax - bhy*0.5;
              if (pUp < pDn) {
                player.pos.y += pUp; player.onGround = true;
                if (player.vel.y < 0) player.vel.y = 0;
              } else {
                player.pos.y -= pDn;
                if (player.vel.y > 0) player.vel.y = 0;
              }
            }
          }
        }
      }
    }

    function updateFPSRaycast(lookDir) {
      const ray = new THREE.Raycaster(camera.position, lookDir.clone().normalize(), 0.1, 18);
      const hits = ray.intersectObjects([plane, ...blockMeshes], true);

      if (hits.length > 0) {
        const hit = hits[0];
        const dim = getBlockDimensions(currentBlockType, currentRotation);
        if (hit.object === plane) {
          const ox = Math.floor(hit.point.x - dim.w/2 + 0.5);
          const oz = Math.floor(hit.point.z - dim.d/2 + 0.5);
          targetOccupiedCells = getOccupiedCells(ox, 0, oz, currentBlockType, currentRotation);
          isCanPlace = canPlaceBlock(targetOccupiedCells);
          if (isCanPlace) {
            previewMesh.position.set(ox+dim.w/2-0.5, dim.h/2, oz+dim.d/2-0.5);
            previewMesh.material.color.setHex(0x00ff88);
            previewMesh.visible = true;
          } else {
            previewMesh.visible = false;
          }
          hoveredGroup = null;
        } else {
          // 接続面ヒット検出
          const connFace = detectConnectorFace(hits);
          const newTilt = (connFace && isTiltableCylinder(currentBlockType))
            ? (connFace.axleX !== 0 ? 'z' : 'x')
            : null;
          if (newTilt !== activeTilt) {
            activeTilt = newTilt;
            updatePreviewMesh();
          }

          if (connFace) {
            const cx = Math.round(connFace.group.position.x);
            const chy = Math.round(connFace.group.position.y * 2);
            const cz = Math.round(connFace.group.position.z);
            const ox = cx + connFace.axleX;
            const oy = chy;
            const oz = cz + connFace.axleZ;
            targetOccupiedCells = getOccupiedCells(ox, oy, oz, currentBlockType, currentRotation, activeTilt);
            isCanPlace = canPlaceBlock(targetOccupiedCells);
            if (isCanPlace) {
              previewMesh.position.set(ox+dim.w/2-0.5, oy*0.5+dim.h/2, oz+dim.d/2-0.5);
              previewMesh.material.color.setHex(0x00ff88);
              previewMesh.visible = true;
            } else {
              previewMesh.visible = false;
            }
            hoveredGroup = null;
          } else {
            hoveredGroup = hit.object.userData.rootGroup;
            if (hoveredGroup) {
              const norm = hit.face.normal.clone().transformDirection(hit.object.matrixWorld);
              const nx = Math.round(norm.x);
              const ny = Math.round(norm.y);
              const nz = Math.round(norm.z);
              const p = hit.point.clone().add(norm.clone().multiplyScalar(0.5));
              let ox = Math.floor(p.x) - snapOffsetX;
              let oy = Math.max(0, Math.round(hit.point.y * 2));
              let oz = Math.floor(p.z) - snapOffsetZ;

              targetOccupiedCells = getOccupiedCells(ox, oy, oz, currentBlockType, currentRotation, activeTilt);
              isCanPlace = canPlaceBlock(targetOccupiedCells);

              if (!isCanPlace) {
                const ox2 = ox + nx, oy2 = Math.max(0, oy + ny), oz2 = oz + nz;
                const cells2 = getOccupiedCells(ox2, oy2, oz2, currentBlockType, currentRotation, activeTilt);
                if (canPlaceBlock(cells2)) {
                  ox = ox2; oy = oy2; oz = oz2;
                  targetOccupiedCells = cells2;
                  isCanPlace = true;
                }
              }

              if (isCanPlace) {
                previewMesh.position.set(ox+dim.w/2-0.5, oy*0.5+dim.h/2, oz+dim.d/2-0.5);
                previewMesh.material.color.setHex(0x00ff88);
                previewMesh.visible = true;
              } else {
                previewMesh.visible = false;
              }
            }
          }
        }
      } else {
        if (activeTilt !== null) { activeTilt = null; updatePreviewMesh(); }
        previewMesh.visible = false;
        hoveredGroup = null;
        isCanPlace = false;
      }
    }

    // ===== FPS: 配置・削除アクション =====
    function executeFPSPlace() {
      if (!isCanPlace || !previewMesh.visible) return;
      const dim = getBlockDimensions(currentBlockType, currentRotation);
      const group = createBlockMesh(currentBlockType, currentColor, currentRotation, activeTilt);
      const ox = previewMesh.position.x - dim.w/2 + 0.5;
      const oy = previewMesh.position.y - dim.h/2;
      const oz = previewMesh.position.z - dim.d/2 + 0.5;
      group.position.set(ox, oy, oz);
      scene.add(group);
      targetOccupiedCells.forEach(k => occupiedGrid.set(k, group));
      group.traverse(c => { if (c.isMesh) { c.userData.rootGroup = group; blockMeshes.push(c); } });
      blocksHistory.push({ group, cells: [...targetOccupiedCells], type: currentBlockType, color: currentColor, rot: currentRotation, tilt: activeTilt });
      playSound('place'); triggerVibrate(); updateBlockCount(); autoSave();
    }

    function executeFPSDelete() {
      if (!hoveredGroup) return;
      scene.remove(hoveredGroup);
      for (const [k, v] of occupiedGrid.entries()) { if (v === hoveredGroup) occupiedGrid.delete(k); }
      hoveredGroup.traverse(c => { const i = blockMeshes.indexOf(c); if (i > -1) blockMeshes.splice(i,1); });
      const hi = blocksHistory.findIndex(h => h.group === hoveredGroup);
      if (hi > -1) blocksHistory.splice(hi, 1);
      hoveredGroup = null; previewMesh.visible = false;
      playSound('delete'); triggerVibrate(); updateBlockCount(); autoSave();
    }

    // ===== ジャンプ・上昇・下降ボタン =====
    const jumpBtn     = document.getElementById('jump-btn');
    const flyDownBtn  = document.getElementById('fly-down-btn');

    // ⬆ ボタン: 非飛行=ジャンプ1回 / 飛行=長押しで連続上昇
    jumpBtn.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      if (player.isFlying) {
        isFlyingUp = true;
      } else if (player.onGround) {
        player.vel.y = JUMP_FORCE;
        player.onGround = false;
        triggerVibrate();
      }
    });
    const stopFlyUp = () => { isFlyingUp = false; };
    jumpBtn.addEventListener('pointerup',     stopFlyUp);
    jumpBtn.addEventListener('pointercancel', stopFlyUp);
    jumpBtn.addEventListener('pointerleave',  stopFlyUp);

    // ⬇ ボタン: 長押しで連続下降
    flyDownBtn.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      isFlyingDown = true;
    });
    const stopFlyDown = () => { isFlyingDown = false; };
    flyDownBtn.addEventListener('pointerup',     stopFlyDown);
    flyDownBtn.addEventListener('pointercancel', stopFlyDown);
    flyDownBtn.addEventListener('pointerleave',  stopFlyDown);

    // FPSアクションボタン（タップ=配置・長押し=削除）
    const fpsActionBtn = document.getElementById('fps-action-btn');
    fpsActionBtn.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      fpsActionStartTime = Date.now();
      const circle = document.querySelector('#delete-ring circle');
      document.getElementById('delete-ring').style.display = 'block';
      fpsActionBtn.classList.add('deleting');
      let elapsed = 0;
      fpsTick = setInterval(() => {
        elapsed += 33;
        circle.style.strokeDashoffset = RING_CIRC * (1 - Math.min(elapsed / LONG_PRESS_MS, 1));
      }, 33);
      fpsLongPressTimer = setTimeout(() => {
        clearInterval(fpsTick); fpsTick = null;
        document.getElementById('delete-ring').style.display = 'none';
        document.querySelector('#delete-ring circle').style.strokeDashoffset = RING_CIRC;
        fpsActionBtn.classList.remove('deleting');
        executeFPSDelete();
        fpsLongPressTimer = null;
      }, LONG_PRESS_MS);
    });

    function cancelFPSAction(didLong) {
      clearTimeout(fpsLongPressTimer); fpsLongPressTimer = null;
      clearInterval(fpsTick); fpsTick = null;
      document.getElementById('delete-ring').style.display = 'none';
      document.querySelector('#delete-ring circle').style.strokeDashoffset = RING_CIRC;
      fpsActionBtn.classList.remove('deleting');
      if (!didLong && fpsActionStartTime && (Date.now() - fpsActionStartTime) < LONG_PRESS_MS) {
        executeFPSPlace();
      }
      fpsActionStartTime = 0;
    }
    fpsActionBtn.addEventListener('pointerup',     () => cancelFPSAction(false));
    fpsActionBtn.addEventListener('pointercancel', () => cancelFPSAction(true));

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // 起動時にオートセーブデータを読み込み
    autoLoad();

    // ループ処理
    // ===== オープニング =====
    function startCreativeMode() {
      const el = document.getElementById('opening-screen');
      el.classList.add('fadeout');
      setTimeout(() => { el.style.display = 'none'; }, 450);
      // build モードは既定状態なのでそのまま
    }

    function startSurvivalMode() {
      const el = document.getElementById('opening-screen');
      el.classList.add('fadeout');
      setTimeout(() => {
        el.style.display = 'none';
        spawnStarterVehicle();
        enterSurvivalMode();
      }, 450);
    }

    // スターター自機を生成する（ブロックを直接配置）
    function spawnStarterVehicle() {
      clearAllBlocksSilent();

      // vehicle layout (top-view, Z+ = forward)
      // body: 2×4 chassis centered at origin
      // cockpit2x2: on front half of body (high-Z side)
      // 4 wheels at corners
      const defs = [
        { type: '2x4',        color: 0x4a5568, rot: 0, tilt: null, x: -1, hy: 0, z: -2 },
        { type: 'cockpit2x2', color: 0x1e3a5f, rot: 0, tilt: null, x: -1, hy: 2, z:  0 },
        { type: 'wheel',      color: 0x111111, rot: 180, tilt: null, x: -2, hy: 0, z:  1 }, // FL (axle → -X)
        { type: 'wheel',      color: 0x111111, rot:   0, tilt: null, x:  1, hy: 0, z:  1 }, // FR (axle → +X)
        { type: 'wheel',      color: 0x111111, rot: 180, tilt: null, x: -2, hy: 0, z: -2 }, // RL (axle → -X)
        { type: 'wheel',      color: 0x111111, rot:   0, tilt: null, x:  1, hy: 0, z: -2 }, // RR (axle → +X)
      ];

      defs.forEach(({ type, color, rot, tilt, x, hy, z }) => {
        const group = createBlockMesh(type, color, rot, tilt);
        group.position.set(x, hy * 0.5, z);
        scene.add(group);
        const cells = getOccupiedCells(x, hy, z, type, rot, tilt);
        cells.forEach(k => occupiedGrid.set(k, group));
        group.traverse(c => {
          if (c.isMesh) { c.userData.rootGroup = group; blockMeshes.push(c); }
        });
        blocksHistory.push({ group, cells, type, color, rot, tilt });
      });

      updateBlockCount();
      autoSave();
    }

    function animate(now = 0) {
      requestAnimationFrame(animate);

      if (gameMode === 'build') {
        if (isJoystickActive) {
          cameraTheta += joyVec.x * 0.04;
          cameraPhi   += joyVec.y * 0.03;
          cameraPhi = Math.max(0.05, Math.min(Math.PI / 2 - 0.05, cameraPhi));
          updateCameraPosition();
        }
        updateRaycast();
      } else if (gameMode === 'fps') {
        updateFPS(now);
      } else if (gameMode === 'survival') {
        updateSurvival(now);
      }

      renderer.render(scene, camera);
    }
    animate();

    // PWA サービスワーカー登録 + 自動更新
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').then(reg => {
          // 新しい SW が見つかったら即適用を要求
          reg.addEventListener('updatefound', () => {
            const newSW = reg.installing;
            newSW.addEventListener('statechange', () => {
              if (newSW.state === 'installed' && navigator.serviceWorker.controller) {
                newSW.postMessage({ type: 'SKIP_WAITING' });
              }
            });
          });
          // 定期チェック（30秒ごとに sw.js が更新されていないか確認）
          setInterval(() => reg.update(), 30000);
        });
        // SW が切り替わったらページをリロードして最新版を適用
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          window.location.reload();
        });
      });
    }
  </script>
</body>
</html>
